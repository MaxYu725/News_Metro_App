name: Probe news source candidates

on:
  workflow_dispatch:
  push:
    branches:
      - feature/ns2a-inmedia-upstream-probe
    paths:
      - .github/scripts/probe-news-source-candidates.py
      - .github/workflows/probe-news-source-candidates.yml

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Probe candidate sources
        run: python3 .github/scripts/probe-news-source-candidates.py

      - name: Upload candidate report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: news-source-candidate-probe
          path: news-source-candidate-probe.json
          if-no-files-found: warn
          retention-days: 7
