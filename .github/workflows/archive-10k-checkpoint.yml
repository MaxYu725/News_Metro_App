name: Archive 10k checkpoint

on:
  push:
    branches:
      - diagnostic/ns2c3p2-10k-checkpoint
    paths:
      - .github/workflows/archive-10k-checkpoint.yml

permissions:
  contents: read

jobs:
  checkpoint:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: production
    env:
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
      API_BASE: https://news-proxy.maxyu0725us.workers.dev
      ARCHIVE_ID: a3db6dc1-599c-4ace-b12c-142e56c3734a
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install pinned Wrangler
        working-directory: worker
        run: npm install --ignore-scripts --no-audit --no-fund

      - name: Inventory archive and backfill state
        shell: bash
        run: |
          set -euo pipefail
          cd worker
          npx wrangler d1 execute ARCHIVE_01 --remote --json \
            --command "SELECT COUNT(*) AS total, SUM(CASE WHEN source='香港01' THEN 1 ELSE 0 END) AS hk01, SUM(CASE WHEN source='巴士的報' THEN 1 ELSE 0 END) AS bastille, MIN(pubDate) AS oldest, MAX(pubDate) AS newest FROM articles" \
            > /tmp/inventory.json
          npx wrangler d1 execute ARCHIVE_01 --remote --json \
            --command "SELECT source,COUNT(*) AS n,MIN(pubDate) AS oldest,MAX(pubDate) AS newest FROM articles GROUP BY source ORDER BY source" \
            > /tmp/source-ranges.json
          npx wrangler d1 execute ARCHIVE_01 --remote --json \
            --command "SELECT category,COUNT(*) AS n FROM articles GROUP BY category ORDER BY n DESC" \
            > /tmp/categories.json
          npx wrangler d1 execute ARCHIVE_01 --remote --json \
            --command "SELECT source_key,cursor,pages_fetched,rows_inserted,last_pubDate,exhausted FROM archive_backfill_state ORDER BY source_key" \
            > /tmp/state.json
          npx wrangler d1 execute ARCHIVE_01 --remote --json \
            --command "SELECT status,generated_rows,before_rows FROM archive_backfill_runs WHERE batch_id='ns2c3-010r1'" \
            > /tmp/run.json
          npx wrangler d1 execute ARCHIVE_01 --remote --json \
            --command "SELECT (SELECT COUNT(*) FROM archive_backfill_run_items WHERE batch_id='ns2c3-010r1') AS replay_items, (SELECT COUNT(*) FROM archive_backfill_run_state WHERE batch_id='ns2c3-010r1') AS replay_states" \
            > /tmp/replay.json
          npx wrangler d1 execute ARCHIVE_01 --remote --json \
            --command "SELECT id,title,pubDate,source FROM articles WHERE source='巴士的報' ORDER BY pubDate ASC,id ASC LIMIT 30" \
            > /tmp/oldest-bastille.json
          node <<'NODE'
          const fs=require('fs');
          const unwrap=p=>{const f=Array.isArray(p)?p[0]:p?.result?.[0];return {rows:f?.results||f?.result?.results||[],meta:f?.meta||f?.result?.meta||{}}};
          const inv=unwrap(JSON.parse(fs.readFileSync('/tmp/inventory.json','utf8')));
          const r=inv.rows[0]||{};
          if(Number(r.total)!==10000) throw new Error(`expected 10000 rows, got ${r.total}`);
          if(Number(r.hk01)!==4541||Number(r.bastille)!==5459) throw new Error(`unexpected source counts hk01=${r.hk01} bastille=${r.bastille}`);
          console.log(`ARCHIVE inventory total=${r.total} hk01=${r.hk01} bastille=${r.bastille} oldest=${r.oldest} newest=${r.newest} size=${inv.meta.size_after||0}`);
          const ranges=unwrap(JSON.parse(fs.readFileSync('/tmp/source-ranges.json','utf8'))).rows;
          console.log('SOURCE_RANGES '+ranges.map(x=>`${x.source}:${x.n}:${x.oldest}->${x.newest}`).join(' | '));
          const cats=unwrap(JSON.parse(fs.readFileSync('/tmp/categories.json','utf8'))).rows;
          console.log('CATEGORIES '+cats.map(x=>`${x.category}:${x.n}`).join(', '));
          const states=unwrap(JSON.parse(fs.readFileSync('/tmp/state.json','utf8'))).rows;
          const hk=states.filter(x=>String(x.source_key).startsWith('hk01:'));
          const exhausted=hk.filter(x=>Number(x.exhausted)===1).length;
          console.log(`HK01_STATE total=${hk.length} exhausted=${exhausted} active=${hk.length-exhausted}`);
          for(const x of hk) console.log(`HK01_STATE_ROW ${x.source_key} cursor=${x.cursor||''} pages=${x.pages_fetched||0} rows=${x.rows_inserted||0} last=${x.last_pubDate||''} exhausted=${x.exhausted||0}`);
          const bastille=states.find(x=>x.source_key==='bastille:rss');
          if(bastille) console.log(`BASTILLE_STATE cursor=${bastille.cursor} pages=${bastille.pages_fetched} rows=${bastille.rows_inserted} last=${bastille.last_pubDate} exhausted=${bastille.exhausted}`);
          const run=unwrap(JSON.parse(fs.readFileSync('/tmp/run.json','utf8'))).rows[0]||{};
          if(run.status!=='completed'||Number(run.generated_rows)!==1000||Number(run.before_rows)!==9000) throw new Error(`batch 010r1 not completed: ${JSON.stringify(run)}`);
          const replay=unwrap(JSON.parse(fs.readFileSync('/tmp/replay.json','utf8'))).rows[0]||{};
          if(Number(replay.replay_items)!==0||Number(replay.replay_states)!==0) throw new Error(`completed replay payload not cleaned: ${JSON.stringify(replay)}`);
          console.log(`BATCH_010R1 status=${run.status} replay_items=${replay.replay_items} replay_states=${replay.replay_states}`);
          const oldest=unwrap(JSON.parse(fs.readFileSync('/tmp/oldest-bastille.json','utf8'))).rows;
          let chosen=null, term='';
          for(const item of oldest){
            const groups=String(item.title||'').match(/[\u3400-\u9fff]{4,}/gu)||[];
            if(groups.length){chosen=item; term=Array.from(groups[0]).slice(0,4).join(''); if(term.length>=3) break;}
          }
          if(!chosen||term.length<3) throw new Error('unable to derive old Bastille search term');
          console.log(`OLD_BASTILLE sample=${chosen.pubDate} title=${chosen.title}`);
          console.log(`OLD_BASTILLE term=${term}`);
          fs.appendFileSync(process.env.GITHUB_ENV,`OLD_TERM=${term}\n`);
          NODE

      - name: Benchmark archive FTS
        shell: bash
        run: |
          set -euo pipefail
          cd worker
          i=0
          for term in '香港政府' '特朗普' '婦人油麻地' "$OLD_TERM"; do
            i=$((i+1))
            TERM="$term" node <<'NODE' > /tmp/fts-sql.txt
          const term=process.env.TERM.replace(/'/g,"''");
          process.stdout.write(`SELECT a.id,a.pubDate,a.source,a.title FROM articles_fts JOIN articles a ON a.rowid=articles_fts.rowid WHERE articles_fts MATCH '${term}' ORDER BY a.pubDate DESC,a.id DESC LIMIT 20`);
          NODE
            sql=$(cat /tmp/fts-sql.txt)
            npx wrangler d1 execute ARCHIVE_01 --remote --json --command "$sql" > "/tmp/fts-${i}.json"
            TERM="$term" FILE="/tmp/fts-${i}.json" node <<'NODE'
          const fs=require('fs'); const p=JSON.parse(fs.readFileSync(process.env.FILE,'utf8'));
          const f=Array.isArray(p)?p[0]:p?.result?.[0]; const rows=f?.results||f?.result?.results||[]; const m=f?.meta||f?.result?.meta||{};
          console.log(`FTS term=${process.env.TERM} results=${rows.length} rows_read=${m.rows_read??'n/a'} sql_ms=${m.duration??m.timings?.sql_duration_ms??'n/a'} region=${m.served_by_region??'n/a'} primary=${m.served_by_primary??'n/a'}`);
          if(process.env.TERM===process.env.OLD_TERM && rows.length===0) throw new Error('old Bastille term missing from archive FTS');
          NODE
          done

      - name: Benchmark production live plus archive and cursor
        shell: bash
        run: |
          set -euo pipefail
          node <<'NODE'
          const {performance}=require('perf_hooks');
          const terms=['香港政府','特朗普','婦人油麻地',process.env.OLD_TERM];
          const base=process.env.API_BASE+'/api/search';
          let cursorCandidate=null;
          async function query(term,cursor=''){
            const u=new URL(base); u.searchParams.set('q',term); u.searchParams.set('scope','all'); if(cursor)u.searchParams.set('cursor',cursor);
            const t=performance.now(); const res=await fetch(u,{headers:{accept:'application/json'}}); const body=await res.json(); const ms=performance.now()-t;
            if(!res.ok||!body.success) throw new Error(`API ${res.status} ${term}: ${JSON.stringify(body).slice(0,300)}`);
            return {ms,body};
          }
          (async()=>{
            for(const term of terms){
              const samples=[]; let first=null;
              for(let i=0;i<2;i++){const x=await query(term); samples.push(x.ms); if(!first)first=x;}
              samples.sort((a,b)=>a-b);
              const ids=(first.body.data||[]).map(x=>String(x.id||x.link||''));
              console.log(`API term=${term} samples_ms=${samples.map(x=>x.toFixed(1)).join(',')} results=${ids.length} hasMore=${!!first.body.hasMore} cursor=${first.body.nextCursor?'yes':'no'}`);
              if(term===process.env.OLD_TERM && ids.length===0) throw new Error('old Bastille term missing from production scope=all');
              if(!cursorCandidate && first.body.nextCursor) cursorCandidate={term,first,ids};
            }
            if(!cursorCandidate) throw new Error('no cursor candidate');
            const second=await query(cursorCandidate.term,cursorCandidate.first.body.nextCursor);
            const ids2=(second.body.data||[]).map(x=>String(x.id||x.link||''));
            const overlap=ids2.filter(x=>cursorCandidate.ids.includes(x));
            console.log(`CURSOR term=${cursorCandidate.term} page1=${cursorCandidate.ids.length} page2=${ids2.length} page2_ms=${second.ms.toFixed(1)} overlap=${overlap.length} next=${second.body.nextCursor?'yes':'no'}`);
            if(overlap.length) throw new Error(`cursor overlap ${overlap.slice(0,3).join(',')}`);
          })().catch(e=>{console.error(e);process.exit(1)});
          NODE

      - name: Verify read replication and project capacity
        shell: bash
        run: |
          set -euo pipefail
          curl -sS --retry 2 --retry-delay 1 \
            -H "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" \
            "https://api.cloudflare.com/client/v4/accounts/${CLOUDFLARE_ACCOUNT_ID}/d1/database/${ARCHIVE_ID}" \
            > /tmp/resource.json
          jq -e '.success == true and .result.read_replication.mode == "auto"' /tmp/resource.json >/dev/null
          jq -r '"REPLICATION mode=\(.result.read_replication.mode) primary=\(.result.primary_location_hint // "unknown") file_size=\(.result.file_size // 0)"' /tmp/resource.json
          node <<'NODE'
          const size7=60874752;
          const size10=84365312;
          const delta=size10-size7;
          const perRow=delta/3000;
          const remaining=300000000-size10;
          const projected=Math.floor(remaining/perRow);
          console.log(`CAPACITY 7k_size=${size7} 10k_size=${size10} delta=${delta} bytes_per_added_row=${perRow.toFixed(1)} remaining_to_300MB=${remaining} projected_additional_rows=${projected} projected_total_rows=${10000+projected}`);
          if(size10>=150000000) throw new Error('unexpectedly above 150MB checkpoint');
          NODE

      - name: Checkpoint complete
        run: echo 'NS2C3P2 10k read-only checkpoint PASS'
