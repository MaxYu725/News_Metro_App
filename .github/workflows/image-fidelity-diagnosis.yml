name: Image fidelity diagnosis

on:
  push:
    branches:
      - agent/image-fidelity-diagnosis
    paths:
      - .github/workflows/image-fidelity-diagnosis.yml

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Compare live Metro and HK01 image representations
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import hashlib, json, re, urllib.parse, urllib.request
          from pathlib import Path

          api_base = 'https://news-proxy.maxyu0725us.workers.dev'
          ua = 'Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 Chrome/151 Safari/537.36'

          def get(url, headers=None, timeout=30):
              h = {'User-Agent': ua}
              if headers: h.update(headers)
              req = urllib.request.Request(url, headers=h)
              with urllib.request.urlopen(req, timeout=timeout) as r:
                  return r.status, dict(r.headers.items()), r.read(), r.geturl()

          print('=== Pick a current Metro article carrying HK01 image URLs ===')
          hit = None
          for page in range(0, 12):
              _, _, body, _ = get(f'{api_base}/api/news/latest?page={page}')
              rows = (json.loads(body).get('data') or [])
              for row in rows:
                  if row.get('imageUrl') and 'hk01' in (row.get('link') or ''):
                      hit = row
                      break
              if hit: break
          if not hit:
              raise SystemExit('NO_IMAGE_ARTICLE_FOUND')

          print('title=', hit.get('title'))
          print('link=', hit.get('link'))
          print('metro_imageUrl=', hit.get('imageUrl'))
          imgs = hit.get('images')
          if isinstance(imgs, str):
              try: imgs = json.loads(imgs)
              except Exception: imgs = []
          if not isinstance(imgs, list): imgs = []
          print('metro_images_count=', len(imgs))
          for i,u in enumerate(imgs[:8]): print(f'metro_images[{i}]=', u)

          m = re.search(r'/(\d+)(?:/|$)', urllib.parse.urlparse(hit['link']).path)
          if not m: raise SystemExit('NO_ARTICLE_ID')
          article_id = m.group(1)
          print('article_id=', article_id)

          official_api = f'https://web-data.api.hk01.com/v2/page/article/{article_id}'
          _, _, official_body, _ = get(official_api)
          official = json.loads(official_body)

          image_objects = []
          url_entries = []
          def walk(obj, path='root'):
              if isinstance(obj, dict):
                  keys = {str(k).lower() for k in obj.keys()}
                  if 'cdnurl' in keys or 'originalimage' in keys or ('originalwidth' in keys and 'originalheight' in keys):
                      image_objects.append((path, obj))
                  for k,v in obj.items(): walk(v, f'{path}.{k}')
              elif isinstance(obj, list):
                  for i,v in enumerate(obj): walk(v, f'{path}[{i}]')
              elif isinstance(obj, str) and obj.startswith('http'):
                  if any(t in path.lower() for t in ('image','cdnurl')):
                      url_entries.append((path, obj))
          walk(official)

          print('\n=== HK01 API image objects (first 12) ===')
          for path,obj in image_objects[:12]:
              print('OBJECT_PATH', path)
              print(json.dumps(obj, ensure_ascii=False, indent=2)[:5000])

          official_urls = []
          for path,u in url_entries:
              if u not in official_urls: official_urls.append(u)

          app_urls = [hit.get('imageUrl')] + imgs
          app_urls = [u for u in dict.fromkeys(app_urls) if isinstance(u,str) and u]

          print('\n=== URL relationships ===')
          for i,u in enumerate(app_urls[:8]):
              print('APP', i, u)
              print(' EXACT_IN_HK01_API=', u in official_urls)
          print('official_image_url_count=', len(official_urls))
          for i,u in enumerate(official_urls[:12]): print('HK01', i, u)

          compare_urls = list(dict.fromkeys(app_urls[:2] + official_urls[:4]))

          def fetch_variant(url, label, accept):
              try:
                  status, headers, body, final = get(url, {'Accept': accept})
                  Path(f'/tmp/{label}.bin').write_bytes(body)
                  print('VARIANT', label)
                  print(' status=', status)
                  print(' requested=', url)
                  print(' final=', final)
                  print(' content-type=', headers.get('Content-Type') or headers.get('content-type'))
                  print(' content-length=', headers.get('Content-Length') or headers.get('content-length'))
                  print(' content-encoding=', headers.get('Content-Encoding') or headers.get('content-encoding'))
                  print(' vary=', headers.get('Vary') or headers.get('vary'))
                  print(' bytes=', len(body))
                  print(' sha256=', hashlib.sha256(body).hexdigest())
              except Exception as e:
                  print('VARIANT_ERROR', label, repr(e))

          print('\n=== CDN representation comparison ===')
          for idx,u in enumerate(compare_urls):
              print('\nURL_INDEX', idx)
              fetch_variant(u, f'i{idx}-browser', 'image/avif,image/webp,image/apng,image/svg+xml,image/*,*/*;q=0.8')
              fetch_variant(u, f'i{idx}-generic', '*/*')
              fetch_variant(u, f'i{idx}-jpeg', 'image/jpeg,image/png,*/*;q=0.5')
          PY

      - name: Inspect downloaded image signatures and dimensions
        if: always()
        run: |
          set +e
          for f in /tmp/i*.bin; do
            [ -e "$f" ] || continue
            echo "--- $f"
            ls -l "$f"
            file "$f"
          done
