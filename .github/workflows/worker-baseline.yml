name: Validate Worker baseline

on:
  pull_request:
    branches:
      - main
    paths:
      - worker/**
      - .github/scripts/validate-worker-baseline.py
      - .github/scripts/validate-search-fts.sh
      - .github/scripts/validate-adaptive-retention.sh
      - .github/scripts/validate-archive-search.sh
      - .github/scripts/archive-backfill-production-audit.sh
      - .github/workflows/worker-baseline.yml
      - .github/workflows/archive-backfill.yml
  push:
    branches:
      - agent/**
    paths:
      - worker/**
      - .github/scripts/validate-worker-baseline.py
      - .github/scripts/validate-search-fts.sh
      - .github/scripts/validate-adaptive-retention.sh
      - .github/scripts/validate-archive-search.sh
      - .github/scripts/archive-backfill-production-audit.sh
      - .github/workflows/worker-baseline.yml
      - .github/workflows/archive-backfill.yml

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate Worker config, security contract, and D1 schema
        run: python3 .github/scripts/validate-worker-baseline.py

      - name: Validate Worker JavaScript syntax
        run: |
          node --check worker/src/index.js
          node --check worker/src/security.js
          node --check worker/src/search.js
          node --check worker/src/retention.js
          node --check worker/src/sources/bastille.js
          node --check worker/src/archive-backfill.js
          node --check worker/scripts/archive-backfill.mjs
          node --check worker/test/archive-backfill.test.mjs
          bash -n .github/scripts/validate-search-fts.sh
          bash -n .github/scripts/validate-adaptive-retention.sh
          bash -n .github/scripts/validate-archive-search.sh
          bash -n .github/scripts/archive-backfill-production-audit.sh

      - name: Install pinned Wrangler
        working-directory: worker
        run: npm install --ignore-scripts --no-audit --no-fund

      - name: Validate D1 FTS5 migration locally
        run: bash .github/scripts/validate-search-fts.sh

      - name: Validate adaptive retention migration locally
        run: bash .github/scripts/validate-adaptive-retention.sh

      - name: Validate archive D1 migration locally
        run: bash .github/scripts/validate-archive-search.sh

      - name: Run Worker tests
        working-directory: worker
        run: npm test

      - name: Wrangler dry-run compile
        working-directory: worker
        run: npm run check
