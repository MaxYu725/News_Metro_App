name: Image quality browser gate

on:
  push:
    branches:
      - agent/original-image-on-demand
    paths:
      - .github/workflows/image-quality-browser-test.yml

permissions:
  contents: read

jobs:
  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Checkout feature branch
        uses: actions/checkout@v4
        with:
          ref: agent/original-image-on-demand

      - name: Install Selenium
        run: python3 -m pip install --quiet selenium

      - name: Run local app
        run: |
          python3 -m http.server 8765 --bind 127.0.0.1 >/tmp/metro-http.log 2>&1 &
          echo $! >/tmp/metro-http.pid

      - name: Verify HD stays user initiated
        env:
          TARGET_URL: 'https://cdn.hk01.com/di/media/images/dw/20260817/1165998298943721472421937.png/wu3KNfgiQF79tDWsMvK0NKr_WPw-uGYXO12X6ztdl-s'
        run: |
          python3 - <<'PY'
          import os, time
          from selenium import webdriver
          from selenium.webdriver.common.by import By
          from selenium.webdriver.support.ui import WebDriverWait

          target = os.environ['TARGET_URL']
          hd = target + '?v=w1920'

          options = webdriver.ChromeOptions()
          options.add_argument('--headless=new')
          options.add_argument('--no-sandbox')
          options.add_argument('--disable-dev-shm-usage')
          options.add_argument('--window-size=1280,900')

          driver = webdriver.Chrome(options=options)
          wait = WebDriverWait(driver, 30)
          try:
              driver.get('http://127.0.0.1:8765/')
              wait.until(lambda d: d.execute_script('return document.readyState') == 'complete')
              wait.until(lambda d: d.find_element(By.ID, 'lightbox-overlay'))

              result = driver.execute_async_script('''
                  const src = arguments[0];
                  const done = arguments[arguments.length - 1];
                  import('./lightbox.js')
                    .then(module => { module.openLightbox(src); done('ok'); })
                    .catch(error => done('error:' + error.message));
              ''', target)
              assert result == 'ok', result

              image = driver.find_element(By.ID, 'lightbox-img')
              quality = driver.find_element(By.ID, 'lightbox-quality')

              wait.until(lambda d: d.execute_script('return arguments[0].naturalWidth', image) == 1080)
              wait.until(lambda d: quality.is_displayed() and quality.text == '高清')

              resources_before = driver.execute_script(
                  "return performance.getEntriesByType('resource').map(entry => entry.name)"
              )
              assert not any('v=w1920' in url and 'wu3KNfgiQF79' in url for url in resources_before), resources_before
              print('DEFAULT_PASS naturalWidth=1080 w1920_requests=0')

              quality.click()
              wait.until(lambda d: d.execute_script('return arguments[0].naturalWidth', image) == 1920)
              wait.until(lambda d: quality.text == '一般' and quality.get_attribute('aria-pressed') == 'true')

              resources_after = driver.execute_script(
                  "return performance.getEntriesByType('resource').map(entry => entry.name)"
              )
              assert any('v=w1920' in url and 'wu3KNfgiQF79' in url for url in resources_after), resources_after
              print('HD_CLICK_PASS naturalWidth=1920')

              quality.click()
              wait.until(lambda d: d.execute_script('return arguments[0].naturalWidth', image) == 1080)
              wait.until(lambda d: quality.text == '高清' and quality.get_attribute('aria-pressed') == 'false')
              print('NORMAL_TOGGLE_PASS naturalWidth=1080')
          finally:
              driver.quit()
          PY
