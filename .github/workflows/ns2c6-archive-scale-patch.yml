name: NS2C6 archive scale patch

on:
  push:
    branches:
      - feature/ns2c6-archive-scale

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/ns2c6-archive-scale
          fetch-depth: 0

      - name: Apply shard-ready and bounded-scan changes
        shell: bash
        run: |
          set -euo pipefail
          python3 <<'PY'
          from pathlib import Path

          p = Path('worker/src/index.js')
          text = p.read_text()
          old = "import {\n  decodeSearchCursor,\n"
          new = "import { archiveDatabases, sourceCountsAcrossDatabases } from './archive-shards.js';\nimport {\n  decodeSearchCursor,\n"
          if old not in text:
              raise SystemExit('index import anchor missing')
          text = text.replace(old, new, 1)

          old = """        const archiveDb = env.ARCHIVE_01?.withSession
          ? env.ARCHIVE_01.withSession('first-unconstrained')
          : env.DB;
        const { results } = await archiveDb.prepare(
          `SELECT source, COUNT(*) AS count FROM articles GROUP BY source`,
        ).all();
        const bySource = new Map((results || []).map(row => [String(row.source || ''), Number(row.count || 0)]));
"""
          new = """        const archives = archiveDatabases(env);
        const databases = archives.length > 0 ? archives : [env.DB].filter(Boolean);
        const bySource = await sourceCountsAcrossDatabases(databases);
"""
          if old not in text:
              raise SystemExit('source stats anchor missing')
          text = text.replace(old, new, 1)

          old = """        const archiveSession = env.ARCHIVE_01.withSession('first-unconstrained');
        const { rows, hasMore, nextCursor } = await searchArticlesAcrossDatabases(
          [env.DB, archiveSession],
"""
          new = """        const archives = archiveDatabases(env);
        const { rows, hasMore, nextCursor } = await searchArticlesAcrossDatabases(
          [env.DB, ...archives],
"""
          if old not in text:
              raise SystemExit('archive search anchor missing')
          text = text.replace(old, new, 1)
          p.write_text(text)

          p = Path('.github/workflows/hk01-background-backfill.yml')
          text = p.read_text()
          old = """          if (( size >= 300000000 )); then
            echo 'halted=true' >> \"$GITHUB_OUTPUT\"
            echo \"::notice::Background backfill paused at archive start guard: ${size} bytes\"
            exit 0
          fi
          echo 'halted=false' >> \"$GITHUB_OUTPUT\"

          npx wrangler d1 execute ARCHIVE_01 --remote --json \\
            --command \"SELECT id,link,source,pubDate FROM articles WHERE source='香港01' ORDER BY pubDate DESC,id DESC\" \\
            > /tmp/hk01-background-existing.json
          npx wrangler d1 execute ARCHIVE_01 --remote --json \\
            --command \"SELECT source_key,cursor,pages_fetched,rows_inserted,last_pubDate,exhausted FROM archive_backfill_state WHERE source_key='hk01:search'\" \\
            > /tmp/hk01-background-state.json
          echo \"Background snapshot: rows=${total}, size_bytes=${size}\"
"""
          new = """          npx wrangler d1 execute ARCHIVE_01 --remote --json \\
            --command \"SELECT source_key,cursor,pages_fetched,rows_inserted,last_pubDate,exhausted FROM archive_backfill_state WHERE source_key='hk01:search'\" \\
            > /tmp/hk01-background-state.json

          exhausted=$(node <<'NODE'
          const fs = require('fs');
          const p = JSON.parse(fs.readFileSync('/tmp/hk01-background-state.json','utf8'));
          const first = Array.isArray(p) ? p[0] : p?.result?.[0];
          const row = first?.results?.[0] || first?.result?.results?.[0];
          process.stdout.write(String(Number(row?.exhausted || 0)));
          NODE
          )

          if (( size >= 300000000 )); then
            echo 'halted=true' >> \"$GITHUB_OUTPUT\"
            echo \"::notice::Background backfill paused at archive start guard: ${size} bytes\"
            exit 0
          fi
          if [[ \"$exhausted\" == '1' ]]; then
            echo 'halted=true' >> \"$GITHUB_OUTPUT\"
            echo '::notice::Background backfill source is exhausted; no further archive writes are required.'
            exit 0
          fi
          echo 'halted=false' >> \"$GITHUB_OUTPUT\"

          overlap_start=$(node <<'NODE'
          const fs = require('fs');
          const p = JSON.parse(fs.readFileSync('/tmp/hk01-background-state.json','utf8'));
          const first = Array.isArray(p) ? p[0] : p?.result?.[0];
          const row = first?.results?.[0] || first?.result?.results?.[0];
          const cursor = Number.parseInt(row?.cursor || '', 10);
          const earliest = 1451606400;
          if (!Number.isSafeInteger(cursor) || cursor <= earliest) process.exit(0);
          const start = Math.max(earliest, cursor - 46 * 86400);
          process.stdout.write(new Date(start * 1000).toISOString());
          NODE
          )

          if [[ -n \"$overlap_start\" ]]; then
            npx wrangler d1 execute ARCHIVE_01 --remote --json \\
              --command \"SELECT id,link,source,pubDate FROM articles WHERE source='香港01' AND pubDate >= '${overlap_start}' ORDER BY pubDate DESC,id DESC\" \\
              > /tmp/hk01-background-existing.json
            echo \"Background dedupe snapshot: bounded_46d from=${overlap_start}\"
          else
            npx wrangler d1 execute ARCHIVE_01 --remote --json \\
              --command \"SELECT id,link,source,pubDate FROM articles WHERE source='香港01' ORDER BY pubDate DESC,id DESC\" \\
              > /tmp/hk01-background-existing.json
            echo 'Background dedupe snapshot: full bootstrap scan'
          fi
          echo \"Background snapshot: rows=${total}, size_bytes=${size}\"
"""
          if old not in text:
              raise SystemExit('background snapshot anchor missing')
          text = text.replace(old, new, 1)
          p.write_text(text)

          p = Path('.deploy/worker-production.txt')
          p.write_text('NS2C6 production promotion: shard-aware archive registry, bounded HK01 dedupe scans, and daily archive watchdog. No second D1 shard is provisioned by this change.\n')
          PY

          node --check worker/src/archive-shards.js
          node --check worker/src/index.js
          node --check worker/scripts/hk01-search-backfill.mjs

      - name: Run Worker tests
        working-directory: worker
        run: npm install --ignore-scripts --no-audit --no-fund && npm test

      - name: Commit patch
        shell: bash
        run: |
          set -euo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git rm .github/workflows/ns2c6-archive-scale-patch.yml
          git add worker/src/index.js .github/workflows/hk01-background-backfill.yml .deploy/worker-production.txt
          git commit -m 'NS2C6: scale archive background path'
          git push origin HEAD:feature/ns2c6-archive-scale
