name: MUI-3C final cleanup

on:
  push:
    branches:
      - agent/mui3c-reader-controller-cleanup
    paths:
      - .github/workflows/mui3c-transform.yml

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout feature branch
        uses: actions/checkout@v4
        with:
          ref: agent/mui3c-reader-controller-cleanup
          fetch-depth: 0

      - name: Remove legacy inline Reader CSS
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('style.css')
          text = path.read_text()
          start = text.index('.metro-tile.expanded {')
          end_marker = ".article-content-body {\n    transition: opacity 0.18s ease-in-out;\n    user-select: text;\n    -webkit-user-select: text;\n}\n"
          end = text.index(end_marker, start) + len(end_marker)
          replacement = '''.tile-preview {
              position: relative;
              z-index: 10;
              transition: opacity 0.15s ease;
              width: 100%;
              display: flex;
              flex-direction: column;
          }
          '''
          text = text[:start] + replacement + text[end:]
          path.write_text(text)
          PY

      - name: Validate independent Reader architecture
        run: |
          node --check app.js
          node --check reader-ui.js
          node --check sw.js
          ! grep -E "\.expanded|tile-details|reader-preparing|sourceObserver|collapseSourceTile" app.js reader-ui.js reader-ui.css style.css

      - name: Remove one-shot transform tooling
        run: |
          git rm scripts/mui3c-transform.mjs
          git rm .github/workflows/mui3c-transform.yml

      - name: Commit final cleanup
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add style.css
          git commit -m "MUI-3C: remove legacy inline Reader architecture"
          git push origin HEAD:agent/mui3c-reader-controller-cleanup
