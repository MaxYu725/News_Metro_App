name: HK01 archive exhaustion probe

on:
  push:
    branches:
      - diagnostic/ns2c3r3-hk01-exhaustion
    paths:
      - .github/workflows/hk01-exhaustion-probe.yml

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: production
    env:
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - name: Install pinned Wrangler
        working-directory: worker
        run: npm install --ignore-scripts --no-audit --no-fund
      - name: Read persisted state
        shell: bash
        run: |
          set -euo pipefail
          cd worker
          npx wrangler d1 execute ARCHIVE_01 --remote --json \
            --command "SELECT source_key,cursor,pages_fetched,rows_inserted,last_pubDate,exhausted FROM archive_backfill_state WHERE source_key LIKE 'hk01:%' ORDER BY source_key" \
            > /tmp/state.json
          node <<'NODE'
          const p=require('/tmp/state.json'); const f=Array.isArray(p)?p[0]:p?.result?.[0]; const rows=f?.results||f?.result?.results||[];
          for(const r of rows) console.log(`STATE ${r.source_key} cursor=${r.cursor||''} pages=${r.pages_fetched||0} rows=${r.rows_inserted||0} last=${r.last_pubDate||''} exhausted=${r.exhausted||0}`);
          require('fs').writeFileSync('/tmp/state-rows.json',JSON.stringify(rows));
          NODE
      - name: Probe each HK01 persisted cursor and bootstrap head
        shell: bash
        run: |
          set -euo pipefail
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          import {HK01_HISTORICAL_ZONES,fetchHk01HistoricalPage} from './worker/src/archive-backfill.js';
          const states=JSON.parse(fs.readFileSync('/tmp/state-rows.json','utf8'));
          const map=new Map(states.map(r=>[r.source_key,r]));
          let active=0, nextable=0, exhausted=0, usable=0;
          for(const zone of HK01_HISTORICAL_ZONES){
            const key=`hk01:zone:${zone.zoneId}`;
            const st=map.get(key)||{};
            const cursor=String(st.cursor||'');
            if(Number(st.exhausted||0)===1){
              exhausted++;
              console.log(`ZONE ${zone.zoneId}/${zone.category} persisted_exhausted=1 cursor=${cursor||'<empty>'}`);
              continue;
            }
            active++;
            const page=await fetchHk01HistoricalPage(zone,cursor);
            usable+=page.articles.length;
            if(page.nextCursor && page.nextCursor!==cursor) nextable++;
            const dates=page.articles.map(x=>x.pubDate).filter(Boolean).sort();
            console.log(`ZONE ${zone.zoneId}/${zone.category} cursor=${cursor||'<empty>'} articles=${page.articles.length} min=${dates[0]||''} max=${dates.at(-1)||''} next=${page.nextCursor||'<none>'}`);
            await new Promise(r=>setTimeout(r,120));
          }
          console.log(`SUMMARY active=${active} persisted_exhausted=${exhausted} nextable=${nextable} immediate_articles=${usable}`);
          NODE
      - run: echo 'HK01 exhaustion read-only probe PASS'
