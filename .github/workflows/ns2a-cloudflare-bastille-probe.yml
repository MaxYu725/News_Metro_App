name: NS2A Cloudflare Bastille probe

on:
  push:
    branches:
      - feature/ns2a-inmedia-upstream-probe
    paths:
      - .github/workflows/ns2a-cloudflare-bastille-probe.yml

permissions:
  contents: read

jobs:
  cloudflare-probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: production
    env:
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
      PROBE_NAME: metro-news-ns2a-bastille-probe
      PROBE_URL: https://metro-news-ns2a-bastille-probe.maxyu0725us.workers.dev
    steps:
      - name: Validate credentials
        run: |
          set -euo pipefail
          test -n "${CLOUDFLARE_ACCOUNT_ID:-}"
          test -n "${CLOUDFLARE_API_TOKEN:-}"

      - name: Write isolated probe Worker
        run: |
          cat > /tmp/ns2a-bastille-probe.js <<'EOF'
          const FEED = 'https://www.bastillepost.com/hongkong/feed';
          const UA = 'MetroNews-NS2A-Probe/1.0';

          function decodeXml(value) {
            return value
              .replaceAll('&amp;', '&')
              .replaceAll('&lt;', '<')
              .replaceAll('&gt;', '>')
              .replaceAll('&quot;', '"')
              .replaceAll('&#039;', "'");
          }

          async function fetchUpstream(url) {
            return fetch(url, {
              headers: {
                'user-agent': UA,
                'accept': 'application/rss+xml, application/xml, text/xml, text/html;q=0.9, */*;q=0.5',
                'accept-language': 'zh-HK,zh-TW;q=0.9,en;q=0.6',
              },
              redirect: 'follow',
            });
          }

          export default {
            async fetch() {
              const feedResponse = await fetchUpstream(FEED);
              const feedText = await feedResponse.text();
              const itemCount = (feedText.match(/<item[ >]/g) || []).length;
              const links = [...feedText.matchAll(/<item[\s\S]*?<link>(?:<!\[CDATA\[)?([^<\]]+)/g)]
                .slice(0, 3)
                .map(match => decodeXml(match[1].trim()));

              const articles = [];
              for (const link of links) {
                try {
                  const response = await fetchUpstream(link);
                  const body = await response.text();
                  articles.push({
                    url: link,
                    status: response.status,
                    bytes: new TextEncoder().encode(body).byteLength,
                    contentType: response.headers.get('content-type') || '',
                    blocked: /cf-chl-|captcha|access denied|attention required/i.test(body),
                  });
                } catch (error) {
                  articles.push({ url: link, error: String(error) });
                }
              }

              return Response.json({
                feed: {
                  status: feedResponse.status,
                  bytes: new TextEncoder().encode(feedText).byteLength,
                  itemCount,
                  contentType: feedResponse.headers.get('content-type') || '',
                },
                articles,
              });
            }
          };
          EOF

      - name: Deploy isolated probe Worker
        run: |
          set -euo pipefail
          npm exec --yes wrangler@4.118.0 -- deploy /tmp/ns2a-bastille-probe.js \
            --name "$PROBE_NAME" \
            --compatibility-date 2026-08-17

      - name: Verify Bastille through Cloudflare egress
        run: |
          set -euo pipefail
          sleep 2
          curl -sS --retry 2 --retry-delay 1 "$PROBE_URL" | tee /tmp/result.json
          jq -e '.feed.status == 200' /tmp/result.json >/dev/null
          jq -e '.feed.itemCount >= 5' /tmp/result.json >/dev/null
          jq -e '[.articles[] | select(.status == 200 and .blocked == false)] | length >= 2' /tmp/result.json >/dev/null

      - name: Remove isolated probe Worker
        if: always()
        run: |
          npm exec --yes wrangler@4.118.0 -- delete "$PROBE_NAME" --force || true
