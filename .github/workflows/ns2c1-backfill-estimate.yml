name: NS2C1 dual-source backfill estimate

on:
  push:
    branches:
      - probe/ns2c1-backfill-estimate
    paths:
      - .github/workflows/ns2c1-backfill-estimate.yml

permissions:
  contents: read

jobs:
  estimate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: production
    env:
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
    steps:
      - uses: actions/checkout@v4

      - name: Install pinned Wrangler
        working-directory: worker
        run: npm install --ignore-scripts --no-audit --no-fund

      - name: Measure production D1 source payload and age distribution
        working-directory: worker
        shell: bash
        run: |
          set -euo pipefail
          npx wrangler d1 execute metro_news_db --remote --json --command "
          WITH sized AS (
            SELECT
              source,
              category,
              pubDate,
              LENGTH(CAST(COALESCE(id,'') AS BLOB)) +
              LENGTH(CAST(COALESCE(title,'') AS BLOB)) +
              LENGTH(CAST(COALESCE(link,'') AS BLOB)) +
              LENGTH(CAST(COALESCE(pubDate,'') AS BLOB)) +
              LENGTH(CAST(COALESCE(description,'') AS BLOB)) +
              LENGTH(CAST(COALESCE(category,'') AS BLOB)) +
              LENGTH(CAST(COALESCE(source,'') AS BLOB)) +
              LENGTH(CAST(COALESCE(imageUrl,'') AS BLOB)) +
              LENGTH(CAST(COALESCE(images,'') AS BLOB)) AS payload_bytes,
              LENGTH(CAST(COALESCE(description,'') AS BLOB)) AS description_bytes,
              LENGTH(CAST(COALESCE(images,'') AS BLOB)) AS images_bytes
            FROM articles
          )
          SELECT source,
                 COUNT(*) AS rows,
                 ROUND(AVG(payload_bytes),1) AS avg_payload_bytes,
                 SUM(payload_bytes) AS payload_bytes,
                 ROUND(AVG(description_bytes),1) AS avg_description_bytes,
                 ROUND(AVG(images_bytes),1) AS avg_images_bytes,
                 MIN(pubDate) AS oldest,
                 MAX(pubDate) AS newest,
                 SUM(CASE WHEN category <> 'video' AND datetime(pubDate) >= datetime('now','-1 day') THEN 1 ELSE 0 END) AS d1,
                 SUM(CASE WHEN category <> 'video' AND datetime(pubDate) >= datetime('now','-3 days') THEN 1 ELSE 0 END) AS d3,
                 SUM(CASE WHEN category <> 'video' AND datetime(pubDate) >= datetime('now','-7 days') THEN 1 ELSE 0 END) AS d7,
                 SUM(CASE WHEN category <> 'video' AND datetime(pubDate) >= datetime('now','-14 days') THEN 1 ELSE 0 END) AS d14,
                 SUM(CASE WHEN category <> 'video' AND datetime(pubDate) >= datetime('now','-30 days') THEN 1 ELSE 0 END) AS d30
          FROM sized
          GROUP BY source
          ORDER BY source;
          " | tee /tmp/source-metrics.json

          npx wrangler d1 execute metro_news_db --remote --json --command "
          WITH sized AS (
            SELECT
              LENGTH(CAST(COALESCE(id,'') AS BLOB)) +
              LENGTH(CAST(COALESCE(title,'') AS BLOB)) +
              LENGTH(CAST(COALESCE(link,'') AS BLOB)) +
              LENGTH(CAST(COALESCE(pubDate,'') AS BLOB)) +
              LENGTH(CAST(COALESCE(description,'') AS BLOB)) +
              LENGTH(CAST(COALESCE(category,'') AS BLOB)) +
              LENGTH(CAST(COALESCE(source,'') AS BLOB)) +
              LENGTH(CAST(COALESCE(imageUrl,'') AS BLOB)) +
              LENGTH(CAST(COALESCE(images,'') AS BLOB)) AS payload_bytes
            FROM articles
          )
          SELECT COUNT(*) AS rows, SUM(payload_bytes) AS logical_payload_bytes FROM sized;
          " | tee /tmp/total-metrics.json

          node <<'NODE'
          const fs = require('fs');
          const sourceDoc = JSON.parse(fs.readFileSync('/tmp/source-metrics.json','utf8'));
          const totalDoc = JSON.parse(fs.readFileSync('/tmp/total-metrics.json','utf8'));
          const first = x => Array.isArray(x) ? x[0] : x;
          const s = first(sourceDoc);
          const t = first(totalDoc);
          const size = Number(t?.meta?.size_after || s?.meta?.size_after || 0);
          const logical = Number(t?.results?.[0]?.logical_payload_bytes || 0);
          console.log('=== D1 DERIVED ===');
          console.log(JSON.stringify({
            sizeBytes: size,
            sizeMiB: +(size / 1024 / 1024).toFixed(2),
            utilizationOf500MB: +(size / 500000000 * 100).toFixed(2),
            logicalPayloadBytes: logical,
            grossAmplification: logical ? +(size / logical).toFixed(3) : null,
            sources: s?.results || []
          }, null, 2));
          NODE

      - name: Probe Bastille historical enumeration surfaces
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import email.utils, json, time, urllib.request, urllib.error, xml.etree.ElementTree as ET
          from datetime import datetime, timezone

          UA = 'MetroNews-NS2C1-Probe/1.0'
          def get(url):
              req = urllib.request.Request(url, headers={
                  'User-Agent': UA,
                  'Accept': 'application/json, application/rss+xml, application/xml, text/xml;q=0.9, */*;q=0.5',
                  'Accept-Language': 'zh-HK,zh-TW;q=0.9,en;q=0.6',
              })
              try:
                  with urllib.request.urlopen(req, timeout=20) as r:
                      body = r.read()
                      return {'ok': True, 'status': r.status, 'url': r.geturl(), 'headers': dict(r.headers), 'body': body}
              except Exception as e:
                  return {'ok': False, 'error': repr(e), 'body': b'', 'headers': {}}

          rest_urls = [
              'https://www.bastillepost.com/hongkong/wp-json/wp/v2/posts?per_page=1',
              'https://www.bastillepost.com/wp-json/wp/v2/posts?per_page=1',
          ]
          print('=== BASTILLE REST ===')
          for url in rest_urls:
              r = get(url)
              print(json.dumps({
                  'url': url, 'ok': r['ok'], 'status': r.get('status'), 'finalUrl': r.get('url'),
                  'xWpTotal': r.get('headers',{}).get('X-WP-Total'),
                  'xWpTotalPages': r.get('headers',{}).get('X-WP-TotalPages'),
                  'contentType': r.get('headers',{}).get('Content-Type'),
                  'bytes': len(r.get('body',b'')), 'error': r.get('error')
              }, ensure_ascii=False))

          print('=== BASTILLE FEED PAGING ===')
          samples = []
          for page in [1,2,3,5,10,20]:
              url = 'https://www.bastillepost.com/hongkong/feed' + ('' if page == 1 else f'?paged={page}')
              r = get(url)
              rec = {'page': page, 'url': url, 'ok': r['ok'], 'status': r.get('status'), 'bytes': len(r.get('body',b'')), 'error': r.get('error')}
              if r['ok']:
                  try:
                      root = ET.fromstring(r['body'])
                      items = root.findall('./channel/item')
                      dates=[]
                      links=[]
                      for item in items:
                          d = item.findtext('pubDate') or ''
                          l = item.findtext('link') or ''
                          if d:
                              dt=email.utils.parsedate_to_datetime(d)
                              dates.append(dt.astimezone(timezone.utc))
                          if l: links.append(l)
                      rec.update({
                          'items': len(items),
                          'newest': max(dates).isoformat() if dates else None,
                          'oldest': min(dates).isoformat() if dates else None,
                          'firstLink': links[0] if links else None,
                          'lastLink': links[-1] if links else None,
                      })
                  except Exception as e:
                      rec['parseError']=repr(e)
              samples.append(rec)
              print(json.dumps(rec, ensure_ascii=False))
              time.sleep(0.5)

          valid=[x for x in samples if x.get('items')]
          if valid:
              unique=set(x.get('firstLink') for x in valid)
              print(json.dumps({'distinctFirstLinks': len(unique), 'pagesWithItems': len(valid)}, ensure_ascii=False))
          PY
