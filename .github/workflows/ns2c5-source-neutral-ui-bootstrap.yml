name: NS2C5 source-neutral UI cleanup bootstrap

on:
  push:
    branches:
      - feature/ns2c5-source-controls

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/ns2c5-source-controls
          fetch-depth: 0

      - name: Remove stale single-source copy
        shell: bash
        run: |
          python <<'PY'
          from pathlib import Path

          replacements = {
              'app.js': [
                  (
                      '來源：香港01 · 巴士的報 · 3 個字以上搜尋歷史新聞',
                      '3 個字以上可搜尋歷史新聞',
                  ),
              ],
              'search-ui.js': [
                  (
                      "input.placeholder = '搜尋 HK01 新聞';",
                      "input.placeholder = '搜尋新聞';",
                  ),
              ],
          }

          for path, changes in replacements.items():
              p = Path(path)
              text = p.read_text()
              for old, new in changes:
                  if old not in text:
                      raise SystemExit(f'needle missing in {path}: {old!r}')
                  text = text.replace(old, new, 1)
              p.write_text(text)
          PY
          node --check app.js
          node --check search-ui.js

      - name: Commit UI cleanup
        shell: bash
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git rm .github/workflows/ns2c5-source-neutral-ui-bootstrap.yml
          git add app.js search-ui.js
          git commit -m 'NS2C5: make remaining search copy source-neutral'
          git push origin HEAD:feature/ns2c5-source-controls
