name: Validate static JavaScript

on:
  pull_request:
    branches: ["main"]

permissions:
  contents: read

jobs:
  syntax:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install CSS build dependency
        run: npm install --no-audit --no-fund
      - name: Build Tailwind CSS
        run: npm run build:css
      - name: Check JavaScript syntax
        run: |
          for file in *.js; do
            echo "Checking $file"
            node --check "$file"
          done
      - name: Validate Liquid Glass stability contract
        run: node .github/scripts/validate-liquid-motion-contract.mjs
      - name: Validate archive search frontend contract
        run: node .github/scripts/test-archive-search-ui.mjs
      - name: Validate feed cursor pagination contract
        run: node .github/scripts/test-feed-pagination-ui.mjs
      - name: Validate Reader performance contract
        run: node .github/scripts/test-reader-performance-ui.mjs
      - name: Validate scroll reflow contract
        run: node .github/scripts/test-scroll-reflow.mjs
      - name: Validate feed first-paint contract
        run: node .github/scripts/test-feed-first-paint.mjs
      - name: Validate feed image delivery contract
        run: node .github/scripts/test-feed-image-delivery.mjs
      - name: Validate low-end browser performance contract
        run: node .github/scripts/test-low-end-performance.mjs
      - name: Validate Liquid Glass phase 1 contract
        run: node .github/scripts/test-liquid-glass-phase1.mjs
