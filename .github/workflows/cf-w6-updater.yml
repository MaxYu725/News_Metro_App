name: CF-W6 adaptive retention updater

on:
  push:
    branches:
      - agent/cf-w6-adaptive-retention
    paths:
      - .github/workflows/cf-w6-updater.yml

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout CF-W6 branch
        uses: actions/checkout@v4
        with:
          ref: agent/cf-w6-adaptive-retention

      - name: Apply CF-W6 patch
        run: python3 .github/scripts/apply-cf-w6.py

      - name: Validate generated patch syntax
        run: |
          set -euo pipefail
          node --check worker/src/index.js
          node --check worker/src/retention.js
          node --check worker/test/retention.test.mjs
          bash -n .github/scripts/validate-adaptive-retention.sh
          bash -n .github/scripts/worker-production-smoke.sh
          bash -n .github/scripts/worker-production-d1-audit.sh
          python3 .github/scripts/validate-worker-baseline.py

      - name: Commit generated non-workflow patch
        run: |
          set -euo pipefail
          git restore .github/workflows/worker-baseline.yml .github/workflows/deploy-worker-production.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add worker/src/index.js worker/src/retention.js worker/migrations/0002_adaptive_retention.sql worker/test/retention.test.mjs \
            .github/scripts/validate-worker-baseline.py .github/scripts/validate-adaptive-retention.sh \
            .github/scripts/worker-production-smoke.sh .github/scripts/worker-production-d1-audit.sh \
            .deploy/worker-production.txt
          git commit -m "CF-W6: add adaptive D1 retention policy"
          git push origin HEAD:agent/cf-w6-adaptive-retention
