name: NS2C5 source controls bootstrap

on:
  push:
    branches:
      - feature/ns2c5-source-controls

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/ns2c5-source-controls
          fetch-depth: 0

      - name: Apply NS2C5 source controls
        shell: bash
        run: |
          python <<'PY'
          from pathlib import Path

          def replace_once(path, old, new):
              p = Path(path)
              text = p.read_text()
              if old not in text:
                  raise SystemExit(f'needle missing in {path}: {old[:120]!r}')
              p.write_text(text.replace(old, new, 1))

          # Remove the legacy single-source brand and add source controls to Settings.
          replace_once(
              'index.html',
              '''                <h1 class="app-title">Metro News</h1>\n                <span class="app-source">HK01</span>''',
              '''                <h1 class="app-title">Metro News</h1>'''
          )
          replace_once(
              'index.html',
              '''                    <p class="view-subtitle">搜尋 HK01 新聞資料庫</p>''',
              '''                    <p class="view-subtitle">搜尋新聞資料庫</p>'''
          )
          replace_once(
              'index.html',
              '''            <div>\n                <p class="text-xs text-gray-400 uppercase tracking-widest mb-3">新聞分類</p>\n                <div id="category-visibility-list" class="grid grid-cols-2 gap-2"></div>\n            </div>''',
              '''            <div>\n                <p class="text-xs text-gray-400 uppercase tracking-widest mb-3">新聞分類</p>\n                <div id="category-visibility-list" class="grid grid-cols-2 gap-2"></div>\n            </div>\n\n            <div>\n                <div class="flex items-end justify-between gap-3 mb-3">\n                    <div>\n                        <p class="text-xs text-gray-400 uppercase tracking-widest">新聞來源</p>\n                        <p class="text-xs text-white/35 mt-1 leading-relaxed">選擇要顯示的來源；數字為搜尋資料庫已存檔新聞量。</p>\n                    </div>\n                    <button id="btn-apply-sources" class="metro-btn shrink-0" type="button" disabled>套用</button>\n                </div>\n                <div id="source-visibility-list" class="flex flex-col gap-2"></div>\n                <p id="source-visibility-status" class="text-xs min-h-[18px] mt-2" role="status" aria-live="polite"></p>\n            </div>'''
          )
          replace_once(
              'index.html',
              '''    <script type="module" src="./pwa-state.js"></script>''',
              '''    <script type="module" src="./pwa-state.js"></script>\n    <script type="module" src="./source-settings.js"></script>'''
          )

          # Persist visible source IDs alongside existing category preferences.
          replace_once(
              'utils.js',
              '''    saveVisibleCategories: (data) => {\n        try { localStorage.setItem('metro_news_visible_cats', JSON.stringify(data)); } catch(e){}\n    },''',
              '''    saveVisibleCategories: (data) => {\n        try { localStorage.setItem('metro_news_visible_cats', JSON.stringify(data)); } catch(e){}\n    },\n    getVisibleSources: () => {\n        try {\n            const data = localStorage.getItem('metro_news_visible_sources_v1');\n            const parsed = data ? JSON.parse(data) : ['hk01', 'bastille'];\n            const allowed = ['hk01', 'bastille'];\n            const result = Array.isArray(parsed) ? parsed.filter(id => allowed.includes(id)) : [];\n            return result.length > 0 ? [...new Set(result)] : ['hk01', 'bastille'];\n        } catch (e) {\n            return ['hk01', 'bastille'];\n        }\n    },\n    saveVisibleSources: (data) => {\n        try { localStorage.setItem('metro_news_visible_sources_v1', JSON.stringify(data)); } catch(e){}\n    },'''
          )

          # Frontend API automatically carries the source preference to live feed and search.
          replace_once(
              'api.js',
              '''import { getCachedFeed, saveCachedFeed } from './data-cache.js';''',
              '''import { getCachedFeed, saveCachedFeed } from './data-cache.js';\nimport { LocalDB } from './utils.js';'''
          )
          replace_once(
              'api.js',
              '''const ARTICLE_FULL_API_URL = 'https://news-proxy.maxyu0725us.workers.dev/api/article-full';''',
              '''const ARTICLE_FULL_API_URL = 'https://news-proxy.maxyu0725us.workers.dev/api/article-full';\nconst SOURCE_STATS_API_URL = 'https://news-proxy.maxyu0725us.workers.dev/api/source-stats';'''
          )
          replace_once(
              'api.js',
              '''export const DATA_STATE_EVENT = 'metro:data-state';''',
              '''export const DATA_STATE_EVENT = 'metro:data-state';\n\nfunction selectedSourceIds() {\n    return LocalDB.getVisibleSources().join(',');\n}\n\nfunction sourceCacheKey(query = '') {\n    return `${String(query || '')}::sources=${selectedSourceIds()}`;\n}'''
          )
          replace_once(
              'api.js',
              '''    const cached = page === 0 ? getCachedFeed(categoryId, searchQuery) : null;''',
              '''    const cached = page === 0 ? getCachedFeed(categoryId, sourceCacheKey(searchQuery)) : null;'''
          )
          replace_once(
              'api.js',
              '''    const cached = !append ? getCachedFeed('search', searchQuery) : null;''',
              '''    const cached = !append ? getCachedFeed('search', sourceCacheKey(searchQuery)) : null;'''
          )
          replace_once(
              'api.js',
              '''export async function fetchNewsData(categoryId, page, forceSync = false, searchQuery = '') {\n    let url;\n    if (categoryId === 'search') {\n        url = `${SEARCH_API_URL}?q=${encodeURIComponent(searchQuery)}&page=${page}`;\n    } else {\n        url = `${API_BASE_URL}${categoryId}?page=${page}${forceSync ? '&sync=1' : ''}`;\n    }''',
              '''export async function fetchNewsData(categoryId, page, forceSync = false, searchQuery = '') {\n    const sources = selectedSourceIds();\n    let url;\n    if (categoryId === 'search') {\n        url = `${SEARCH_API_URL}?q=${encodeURIComponent(searchQuery)}&page=${page}&sources=${encodeURIComponent(sources)}`;\n    } else {\n        url = `${API_BASE_URL}${categoryId}?page=${page}${forceSync ? '&sync=1' : ''}&sources=${encodeURIComponent(sources)}`;\n    }'''
          )
          replace_once(
              'api.js',
              '''                saveCachedFeed(categoryId, searchQuery, result.data, result.hasMore);''',
              '''                saveCachedFeed(categoryId, sourceCacheKey(searchQuery), result.data, result.hasMore);'''
          )
          replace_once(
              'api.js',
              '''    const params = new URLSearchParams({ q: query });''',
              '''    const params = new URLSearchParams({ q: query, sources: selectedSourceIds() });'''
          )
          replace_once(
              'api.js',
              '''            saveCachedFeed('search', query, data, !!result.hasMore);''',
              '''            saveCachedFeed('search', sourceCacheKey(query), data, !!result.hasMore);'''
          )
          replace_once(
              'api.js',
              '''export async function fetchImageData(query, page) {''',
              '''export async function fetchSourceStats() {\n    try {\n        const response = await fetch(SOURCE_STATS_API_URL);\n        const result = await response.json();\n        if (!response.ok || !result.success || !Array.isArray(result.data)) {\n            return { success: false, data: [], error: result?.error || '無法讀取新聞來源統計' };\n        }\n        return { success: true, data: result.data };\n    } catch (error) {\n        return { success: false, data: [], error: '無法讀取新聞來源統計' };\n    }\n}\n\nexport async function fetchImageData(query, page) {'''
          )

          # Source preference UI is isolated from the main app state. Apply performs one clean reload
          # so the existing private feed cache cannot leak rows from a source that was just hidden.
          Path('source-settings.js').write_text(r'''import { fetchSourceStats } from './api.js';
          import { LocalDB } from './utils.js';

          const SOURCE_OPTIONS = [
              { id: 'hk01', name: '香港01' },
              { id: 'bastille', name: '巴士的報' }
          ];
          const REOPEN_KEY = 'metro_news_reopen_settings_after_source_change';

          function formatCount(value) {
              const count = Number(value);
              return Number.isFinite(count) ? `${new Intl.NumberFormat('zh-HK').format(count)} 篇` : '—';
          }

          function initSourceSettings() {
              const list = document.getElementById('source-visibility-list');
              const apply = document.getElementById('btn-apply-sources');
              const status = document.getElementById('source-visibility-status');
              if (!list || !apply || !status) return;

              const saved = new Set(LocalDB.getVisibleSources());
              const pending = new Set(saved);
              const counts = new Map();

              const setStatus = (message = '') => {
                  status.textContent = message;
              };

              const syncApplyState = () => {
                  const savedKey = [...saved].sort().join(',');
                  const pendingKey = [...pending].sort().join(',');
                  apply.disabled = savedKey === pendingKey;
                  apply.classList.toggle('opacity-45', apply.disabled);
              };

              const render = () => {
                  list.innerHTML = '';
                  SOURCE_OPTIONS.forEach(source => {
                      const label = document.createElement('label');
                      label.className = 'flex items-center justify-between gap-4 bg-[#161a2e]/70 backdrop-blur-md px-4 py-3 border border-white/10 cursor-pointer';

                      const main = document.createElement('span');
                      main.className = 'min-w-0';
                      main.innerHTML = `
                          <span class="block text-base font-light text-gray-100">${source.name}</span>
                          <span class="block text-xs text-white/35 mt-1" data-source-count="${source.id}">${formatCount(counts.get(source.id))}</span>
                      `;

                      const checkbox = document.createElement('input');
                      checkbox.type = 'checkbox';
                      checkbox.className = 'settings-accent-control w-5 h-5 cursor-pointer shrink-0';
                      checkbox.checked = pending.has(source.id);
                      checkbox.setAttribute('aria-label', `顯示${source.name}`);
                      checkbox.addEventListener('change', () => {
                          if (checkbox.checked) {
                              pending.add(source.id);
                          } else {
                              if (pending.size <= 1) {
                                  checkbox.checked = true;
                                  setStatus('至少需保留一個新聞來源。');
                                  return;
                              }
                              pending.delete(source.id);
                          }
                          setStatus('按「套用」更新新聞來源。');
                          syncApplyState();
                      });

                      label.append(main, checkbox);
                      list.appendChild(label);
                  });
                  syncApplyState();
              };

              apply.addEventListener('click', () => {
                  if (pending.size === 0 || apply.disabled) return;
                  LocalDB.saveVisibleSources([...pending]);
                  try { sessionStorage.setItem(REOPEN_KEY, '1'); } catch (error) {}
                  setStatus('正在套用新聞來源…');
                  window.location.reload();
              });

              render();
              setStatus('正在讀取新聞量…');
              fetchSourceStats().then(result => {
                  if (!result.success) {
                      setStatus('新聞量暫時無法讀取；來源選擇仍可使用。');
                      return;
                  }
                  result.data.forEach(item => counts.set(item.id, Number(item.count || 0)));
                  render();
                  setStatus('');
              });

              let shouldReopen = false;
              try {
                  shouldReopen = sessionStorage.getItem(REOPEN_KEY) === '1';
                  if (shouldReopen) sessionStorage.removeItem(REOPEN_KEY);
              } catch (error) {}
              if (shouldReopen) {
                  window.setTimeout(() => {
                      document.querySelector('.bottom-nav-btn[data-section="settings"]')?.click();
                  }, 0);
              }
          }

          window.addEventListener('DOMContentLoaded', initSourceSettings);
          ''')

          # PWA shell update.
          replace_once('sw.js', "const SHELL_CACHE = 'metro-news-shell-v28-archive-search';", "const SHELL_CACHE = 'metro-news-shell-v29-source-controls';")
          replace_once('sw.js', "    './settings.js',\n", "    './settings.js',\n    './source-settings.js',\n")

          # Shared source filter contract for Worker and search SQL.
          Path('worker/src/source-filter.js').write_text(r'''export const NEWS_SOURCES = Object.freeze([
            Object.freeze({ id: 'hk01', name: '香港01' }),
            Object.freeze({ id: 'bastille', name: '巴士的報' }),
          ]);

          const SOURCE_BY_ID = new Map(NEWS_SOURCES.map(source => [source.id, source]));
          const SOURCE_NAME_SET = new Set(NEWS_SOURCES.map(source => source.name));

          export function parseSourceFilter(value) {
            if (value == null || String(value).trim() === '') return NEWS_SOURCES.map(source => source.id);
            const ids = [...new Set(String(value).split(',').map(part => part.trim()).filter(Boolean))];
            if (ids.length === 0 || ids.some(id => !SOURCE_BY_ID.has(id))) return null;
            return ids;
          }

          export function sourceNamesForIds(ids) {
            return (ids || []).map(id => SOURCE_BY_ID.get(id)?.name).filter(Boolean);
          }

          export function sourceFilterSql(column, names) {
            const unique = [...new Set((names || []).filter(name => SOURCE_NAME_SET.has(name)))];
            if (unique.length === NEWS_SOURCES.length) return { sql: '', params: [] };
            if (unique.length === 0) return { sql: ' AND 1 = 0', params: [] };
            return {
              sql: ` AND ${column} IN (${unique.map(() => '?').join(', ')})`,
              params: unique,
            };
          }
          ''')

          # Search now filters in SQL before pagination/cursoring, avoiding sparse pages and skipped rows.
          replace_once(
              'worker/src/search.js',
              '''const FTS_MIN_CODEPOINTS = 3;''',
              '''import { sourceFilterSql } from './source-filter.js';\n\nconst FTS_MIN_CODEPOINTS = 3;'''
          )
          replace_once(
              'worker/src/search.js',
              '''async function runFtsSearch(db, query, offset, fetchLimit) {\n  return db\n    .prepare(`SELECT a.*\n      FROM articles_fts\n      JOIN articles AS a ON a.rowid = articles_fts.rowid\n      WHERE articles_fts MATCH ?\n      ORDER BY a.pubDate DESC\n      LIMIT ? OFFSET ?`)\n    .bind(quoteFtsPhrase(query), fetchLimit, offset)\n    .all();\n}''',
              '''async function runFtsSearch(db, query, offset, fetchLimit, sourceNames) {\n  const filter = sourceFilterSql('a.source', sourceNames);\n  return db\n    .prepare(`SELECT a.*\n      FROM articles_fts\n      JOIN articles AS a ON a.rowid = articles_fts.rowid\n      WHERE articles_fts MATCH ?${filter.sql}\n      ORDER BY a.pubDate DESC\n      LIMIT ? OFFSET ?`)\n    .bind(quoteFtsPhrase(query), ...filter.params, fetchLimit, offset)\n    .all();\n}'''
          )
          replace_once(
              'worker/src/search.js',
              '''async function runLikeFallback(db, query, offset, fetchLimit) {\n  const pattern = `%${escapeLike(query)}%`;\n  return db\n    .prepare(`SELECT * FROM articles\n      WHERE title LIKE ? ESCAPE '\\\\' OR description LIKE ? ESCAPE '\\\\'\n      ORDER BY pubDate DESC\n      LIMIT ? OFFSET ?`)\n    .bind(pattern, pattern, fetchLimit, offset)\n    .all();\n}''',
              '''async function runLikeFallback(db, query, offset, fetchLimit, sourceNames) {\n  const pattern = `%${escapeLike(query)}%`;\n  const filter = sourceFilterSql('source', sourceNames);\n  return db\n    .prepare(`SELECT * FROM articles\n      WHERE (title LIKE ? ESCAPE '\\\\' OR description LIKE ? ESCAPE '\\\\')${filter.sql}\n      ORDER BY pubDate DESC\n      LIMIT ? OFFSET ?`)\n    .bind(pattern, pattern, ...filter.params, fetchLimit, offset)\n    .all();\n}'''
          )
          replace_once(
              'worker/src/search.js',
              '''async function runFtsCursorSearch(db, query, cursor, fetchLimit) {\n  const pubDate = cursor?.pubDate || null;\n  const id = cursor?.id || null;\n  return db\n    .prepare(`SELECT a.*\n      FROM articles_fts\n      JOIN articles AS a ON a.rowid = articles_fts.rowid\n      WHERE articles_fts MATCH ?\n        AND (? IS NULL OR a.pubDate < ? OR (a.pubDate = ? AND a.id < ?))\n      ORDER BY a.pubDate DESC, a.id DESC\n      LIMIT ?`)\n    .bind(quoteFtsPhrase(query), pubDate, pubDate, pubDate, id, fetchLimit)\n    .all();\n}''',
              '''async function runFtsCursorSearch(db, query, cursor, fetchLimit, sourceNames) {\n  const pubDate = cursor?.pubDate || null;\n  const id = cursor?.id || null;\n  const filter = sourceFilterSql('a.source', sourceNames);\n  return db\n    .prepare(`SELECT a.*\n      FROM articles_fts\n      JOIN articles AS a ON a.rowid = articles_fts.rowid\n      WHERE articles_fts MATCH ?${filter.sql}\n        AND (? IS NULL OR a.pubDate < ? OR (a.pubDate = ? AND a.id < ?))\n      ORDER BY a.pubDate DESC, a.id DESC\n      LIMIT ?`)\n    .bind(quoteFtsPhrase(query), ...filter.params, pubDate, pubDate, pubDate, id, fetchLimit)\n    .all();\n}'''
          )
          replace_once(
              'worker/src/search.js',
              '''async function runLikeCursorSearch(db, query, cursor, fetchLimit) {\n  const pattern = `%${escapeLike(query)}%`;\n  const pubDate = cursor?.pubDate || null;\n  const id = cursor?.id || null;\n  return db\n    .prepare(`SELECT * FROM articles\n      WHERE (title LIKE ? ESCAPE '\\\\' OR description LIKE ? ESCAPE '\\\\')\n        AND (? IS NULL OR pubDate < ? OR (pubDate = ? AND id < ?))\n      ORDER BY pubDate DESC, id DESC\n      LIMIT ?`)\n    .bind(pattern, pattern, pubDate, pubDate, pubDate, id, fetchLimit)\n    .all();\n}''',
              '''async function runLikeCursorSearch(db, query, cursor, fetchLimit, sourceNames) {\n  const pattern = `%${escapeLike(query)}%`;\n  const pubDate = cursor?.pubDate || null;\n  const id = cursor?.id || null;\n  const filter = sourceFilterSql('source', sourceNames);\n  return db\n    .prepare(`SELECT * FROM articles\n      WHERE (title LIKE ? ESCAPE '\\\\' OR description LIKE ? ESCAPE '\\\\')${filter.sql}\n        AND (? IS NULL OR pubDate < ? OR (pubDate = ? AND id < ?))\n      ORDER BY pubDate DESC, id DESC\n      LIMIT ?`)\n    .bind(pattern, pattern, ...filter.params, pubDate, pubDate, pubDate, id, fetchLimit)\n    .all();\n}'''
          )
          replace_once('worker/src/search.js', 'export async function searchArticles(db, query, page, limit = 20) {', 'export async function searchArticles(db, query, page, limit = 20, sourceNames = []) {')
          replace_once('worker/src/search.js', 'result = await runFtsSearch(db, query, offset, fetchLimit);', 'result = await runFtsSearch(db, query, offset, fetchLimit, sourceNames);')
          replace_once('worker/src/search.js', 'result = await runLikeFallback(db, query, offset, fetchLimit);', 'result = await runLikeFallback(db, query, offset, fetchLimit, sourceNames);')
          replace_once('worker/src/search.js', 'result = await runLikeFallback(db, query, offset, fetchLimit);', 'result = await runLikeFallback(db, query, offset, fetchLimit, sourceNames);')
          replace_once('worker/src/search.js', 'export async function searchArticlesAfterCursor(db, query, cursor, limit = 20) {', 'export async function searchArticlesAfterCursor(db, query, cursor, limit = 20, sourceNames = []) {')
          replace_once('worker/src/search.js', 'result = await runFtsCursorSearch(db, query, cursor, fetchLimit);', 'result = await runFtsCursorSearch(db, query, cursor, fetchLimit, sourceNames);')
          replace_once('worker/src/search.js', 'result = await runLikeCursorSearch(db, query, cursor, fetchLimit);', 'result = await runLikeCursorSearch(db, query, cursor, fetchLimit, sourceNames);')
          replace_once('worker/src/search.js', 'result = await runLikeCursorSearch(db, query, cursor, fetchLimit);', 'result = await runLikeCursorSearch(db, query, cursor, fetchLimit, sourceNames);')
          replace_once('worker/src/search.js', 'export async function searchArticlesAcrossDatabases(databases, query, cursor, limit = 20) {', 'export async function searchArticlesAcrossDatabases(databases, query, cursor, limit = 20, sourceNames = []) {')
          replace_once('worker/src/search.js', 'eligible.map(db => searchArticlesAfterCursor(db, query, cursor, perDbLimit)),', 'eligible.map(db => searchArticlesAfterCursor(db, query, cursor, perDbLimit, sourceNames)),')

          # Worker routing: parse source IDs, filter live feed/search before pagination, expose archive counts.
          replace_once(
              'worker/src/index.js',
              '''import { fetchBastilleArticles, isBastilleSource } from './sources/bastille.js';''',
              '''import { fetchBastilleArticles, isBastilleSource } from './sources/bastille.js';\nimport { NEWS_SOURCES, parseSourceFilter, sourceNamesForIds, sourceFilterSql } from './source-filter.js';'''
          )
          replace_once(
              'worker/src/index.js',
              '''    if (url.pathname === '/api/search') {''',
              '''    if (url.pathname === '/api/source-stats') {\n      if (request.method !== 'GET') return methodNotAllowed(request, ['GET']);\n      try {\n        const archiveDb = env.ARCHIVE_01?.withSession\n          ? env.ARCHIVE_01.withSession('first-unconstrained')\n          : env.DB;\n        const { results } = await archiveDb.prepare(\n          `SELECT source, COUNT(*) AS count FROM articles GROUP BY source`,\n        ).all();\n        const bySource = new Map((results || []).map(row => [String(row.source || ''), Number(row.count || 0)]));\n        return jsonResponse(request, {\n          success: true,\n          data: NEWS_SOURCES.map(source => ({\n            id: source.id,\n            name: source.name,\n            count: bySource.get(source.name) || 0,\n          })),\n        });\n      } catch {\n        return jsonResponse(request, { success: false, error: '讀取新聞來源統計失敗' }, 500);\n      }\n    }\n\n    if (url.pathname === '/api/search') {'''
          )
          replace_once(
              'worker/src/index.js',
              '''    const query = (url.searchParams.get('q') || '').trim();\n    const scope = (url.searchParams.get('scope') || 'live').trim();\n    const limit = 20;''',
              '''    const query = (url.searchParams.get('q') || '').trim();\n    const scope = (url.searchParams.get('scope') || 'live').trim();\n    const sourceIds = parseSourceFilter(url.searchParams.get('sources'));\n    if (!sourceIds) return jsonResponse(request, { success: false, error: '新聞來源參數無效' }, 400);\n    const sourceNames = sourceNamesForIds(sourceIds);\n    const limit = 20;'''
          )
          replace_once(
              'worker/src/index.js',
              '''          query,\n          cursor,\n          limit,\n        );''',
              '''          query,\n          cursor,\n          limit,\n          sourceNames,\n        );'''
          )
          replace_once(
              'worker/src/index.js',
              '''      const { rows, hasMore } = await searchArticles(env.DB, query, page, limit);''',
              '''      const { rows, hasMore } = await searchArticles(env.DB, query, page, limit, sourceNames);'''
          )
          replace_once(
              'worker/src/index.js',
              '''      const category = url.pathname.split('/').pop();\n      const page = Number.parseInt(url.searchParams.get('page') || '0', 10);\n      const forceSync = url.searchParams.get('sync') === '1';\n      const limit = 20;''',
              '''      const category = url.pathname.split('/').pop();\n      const page = Number.parseInt(url.searchParams.get('page') || '0', 10);\n      const forceSync = url.searchParams.get('sync') === '1';\n      const sourceIds = parseSourceFilter(url.searchParams.get('sources'));\n      if (!sourceIds) return jsonResponse(request, { success: false, error: '新聞來源參數無效' }, 400);\n      const sourceNames = sourceNamesForIds(sourceIds);\n      const sourceFilter = sourceFilterSql('source', sourceNames);\n      const limit = 20;'''
          )
          replace_once(
              'worker/src/index.js',
              '''          query = `SELECT * FROM articles ORDER BY pubDate DESC LIMIT ? OFFSET ?`;\n          params = [limit, offset];''',
              '''          query = `SELECT * FROM articles WHERE 1 = 1${sourceFilter.sql} ORDER BY pubDate DESC LIMIT ? OFFSET ?`;\n          params = [...sourceFilter.params, limit, offset];'''
          )
          replace_once(
              'worker/src/index.js',
              '''          query = `SELECT * FROM articles WHERE category = ? ORDER BY pubDate DESC LIMIT ? OFFSET ?`;\n          params = [category, limit, offset];''',
              '''          query = `SELECT * FROM articles WHERE category = ?${sourceFilter.sql} ORDER BY pubDate DESC LIMIT ? OFFSET ?`;\n          params = [category, ...sourceFilter.params, limit, offset];'''
          )

          # Unit coverage for parser/SQL contract.
          Path('worker/test/source-filter.test.mjs').write_text(r'''import assert from 'node:assert/strict';
          import test from 'node:test';

          import {
            NEWS_SOURCES,
            parseSourceFilter,
            sourceFilterSql,
            sourceNamesForIds,
          } from '../src/source-filter.js';

          test('source filter defaults to all supported sources', () => {
            assert.deepEqual(parseSourceFilter(null), NEWS_SOURCES.map(source => source.id));
            assert.deepEqual(parseSourceFilter(''), NEWS_SOURCES.map(source => source.id));
          });

          test('source filter rejects unknown and empty selections', () => {
            assert.equal(parseSourceFilter('unknown'), null);
            assert.equal(parseSourceFilter(','), null);
          });

          test('source filter de-duplicates IDs and maps canonical names', () => {
            assert.deepEqual(parseSourceFilter('hk01,hk01'), ['hk01']);
            assert.deepEqual(sourceNamesForIds(['hk01', 'bastille']), ['香港01', '巴士的報']);
          });

          test('SQL filter is omitted for all sources and parameterized for a subset', () => {
            assert.deepEqual(sourceFilterSql('source', ['香港01', '巴士的報']), { sql: '', params: [] });
            assert.deepEqual(sourceFilterSql('source', ['香港01']), { sql: ' AND source IN (?)', params: ['香港01'] });
          });
          ''')
          PY

