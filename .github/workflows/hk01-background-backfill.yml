name: HK01 background archive backfill

on:
  pull_request:
    branches:
      - main
    paths:
      - worker/src/sources/hk01-search.js
      - worker/scripts/hk01-search-backfill.mjs
      - worker/test/hk01-search-archive.test.mjs
      - worker/src/archive-shards.js
      - worker/test/archive-shards.test.mjs
      - .github/scripts/archive-backfill-production-audit.sh
      - .github/workflows/hk01-background-backfill.yml
  push:
    branches:
      - main
    paths:
      - worker/src/sources/hk01-search.js
      - worker/scripts/hk01-search-backfill.mjs
      - worker/test/hk01-search-archive.test.mjs
      - worker/src/archive-shards.js
      - worker/test/archive-shards.test.mjs
      - .github/scripts/archive-backfill-production-audit.sh
      - .github/workflows/hk01-background-backfill.yml
  schedule:
    - cron: '17 */6 * * *'
  workflow_dispatch:
    inputs:
      limit:
        description: Controlled rows for one background cycle
        required: true
        default: '1000'
        type: choice
        options:
          - '500'
          - '1000'

concurrency:
  group: metro-news-archive-backfill
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  validate:
    if: github.event_name == 'pull_request' || github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate background backfill syntax
        run: |
          node --check worker/src/sources/hk01-search.js
          node --check worker/src/archive-shards.js
          node --check worker/scripts/hk01-search-backfill.mjs
          node --check worker/test/hk01-search-archive.test.mjs
          node --check worker/test/archive-shards.test.mjs
          bash -n .github/scripts/archive-backfill-production-audit.sh

      - name: Install pinned Wrangler
        working-directory: worker
        run: npm install --ignore-scripts --no-audit --no-fund

      - name: Run Worker regressions
        working-directory: worker
        run: npm test

  execute:
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: production
    env:
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install pinned Wrangler
        working-directory: worker
        run: npm install --ignore-scripts --no-audit --no-fund

      - name: Resolve replay-safe background batch
        id: batch
        shell: bash
        env:
          INPUT_LIMIT: ${{ inputs.limit }}
        run: |
          set -euo pipefail
          if [[ "$GITHUB_EVENT_NAME" == 'schedule' ]]; then
            limit=1000
          else
            limit=${INPUT_LIMIT:-1000}
          fi
          [[ "$limit" == '500' || "$limit" == '1000' ]] || { echo '::error::Background limit must be 500 or 1000'; exit 1; }
          batch_id="hk01-auto-${GITHUB_RUN_ID}"
          [[ "$batch_id" =~ ^[A-Za-z0-9._-]{1,80}$ ]] || { echo '::error::Invalid generated batch id'; exit 1; }
          echo "batch_id=$batch_id" >> "$GITHUB_OUTPUT"
          echo "limit=$limit" >> "$GITHUB_OUTPUT"
          echo "Background control: batch=$batch_id source=hk01 limit=$limit"

      - name: Validate Cloudflare credentials
        shell: bash
        run: |
          set -euo pipefail
          test -n "${CLOUDFLARE_ACCOUNT_ID:-}" || { echo '::error::CF_ACCOUNT_ID is missing'; exit 1; }
          test -n "${CLOUDFLARE_API_TOKEN:-}" || { echo '::error::CF_API_TOKEN is missing'; exit 1; }

      - name: Apply archive operational migrations
        working-directory: worker
        run: |
          npx wrangler d1 migrations apply metro_news_archive_01 --remote
          npx wrangler d1 migrations apply metro_news_archive_02 --remote

      - name: Locate replay batch and select writable shard
        id: control
        shell: bash
        env:
          BATCH_ID: ${{ steps.batch.outputs.batch_id }}
        run: |
          set -euo pipefail
          cd worker
          for binding in ARCHIVE_01 ARCHIVE_02; do
            lower=$(echo "$binding" | tr '[:upper:]' '[:lower:]')
            npx wrangler d1 execute "$binding" --remote --json --command "
              SELECT
                (SELECT COUNT(*) FROM articles) AS total_rows,
                (SELECT status FROM archive_backfill_runs WHERE batch_id='${BATCH_ID}') AS batch_status,
                (SELECT generated_rows FROM archive_backfill_runs WHERE batch_id='${BATCH_ID}') AS generated_rows,
                (SELECT before_rows FROM archive_backfill_runs WHERE batch_id='${BATCH_ID}') AS before_rows,
                (SELECT COUNT(*) FROM archive_backfill_state WHERE source_key='hk01:search') AS state_present,
                (SELECT cursor FROM archive_backfill_state WHERE source_key='hk01:search') AS cursor,
                (SELECT pages_fetched FROM archive_backfill_state WHERE source_key='hk01:search') AS pages_fetched,
                (SELECT rows_inserted FROM archive_backfill_state WHERE source_key='hk01:search') AS rows_inserted,
                (SELECT last_pubDate FROM archive_backfill_state WHERE source_key='hk01:search') AS last_pubDate,
                (SELECT exhausted FROM archive_backfill_state WHERE source_key='hk01:search') AS exhausted
            " > "/tmp/${lower}-control.json"
          done

          node <<'NODE' >> "$GITHUB_OUTPUT"
          const fs = require('fs');
          const read = binding => {
            const file = `/tmp/${binding.toLowerCase()}-control.json`;
            const payload = JSON.parse(fs.readFileSync(file, 'utf8'));
            const first = Array.isArray(payload) ? payload[0] : payload?.result?.[0];
            const row = first?.results?.[0] || first?.result?.results?.[0] || {};
            return {
              binding,
              total: Number(row.total_rows || 0),
              size: Number(first?.meta?.size_after || first?.result?.meta?.size_after || 0),
              status: String(row.batch_status || ''),
              generated: Number(row.generated_rows || 0),
              before: Number(row.before_rows || 0),
              statePresent: Number(row.state_present || 0) > 0,
              state: {
                source_key: 'hk01:search',
                cursor: row.cursor == null ? '' : String(row.cursor),
                pages_fetched: Number(row.pages_fetched || 0),
                rows_inserted: Number(row.rows_inserted || 0),
                last_pubDate: String(row.last_pubDate || ''),
                exhausted: Number(row.exhausted || 0),
              },
            };
          };
          const shards = [read('ARCHIVE_01'), read('ARCHIVE_02')];
          if (shards.some(shard => shard.size <= 0)) throw new Error('Unable to observe archive shard size');

          const replay = shards.filter(shard => shard.status);
          if (replay.length > 1) throw new Error('Replay batch unexpectedly exists in multiple archive shards');

          let active;
          let halted = false;
          let haltReason = '';
          if (replay.length === 1) {
            active = replay[0];
          } else if (shards[0].size < 300_000_000) {
            active = shards[0];
          } else if (shards[1].size < 300_000_000) {
            active = shards[1];
          } else {
            active = shards[1];
            halted = true;
            haltReason = 'all-shards-at-capacity';
          }

          let sourceState = active.statePresent ? active : null;
          if (!sourceState && active.binding === 'ARCHIVE_02' && shards[0].statePresent) sourceState = shards[0];
          if (!sourceState) sourceState = active;

          if (!active.status && sourceState.statePresent && sourceState.state.exhausted === 1) {
            halted = true;
            haltReason = 'source-exhausted';
          }

          const statePayload = [{ results: sourceState.statePresent ? [sourceState.state] : [] }];
          fs.writeFileSync('/tmp/hk01-background-state.json', JSON.stringify(statePayload));
          console.log(`active_binding=${active.binding}`);
          console.log(`status=${active.status || 'absent'}`);
          console.log(`generated=${active.generated}`);
          console.log(`before_rows=${active.status ? active.before : active.total}`);
          console.log(`active_rows=${active.total}`);
          console.log(`active_size=${active.size}`);
          console.log(`halted=${halted ? 'true' : 'false'}`);
          console.log(`halt_reason=${haltReason}`);
          NODE

          echo "Shard control: active=${{ steps.control.outputs.active_binding || 'resolving' }}" >/dev/null || true

      - name: Report expected background halt
        if: steps.control.outputs.halted == 'true'
        shell: bash
        env:
          REASON: ${{ steps.control.outputs.halt_reason }}
          ACTIVE: ${{ steps.control.outputs.active_binding }}
        run: |
          if [[ "$REASON" == 'source-exhausted' ]]; then
            echo "::notice::HK01 universal-search archive is exhausted; no further writes are required."
          else
            echo "::notice::All provisioned archive shards reached the 300 MB start guard; next shard provisioning is required."
          fi
          echo "Background halt: reason=${REASON} active=${ACTIVE}"

      - name: Replay completed cycle as no-op
        if: steps.control.outputs.status == 'completed'
        run: echo 'Background batch already completed; workflow rerun is a no-op.'

      - name: Build cross-shard dedupe snapshot
        if: steps.control.outputs.status == 'absent' && steps.control.outputs.halted != 'true'
        shell: bash
        run: |
          set -euo pipefail
          cd worker
          overlap_start=$(node -e "const fs=require('fs');const p=JSON.parse(fs.readFileSync('/tmp/hk01-background-state.json','utf8'));const r=p?.[0]?.results?.[0];const c=Number.parseInt(r?.cursor||'',10);const e=1451606400;if(Number.isSafeInteger(c)&&c>e)process.stdout.write(new Date(Math.max(e,c-46*86400)*1000).toISOString())")

          for binding in ARCHIVE_01 ARCHIVE_02; do
            lower=$(echo "$binding" | tr '[:upper:]' '[:lower:]')
            if [[ -n "$overlap_start" ]]; then
              npx wrangler d1 execute "$binding" --remote --json \
                --command "SELECT id,link,source,pubDate FROM articles WHERE source='香港01' AND pubDate >= '${overlap_start}' ORDER BY pubDate DESC,id DESC" \
                > "/tmp/${lower}-existing.json"
            else
              npx wrangler d1 execute "$binding" --remote --json \
                --command "SELECT id,link,source,pubDate FROM articles WHERE source='香港01' ORDER BY pubDate DESC,id DESC" \
                > "/tmp/${lower}-existing.json"
            fi
          done

          node <<'NODE'
          const fs = require('fs');
          const rows = [];
          for (const binding of ['archive_01', 'archive_02']) {
            const payload = JSON.parse(fs.readFileSync(`/tmp/${binding}-existing.json`, 'utf8'));
            const chunks = Array.isArray(payload) ? payload : [payload];
            for (const chunk of chunks) {
              if (Array.isArray(chunk?.results)) rows.push(...chunk.results);
              else if (Array.isArray(chunk?.result?.results)) rows.push(...chunk.result.results);
            }
          }
          const unique = new Map();
          for (const row of rows) {
            const key = String(row?.id || row?.link || '');
            if (key && !unique.has(key)) unique.set(key, row);
          }
          fs.writeFileSync('/tmp/hk01-background-existing.json', JSON.stringify([{ results: [...unique.values()] }]));
          console.log(`Cross-shard dedupe rows: ${unique.size}`);
          NODE
          if [[ -n "$overlap_start" ]]; then
            echo "Background dedupe snapshot: bounded_46d from=${overlap_start} across ARCHIVE_01+ARCHIVE_02"
          else
            echo 'Background dedupe snapshot: full bootstrap scan across ARCHIVE_01+ARCHIVE_02'
          fi

      - name: Generate HK01 universal-search plan
        if: steps.control.outputs.status == 'absent' && steps.control.outputs.halted != 'true'
        shell: bash
        env:
          BATCH_ID: ${{ steps.batch.outputs.batch_id }}
          LIMIT: ${{ steps.batch.outputs.limit }}
          BEFORE_ROWS: ${{ steps.control.outputs.before_rows }}
        run: |
          set -euo pipefail
          node worker/scripts/hk01-search-backfill.mjs \
            --batch-id="$BATCH_ID" \
            --limit="$LIMIT" \
            --before-rows="$BEFORE_ROWS" \
            --existing=/tmp/hk01-background-existing.json \
            --state=/tmp/hk01-background-state.json \
            --out-dir=/tmp/hk01-background-plan \
            --report=/tmp/hk01-background-plan/report.json
          cat /tmp/hk01-background-plan/report.json

      - name: Persist new background plan
        if: steps.control.outputs.status == 'absent' && steps.control.outputs.halted != 'true'
        shell: bash
        env:
          ACTIVE_BINDING: ${{ steps.control.outputs.active_binding }}
        run: |
          set -euo pipefail
          cd worker
          npx wrangler d1 execute "$ACTIVE_BINDING" --remote --file /tmp/hk01-background-plan/plan-reset.sql
          shopt -s nullglob
          files=(/tmp/hk01-background-plan/plan-items-*.sql)
          (( ${#files[@]} > 0 )) || { echo '::error::No background plan item chunks generated'; exit 1; }
          for file in "${files[@]}"; do
            echo "Persisting $(basename "$file") to ${ACTIVE_BINDING}"
            npx wrangler d1 execute "$ACTIVE_BINDING" --remote --file "$file"
          done
          npx wrangler d1 execute "$ACTIVE_BINDING" --remote --file /tmp/hk01-background-plan/plan-state.sql
          npx wrangler d1 execute "$ACTIVE_BINDING" --remote --file /tmp/hk01-background-plan/plan-finalize.sql

      - name: Materialize planned HK01 articles
        if: steps.control.outputs.status != 'written' && steps.control.outputs.status != 'completed' && steps.control.outputs.halted != 'true'
        shell: bash
        env:
          BATCH_ID: ${{ steps.batch.outputs.batch_id }}
          ACTIVE_BINDING: ${{ steps.control.outputs.active_binding }}
        run: |
          set -euo pipefail
          cd worker
          npx wrangler d1 execute "$ACTIVE_BINDING" --remote --json \
            --command "SELECT status,generated_rows FROM archive_backfill_runs WHERE batch_id='${BATCH_ID}'" \
            > /tmp/hk01-background-planned.json
          generated=$(node -e "const p=require('/tmp/hk01-background-planned.json'); const f=Array.isArray(p)?p[0]:p?.result?.[0]; const r=f?.results?.[0]||f?.result?.results?.[0]; if(r?.status!=='planned') process.exit(2); process.stdout.write(String(Number(r.generated_rows||0)))")
          (( generated > 0 && generated <= 1000 )) || { echo '::error::Invalid persisted generated row count'; exit 1; }

          for (( start=1; start<=generated; start+=50 )); do
            end=$(( start + 49 ))
            (( end > generated )) && end=$generated
            sql=$(node --input-type=module -e "import {backfillApplyArticlesSql} from './src/archive-backfill.js'; console.log(backfillApplyArticlesSql(process.argv[1],Number(process.argv[2]),Number(process.argv[3])))" "$BATCH_ID" "$start" "$end")
            npx wrangler d1 execute "$ACTIVE_BINDING" --remote --command "$sql"
          done

          state_sql=$(node --input-type=module -e "import {backfillApplyStateAndMarkWrittenSql} from './src/archive-backfill.js'; console.log(backfillApplyStateAndMarkWrittenSql(process.argv[1]))" "$BATCH_ID")
          npx wrangler d1 execute "$ACTIVE_BINDING" --remote --command "$state_sql"

      - name: Audit written background batch
        if: steps.control.outputs.status != 'completed' && steps.control.outputs.halted != 'true'
        env:
          BATCH_ID: ${{ steps.batch.outputs.batch_id }}
          ACTIVE_BINDING: ${{ steps.control.outputs.active_binding }}
        run: bash .github/scripts/archive-backfill-production-audit.sh "$BATCH_ID" "$ACTIVE_BINDING"

      - name: Mark background batch completed
        if: steps.control.outputs.status != 'completed' && steps.control.outputs.halted != 'true'
        shell: bash
        env:
          BATCH_ID: ${{ steps.batch.outputs.batch_id }}
          ACTIVE_BINDING: ${{ steps.control.outputs.active_binding }}
        run: |
          set -euo pipefail
          cd worker
          sql=$(node --input-type=module -e "import {backfillMarkCompletedSql} from './src/archive-backfill.js'; console.log(backfillMarkCompletedSql(process.argv[1]))" "$BATCH_ID")
          npx wrangler d1 execute "$ACTIVE_BINDING" --remote --command "$sql"

      - name: Publish compact health summary
        if: always()
        shell: bash
        env:
          BATCH_ID: ${{ steps.batch.outputs.batch_id }}
          ACTIVE_BINDING: ${{ steps.control.outputs.active_binding }}
        run: |
          set -euo pipefail
          cd worker
          for binding in ARCHIVE_01 ARCHIVE_02; do
            lower=$(echo "$binding" | tr '[:upper:]' '[:lower:]')
            npx wrangler d1 execute "$binding" --remote --json \
              --command "SELECT COUNT(*) AS total_rows,SUM(CASE WHEN source='香港01' THEN 1 ELSE 0 END) AS hk01_rows,MIN(CASE WHEN source='香港01' THEN pubDate END) AS hk01_oldest FROM articles" \
              > "/tmp/${lower}-health.json" || true
          done
          node <<'NODE' >> "$GITHUB_STEP_SUMMARY"
          const fs = require('fs');
          const read = binding => {
            try {
              const p = JSON.parse(fs.readFileSync(`/tmp/${binding.toLowerCase()}-health.json`, 'utf8'));
              const first = Array.isArray(p) ? p[0] : p?.result?.[0];
              const row = first?.results?.[0] || first?.result?.results?.[0] || {};
              return { rows: Number(row.total_rows || 0), hk01: Number(row.hk01_rows || 0), oldest: String(row.hk01_oldest || '') };
            } catch { return { rows: 0, hk01: 0, oldest: '' }; }
          };
          const a = read('ARCHIVE_01');
          const b = read('ARCHIVE_02');
          const oldest = [a.oldest, b.oldest].filter(Boolean).sort()[0] || 'unknown';
          console.log('## HK01 background archive');
          console.log(`- batch: ${process.env.BATCH_ID || 'unknown'}`);
          console.log(`- active shard: ${process.env.ACTIVE_BINDING || 'none'}`);
          console.log(`- total rows: ${a.rows + b.rows}`);
          console.log(`- HK01 rows: ${a.hk01 + b.hk01}`);
          console.log(`- HK01 oldest: ${oldest}`);
          console.log(`- ARCHIVE_01 rows: ${a.rows}`);
          console.log(`- ARCHIVE_02 rows: ${b.rows}`);
          NODE
