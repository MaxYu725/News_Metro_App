name: HK01 background archive backfill

on:
  workflow_dispatch:
    inputs:
      limit:
        description: Read-only diagnostic; no batch is generated
        default: '500'
        type: choice
        options: ['500', '1000']

permissions:
  contents: read

jobs:
  execute:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: production
    env:
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - name: Install pinned Wrangler
        working-directory: worker
        run: npm install --ignore-scripts --no-audit --no-fund
      - name: Read-only source cursor
        working-directory: worker
        shell: bash
        run: |
          set -euo pipefail
          for binding in ARCHIVE_01 ARCHIVE_02; do
            npx wrangler d1 execute "$binding" --remote --json --command "SELECT cursor FROM archive_backfill_state WHERE source_key='hk01:search'" > "/tmp/${binding}-state.json"
          done
          node <<'NODE'
          const fs = require('fs');
          const read = binding => JSON.parse(fs.readFileSync(`/tmp/${binding}-state.json`, 'utf8'))[0].results[0];
          const row = read('ARCHIVE_02') || read('ARCHIVE_01');
          const cursor = Number.parseInt(row?.cursor || '', 10);
          if (!Number.isSafeInteger(cursor) || cursor <= 1451606400) throw new Error('Diagnostic requires a valid persisted cursor');
          fs.writeFileSync('/tmp/hk01-diagnostic-range.json', JSON.stringify({
            lower: new Date(Math.max(1451606400, cursor - 46 * 86400) * 1000).toISOString(),
            upper: new Date(cursor * 1000).toISOString(),
          }));
          console.log(`Read-only diagnostic cursor: ${cursor}`);
          NODE
      - name: Compare original and bounded SELECTs with Actions credentials
        working-directory: worker
        shell: bash
        run: |
          set -euo pipefail
          lower=$(node -p "require('/tmp/hk01-diagnostic-range.json').lower")
          upper=$(node -p "require('/tmp/hk01-diagnostic-range.json').upper")
          for mode in original bounded; do
            condition="pubDate >= '${lower}'"
            if [[ "$mode" == bounded ]]; then condition+=" AND pubDate < '${upper}'"; fi
            for binding in ARCHIVE_01 ARCHIVE_02; do
              file="/tmp/${mode}-${binding}-diagnostic.json"
              code=0
              npx wrangler d1 execute "$binding" --remote --json --command "SELECT id,link,source,pubDate FROM articles WHERE source='香港01' AND ${condition} ORDER BY pubDate DESC,id DESC" > "$file" || code=$?
              echo "Read-only diagnostic: mode=$mode shard=$binding exit=$code lower=$lower upper=$upper"
              node - "$file" <<'NODE'
          const fs = require('fs');
          const raw = fs.readFileSync(process.argv[2], 'utf8');
          let payload;
          try { payload = JSON.parse(raw); } catch { console.log(`Non-JSON response: ${Buffer.byteLength(raw)} bytes`); process.exit(0); }
          const chunks = Array.isArray(payload) ? payload : [payload];
          for (const chunk of chunks) {
            if (Array.isArray(chunk.results)) {
              console.log(JSON.stringify({ rows: chunk.results.length, success: chunk.success, meta: chunk.meta }));
            } else {
              console.log(JSON.stringify(chunk).slice(0, 4000));
            }
          }
          NODE
            done
          done
