name: HK01 background archive backfill

on:
  workflow_dispatch:
    inputs:
      limit:
        description: Read-only paged snapshot verification; no batch writes
        default: '500'
        type: choice
        options: ['500', '1000']

permissions:
  contents: read

jobs:
  execute:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: production
    env:
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - name: Install pinned Wrangler
        working-directory: worker
        run: npm install --ignore-scripts --no-audit --no-fund
      - name: Read-only source cursor
        working-directory: worker
        shell: bash
        run: |
          set -euo pipefail
          for binding in ARCHIVE_01 ARCHIVE_02; do
            npx wrangler d1 execute "$binding" --remote --json --command "SELECT source_key,cursor FROM archive_backfill_state WHERE source_key='hk01:search'" > "/tmp/${binding}-state.json"
          done
          node <<'NODE'
          const fs = require('fs');
          const read = binding => JSON.parse(fs.readFileSync(`/tmp/${binding}-state.json`, 'utf8'))[0].results[0];
          const row = read('ARCHIVE_02') || read('ARCHIVE_01');
          if (!row) throw new Error('Expected persisted source cursor');
          fs.writeFileSync('/tmp/hk01-background-state.json', JSON.stringify([{results: [row]}]));
          console.log(`Read-only verification cursor: ${row.cursor}`);
          NODE
      - name: Read-only verification of complete paginated snapshots
        working-directory: worker
        shell: bash
        run: |
          set -euo pipefail
          node scripts/hk01-background-snapshot.mjs --state=/tmp/hk01-background-state.json --out-dir=/tmp
          node <<'NODE'
          const fs = require('fs');
          let total = 0;
          for (const binding of ['archive_01', 'archive_02']) {
            const payload = JSON.parse(fs.readFileSync(`/tmp/${binding}-existing.json`, 'utf8'));
            if (!Array.isArray(payload?.[0]?.results)) throw new Error(`Invalid snapshot ${binding}`);
            const rows = payload[0].results.length;
            total += rows;
            console.log(`Verified paginated snapshot: ${binding} rows=${rows}`);
          }
          console.log(`Verified paginated total: ${total}`);
          NODE
