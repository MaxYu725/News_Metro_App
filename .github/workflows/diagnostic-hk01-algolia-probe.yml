name: Diagnostic HK01 search index legacy probe

on:
  push:
    branches:
      - diagnostic/hk01-legacy-probe

permissions:
  contents: read

jobs:
  probe-search-index:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Estimate exact HK01 archive volume
        shell: bash
        run: |
          python - <<'PY'
          import datetime as dt
          import json
          import re
          import time
          import urllib.error
          import urllib.parse
          import urllib.request
          from urllib.parse import urljoin

          UA = 'Mozilla/5.0 (compatible; Nwes-HK01-volume-probe/1.0)'
          SEARCH_ORIGIN = 'https://universal-search.hk01.com'

          def fetch_text(url, limit=5_000_000):
              req = urllib.request.Request(url, headers={'User-Agent': UA, 'Accept': '*/*'})
              with urllib.request.urlopen(req, timeout=25) as r:
                  return r.geturl(), r.read(limit).decode('utf-8', 'replace')

          home_url, html = fetch_text(SEARCH_ORIGIN + '/', 1_000_000)
          scripts = [urljoin(home_url, src) for src in re.findall(r'<script[^>]+src=["\']([^"\']+)', html, flags=re.I)]
          bundle = ''
          for url in scripts:
              if 'universal-search.hk01.com/static/js/' in url:
                  _, text = fetch_text(url)
                  bundle += '\n' + text

          def env(name):
              m = re.search(rf'{re.escape(name)}:["\']([^"\']+)', bundle)
              return m.group(1) if m else ''

          app_id = env('REACT_APP_ALGOLIA_APP_ID')
          api_key = env('REACT_APP_ALGOLIA_API_KEY')
          index = env('REACT_APP_HK01_ARTICLE_INDEX_NAME')
          if not app_id or not api_key or not index:
              raise SystemExit('search index config not discovered')

          base = f'https://{app_id.lower()}-dsn.algolia.net/1/indexes/{urllib.parse.quote(index, safe="")}'
          headers = {
              'X-Algolia-Application-Id': app_id,
              'X-Algolia-API-Key': api_key,
              'Content-Type': 'application/json',
              'Accept': 'application/json',
              'User-Agent': UA,
              'Origin': SEARCH_ORIGIN,
              'Referer': SEARCH_ORIGIN + '/',
          }
          request_count = 0

          def query_count(start, end):
              global request_count
              params = {
                  'query': '',
                  'hitsPerPage': 1,
                  'page': 0,
                  'distinct': 0,
                  'filters': f'published_at_ts >= {start} AND published_at_ts < {end} AND type:article',
              }
              data = json.dumps({'params': urllib.parse.urlencode(params)}, separators=(',', ':')).encode()
              req = urllib.request.Request(base + '/query', data=data, headers=headers, method='POST')
              request_count += 1
              for attempt in range(4):
                  try:
                      with urllib.request.urlopen(req, timeout=25) as r:
                          body = json.loads(r.read().decode('utf-8', 'replace'))
                          return int(body.get('nbHits', 0)), bool(body.get('exhaustiveNbHits'))
                  except urllib.error.HTTPError as exc:
                      if exc.code == 429 and attempt < 3:
                          time.sleep(1.0 + attempt)
                          continue
                      raw = exc.read().decode('utf-8', 'replace')
                      raise RuntimeError(f'HTTP {exc.code}: {raw[:400]}')
              raise RuntimeError('query retries exhausted')

          def exact_count(start, end, depth=0):
              count, exhaustive = query_count(start, end)
              if exhaustive:
                  return count, 1, count, depth
              if end - start <= 3600:
                  raise RuntimeError(f'non-exhaustive one-hour interval {start}..{end}: {count}')
              mid = start + (end - start) // 2
              left = exact_count(start, mid, depth + 1)
              right = exact_count(mid, end, depth + 1)
              return (
                  left[0] + right[0],
                  left[1] + right[1],
                  max(left[2], right[2]),
                  max(left[3], right[3]),
              )

          def epoch(y, m=1, d=1):
              return int(dt.datetime(y, m, d, tzinfo=dt.timezone.utc).timestamp())

          print('CONFIG', {'index': index})
          grand_total = 0
          for year in range(2016, 2027):
              start = epoch(year)
              if year == 2026:
                  end_dt = dt.datetime.now(dt.timezone.utc) + dt.timedelta(days=1)
                  end_dt = dt.datetime(end_dt.year, end_dt.month, end_dt.day, tzinfo=dt.timezone.utc)
                  end = int(end_dt.timestamp())
              else:
                  end = epoch(year + 1)
              before = request_count
              count, leaf_segments, max_leaf_count, max_depth = exact_count(start, end)
              used = request_count - before
              grand_total += count
              print('YEAR_EXACT', year, {
                  'count': count,
                  'leafSegments': leaf_segments,
                  'maxLeafCount': max_leaf_count,
                  'maxDepth': max_depth,
                  'requests': used,
              })
          print('GRAND_TOTAL', grand_total)
          print('REQUESTS_TOTAL', request_count)
          PY
