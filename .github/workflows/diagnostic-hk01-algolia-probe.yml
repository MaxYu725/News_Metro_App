name: Diagnostic HK01 search index legacy probe

on:
  push:
    branches:
      - diagnostic/hk01-legacy-probe

permissions:
  contents: read

jobs:
  probe-search-index:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Test date-partitioned HK01 archive discovery
        shell: bash
        run: |
          python - <<'PY'
          import datetime as dt
          import json
          import re
          import urllib.error
          import urllib.parse
          import urllib.request
          from urllib.parse import urljoin

          UA = 'Mozilla/5.0 (compatible; Nwes-HK01-archive-partition-probe/1.0)'
          SEARCH_ORIGIN = 'https://universal-search.hk01.com'

          def fetch_text(url, limit=5_000_000):
              req = urllib.request.Request(url, headers={'User-Agent': UA, 'Accept': '*/*'})
              with urllib.request.urlopen(req, timeout=25) as r:
                  return r.geturl(), r.read(limit).decode('utf-8', 'replace')

          home_url, html = fetch_text(SEARCH_ORIGIN + '/', 1_000_000)
          scripts = [urljoin(home_url, src) for src in re.findall(r'<script[^>]+src=["\']([^"\']+)', html, flags=re.I)]
          bundle = ''
          for url in scripts:
              if 'universal-search.hk01.com/static/js/' in url:
                  _, text = fetch_text(url)
                  bundle += '\n' + text

          def env(name):
              m = re.search(rf'{re.escape(name)}:["\']([^"\']+)', bundle)
              return m.group(1) if m else ''

          app_id = env('REACT_APP_ALGOLIA_APP_ID')
          api_key = env('REACT_APP_ALGOLIA_API_KEY')
          index = env('REACT_APP_HK01_ARTICLE_INDEX_NAME')
          if not app_id or not api_key or not index:
              raise SystemExit('search index config not discovered')
          print('CONFIG', {'app_id_found': True, 'api_key_found': True, 'index': index})

          base = f'https://{app_id.lower()}-dsn.algolia.net/1/indexes/{urllib.parse.quote(index, safe="")}'
          headers = {
              'X-Algolia-Application-Id': app_id,
              'X-Algolia-API-Key': api_key,
              'Content-Type': 'application/json',
              'Accept': 'application/json',
              'User-Agent': UA,
              'Origin': SEARCH_ORIGIN,
              'Referer': SEARCH_ORIGIN + '/',
          }

          def request(method, path, payload=None):
              data = None if payload is None else json.dumps(payload, separators=(',', ':')).encode()
              req = urllib.request.Request(base + path, data=data, headers=headers, method=method)
              try:
                  with urllib.request.urlopen(req, timeout=25) as r:
                      return r.status, json.loads(r.read().decode('utf-8', 'replace'))
              except urllib.error.HTTPError as exc:
                  raw = exc.read().decode('utf-8', 'replace')
                  try:
                      body = json.loads(raw)
                  except Exception:
                      body = {'raw': raw[:1200]}
                  return exc.code, body

          def query(params):
              return request('POST', '/query', {'params': urllib.parse.urlencode(params)})

          def epoch(y, m=1, d=1):
              return int(dt.datetime(y, m, d, tzinfo=dt.timezone.utc).timestamp())

          print('=== settings ACL ===')
          status, settings = request('GET', '/settings')
          print('SETTINGS', {'status': status})
          if status == 200:
              for key in ('attributesForFaceting', 'paginationLimitedTo', 'replicas', 'ranking', 'customRanking'):
                  print(key, json.dumps(settings.get(key), ensure_ascii=False))
          else:
              print('SETTINGS_BODY', json.dumps(settings, ensure_ascii=False)[:1000])

          print('=== annual published_at_ts counts ===')
          for year in range(2016, 2027):
              numeric = json.dumps([
                  f'published_at_ts>={epoch(year)}',
                  f'published_at_ts<{epoch(year + 1)}',
              ], separators=(',', ':'))
              status, body = query({
                  'query': '',
                  'hitsPerPage': 1,
                  'page': 0,
                  'numericFilters': numeric,
              })
              print('YEAR', year, {
                  'status': status,
                  'nbHits': body.get('nbHits') if isinstance(body, dict) else None,
                  'nbPages': body.get('nbPages') if isinstance(body, dict) else None,
              })

          print('=== type filter probe ===')
          numeric_2016 = json.dumps([
              f'published_at_ts>={epoch(2016)}',
              f'published_at_ts<{epoch(2017)}',
          ], separators=(',', ':'))
          for filter_expr in ('type:article', 'type:"article"'):
              status, body = query({
                  'query': '',
                  'hitsPerPage': 1,
                  'page': 0,
                  'numericFilters': numeric_2016,
                  'filters': filter_expr,
              })
              print('TYPE_FILTER', filter_expr, {
                  'status': status,
                  'nbHits': body.get('nbHits') if isinstance(body, dict) else None,
                  'message': body.get('message') if isinstance(body, dict) else None,
              })

          print('=== 2016 monthly counts ===')
          for month in range(1, 13):
              start = int(dt.datetime(2016, month, 1, tzinfo=dt.timezone.utc).timestamp())
              if month == 12:
                  end = epoch(2017)
              else:
                  end = int(dt.datetime(2016, month + 1, 1, tzinfo=dt.timezone.utc).timestamp())
              numeric = json.dumps([
                  f'published_at_ts>={start}',
                  f'published_at_ts<{end}',
              ], separators=(',', ':'))
              status, body = query({
                  'query': '',
                  'hitsPerPage': 1,
                  'page': 0,
                  'numericFilters': numeric,
              })
              print('MONTH', f'2016-{month:02d}', {
                  'status': status,
                  'nbHits': body.get('nbHits') if isinstance(body, dict) else None,
              })

          print('=== one-day retrieval feasibility ===')
          start = int(dt.datetime(2016, 7, 1, tzinfo=dt.timezone.utc).timestamp())
          end = int(dt.datetime(2016, 7, 2, tzinfo=dt.timezone.utc).timestamp())
          numeric = json.dumps([
              f'published_at_ts>={start}',
              f'published_at_ts<{end}',
          ], separators=(',', ':'))
          status, body = query({
              'query': '',
              'hitsPerPage': 100,
              'page': 0,
              'numericFilters': numeric,
          })
          print('DAY', '2016-07-01', {
              'status': status,
              'nbHits': body.get('nbHits') if isinstance(body, dict) else None,
              'nbPages': body.get('nbPages') if isinstance(body, dict) else None,
              'returned': len(body.get('hits', [])) if isinstance(body, dict) else None,
          })
          if isinstance(body, dict):
              for hit in body.get('hits', [])[:8]:
                  print(' DAY_HIT', json.dumps({
                      'id': hit.get('id'),
                      'title': hit.get('title'),
                      'url': hit.get('url'),
                      'type': hit.get('type'),
                      'published_at': hit.get('published_at'),
                      'published_at_ts': hit.get('published_at_ts'),
                      'main_category': hit.get('main_category'),
                      'lead': hit.get('lead'),
                      'main_image': hit.get('main_image'),
                  }, ensure_ascii=False, separators=(',', ':')))
          PY
