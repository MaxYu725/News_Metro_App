name: Diagnostic HK01 search index legacy probe

on:
  push:
    branches:
      - diagnostic/hk01-legacy-probe

permissions:
  contents: read

jobs:
  probe-search-index:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Verify HK01 archive date partitions
        shell: bash
        run: |
          python - <<'PY'
          import datetime as dt
          import json
          import re
          import urllib.error
          import urllib.parse
          import urllib.request
          from urllib.parse import urljoin

          UA = 'Mozilla/5.0 (compatible; Nwes-HK01-archive-filter-probe/1.0)'
          SEARCH_ORIGIN = 'https://universal-search.hk01.com'

          def fetch_text(url, limit=5_000_000):
              req = urllib.request.Request(url, headers={'User-Agent': UA, 'Accept': '*/*'})
              with urllib.request.urlopen(req, timeout=25) as r:
                  return r.geturl(), r.read(limit).decode('utf-8', 'replace')

          home_url, html = fetch_text(SEARCH_ORIGIN + '/', 1_000_000)
          scripts = [urljoin(home_url, src) for src in re.findall(r'<script[^>]+src=["\']([^"\']+)', html, flags=re.I)]
          bundle = ''
          for url in scripts:
              if 'universal-search.hk01.com/static/js/' in url:
                  _, text = fetch_text(url)
                  bundle += '\n' + text

          def env(name):
              m = re.search(rf'{re.escape(name)}:["\']([^"\']+)', bundle)
              return m.group(1) if m else ''

          app_id = env('REACT_APP_ALGOLIA_APP_ID')
          api_key = env('REACT_APP_ALGOLIA_API_KEY')
          index = env('REACT_APP_HK01_ARTICLE_INDEX_NAME')
          if not app_id or not api_key or not index:
              raise SystemExit('search index config not discovered')
          print('CONFIG', {'app_id_found': True, 'api_key_found': True, 'index': index})

          base = f'https://{app_id.lower()}-dsn.algolia.net/1/indexes/{urllib.parse.quote(index, safe="")}'
          headers = {
              'X-Algolia-Application-Id': app_id,
              'X-Algolia-API-Key': api_key,
              'Content-Type': 'application/json',
              'Accept': 'application/json',
              'User-Agent': UA,
              'Origin': SEARCH_ORIGIN,
              'Referer': SEARCH_ORIGIN + '/',
          }

          def query(params):
              data = json.dumps({'params': urllib.parse.urlencode(params)}, separators=(',', ':')).encode()
              req = urllib.request.Request(base + '/query', data=data, headers=headers, method='POST')
              try:
                  with urllib.request.urlopen(req, timeout=25) as r:
                      return r.status, json.loads(r.read().decode('utf-8', 'replace'))
              except urllib.error.HTTPError as exc:
                  raw = exc.read().decode('utf-8', 'replace')
                  try:
                      return exc.code, json.loads(raw)
                  except Exception:
                      return exc.code, {'raw': raw[:1200]}

          def epoch(y, m=1, d=1):
              return int(dt.datetime(y, m, d, tzinfo=dt.timezone.utc).timestamp())

          def range_filter(start, end, article_only=True):
              parts = [f'published_at_ts >= {start}', f'published_at_ts < {end}']
              if article_only:
                  parts.append('type:article')
              return ' AND '.join(parts)

          print('=== annual exact range counts ===')
          total = 0
          for year in range(2016, 2027):
              status, body = query({
                  'query': '',
                  'hitsPerPage': 1,
                  'page': 0,
                  'filters': range_filter(epoch(year), epoch(year + 1)),
              })
              count = body.get('nbHits') if isinstance(body, dict) else None
              if isinstance(count, int):
                  total += count
              print('YEAR', year, {'status': status, 'nbHits': count})
          print('YEAR_SUM', total)

          print('=== 2016 exact monthly counts ===')
          monthly_total = 0
          for month in range(1, 13):
              start = int(dt.datetime(2016, month, 1, tzinfo=dt.timezone.utc).timestamp())
              end = epoch(2017) if month == 12 else int(dt.datetime(2016, month + 1, 1, tzinfo=dt.timezone.utc).timestamp())
              status, body = query({
                  'query': '',
                  'hitsPerPage': 1,
                  'page': 0,
                  'filters': range_filter(start, end),
              })
              count = body.get('nbHits') if isinstance(body, dict) else None
              if isinstance(count, int):
                  monthly_total += count
              print('MONTH', f'2016-{month:02d}', {'status': status, 'nbHits': count})
          print('MONTH_SUM_2016', monthly_total)

          print('=== one-day complete retrieval proof ===')
          start = int(dt.datetime(2016, 7, 1, tzinfo=dt.timezone.utc).timestamp())
          end = int(dt.datetime(2016, 7, 2, tzinfo=dt.timezone.utc).timestamp())
          filter_expr = range_filter(start, end)
          status, first = query({
              'query': '',
              'hitsPerPage': 100,
              'page': 0,
              'filters': filter_expr,
          })
          nb_hits = first.get('nbHits') if isinstance(first, dict) else None
          nb_pages = first.get('nbPages') if isinstance(first, dict) else None
          gathered = []
          if status == 200 and isinstance(nb_pages, int):
              for page in range(nb_pages):
                  if page == 0:
                      body = first
                  else:
                      pstatus, body = query({
                          'query': '',
                          'hitsPerPage': 100,
                          'page': page,
                          'filters': filter_expr,
                      })
                      if pstatus != 200:
                          raise SystemExit(f'page {page} failed: {pstatus}')
                  gathered.extend(body.get('hits', []))
          ids = [str(hit.get('id') or '') for hit in gathered if hit.get('id')]
          print('DAY', '2016-07-01', {
              'status': status,
              'nbHits': nb_hits,
              'nbPages': nb_pages,
              'gathered': len(gathered),
              'uniqueIds': len(set(ids)),
              'complete': isinstance(nb_hits, int) and len(gathered) == nb_hits and len(set(ids)) == nb_hits,
          })
          for hit in gathered[:8]:
              print(' DAY_HIT', json.dumps({
                  'id': hit.get('id'),
                  'title': hit.get('title'),
                  'url': hit.get('url'),
                  'published_at': hit.get('published_at'),
                  'published_at_ts': hit.get('published_at_ts'),
                  'main_category': hit.get('main_category'),
                  'lead': hit.get('lead'),
                  'main_image': hit.get('main_image'),
              }, ensure_ascii=False, separators=(',', ':')))
          PY
