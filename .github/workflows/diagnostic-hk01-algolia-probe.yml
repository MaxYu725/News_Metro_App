name: Diagnostic HK01 search index legacy probe

on:
  push:
    branches:
      - diagnostic/hk01-legacy-probe

permissions:
  contents: read

jobs:
  probe-search-index:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Check HK01 count semantics and retrieval
        shell: bash
        run: |
          python - <<'PY'
          import datetime as dt
          import json
          import re
          import urllib.error
          import urllib.parse
          import urllib.request
          from urllib.parse import urljoin

          UA = 'Mozilla/5.0 (compatible; Nwes-HK01-count-semantics-probe/1.0)'
          SEARCH_ORIGIN = 'https://universal-search.hk01.com'

          def fetch_text(url, limit=5_000_000):
              req = urllib.request.Request(url, headers={'User-Agent': UA, 'Accept': '*/*'})
              with urllib.request.urlopen(req, timeout=25) as r:
                  return r.geturl(), r.read(limit).decode('utf-8', 'replace')

          home_url, html = fetch_text(SEARCH_ORIGIN + '/', 1_000_000)
          scripts = [urljoin(home_url, src) for src in re.findall(r'<script[^>]+src=["\']([^"\']+)', html, flags=re.I)]
          bundle = ''
          for url in scripts:
              if 'universal-search.hk01.com/static/js/' in url:
                  _, text = fetch_text(url)
                  bundle += '\n' + text

          def env(name):
              m = re.search(rf'{re.escape(name)}:["\']([^"\']+)', bundle)
              return m.group(1) if m else ''

          app_id = env('REACT_APP_ALGOLIA_APP_ID')
          api_key = env('REACT_APP_ALGOLIA_API_KEY')
          index = env('REACT_APP_HK01_ARTICLE_INDEX_NAME')
          if not app_id or not api_key or not index:
              raise SystemExit('search index config not discovered')

          base = f'https://{app_id.lower()}-dsn.algolia.net/1/indexes/{urllib.parse.quote(index, safe="")}'
          headers = {
              'X-Algolia-Application-Id': app_id,
              'X-Algolia-API-Key': api_key,
              'Content-Type': 'application/json',
              'Accept': 'application/json',
              'User-Agent': UA,
              'Origin': SEARCH_ORIGIN,
              'Referer': SEARCH_ORIGIN + '/',
          }

          def query(params):
              data = json.dumps({'params': urllib.parse.urlencode(params)}, separators=(',', ':')).encode()
              req = urllib.request.Request(base + '/query', data=data, headers=headers, method='POST')
              try:
                  with urllib.request.urlopen(req, timeout=25) as r:
                      return r.status, json.loads(r.read().decode('utf-8', 'replace'))
              except urllib.error.HTTPError as exc:
                  raw = exc.read().decode('utf-8', 'replace')
                  try:
                      return exc.code, json.loads(raw)
                  except Exception:
                      return exc.code, {'raw': raw[:1200]}

          def ep(y, m=1, d=1):
              return int(dt.datetime(y, m, d, tzinfo=dt.timezone.utc).timestamp())

          def f(start, end):
              return f'published_at_ts >= {start} AND published_at_ts < {end} AND type:article'

          ranges = [
              ('2016-year', ep(2016), ep(2017)),
              ('2016-Jan', ep(2016,1,1), ep(2016,2,1)),
              ('2016-Feb', ep(2016,2,1), ep(2016,3,1)),
              ('2016-Jul01-UTC', ep(2016,7,1), ep(2016,7,2)),
          ]

          print('CONFIG', {'index': index})
          for name, start, end in ranges:
              for distinct in (None, 0, 1):
                  params = {
                      'query': '',
                      'hitsPerPage': 1,
                      'page': 0,
                      'filters': f(start, end),
                  }
                  if distinct is not None:
                      params['distinct'] = distinct
                  status, body = query(params)
                  print('COUNT', name, 'distinct=', distinct, {
                      'status': status,
                      'nbHits': body.get('nbHits') if isinstance(body, dict) else None,
                      'exhaustiveNbHits': body.get('exhaustiveNbHits') if isinstance(body, dict) else None,
                      'exhaustive': body.get('exhaustive') if isinstance(body, dict) else None,
                      'message': body.get('message') if isinstance(body, dict) else None,
                  })

          print('=== day paging with distinct=0 ===')
          start, end = ep(2016,7,1), ep(2016,7,2)
          status, first = query({
              'query': '',
              'hitsPerPage': 100,
              'page': 0,
              'filters': f(start, end),
              'distinct': 0,
          })
          pages = first.get('nbPages', 0) if isinstance(first, dict) else 0
          hits = []
          for page in range(pages):
              if page == 0:
                  body = first
              else:
                  pstatus, body = query({
                      'query': '',
                      'hitsPerPage': 100,
                      'page': page,
                      'filters': f(start, end),
                      'distinct': 0,
                  })
                  if pstatus != 200:
                      raise SystemExit(f'page failure {page}: {pstatus}')
              hits.extend(body.get('hits', []))
          ids = [str(x.get('id')) for x in hits if x.get('id')]
          timestamps = [int(x.get('published_at_ts')) for x in hits if x.get('published_at_ts') is not None]
          print('DAY_PAGE_RESULT', {
              'status': status,
              'nbHits': first.get('nbHits') if isinstance(first, dict) else None,
              'nbPages': pages,
              'gathered': len(hits),
              'uniqueIds': len(set(ids)),
              'minTs': min(timestamps) if timestamps else None,
              'maxTs': max(timestamps) if timestamps else None,
              'withinRange': bool(timestamps) and min(timestamps) >= start and max(timestamps) < end,
          })
          PY
