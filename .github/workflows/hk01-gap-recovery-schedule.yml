name: Finite HK01 2026 news gap recovery

on:
  pull_request:
    branches: [main]
    paths:
      - .github/workflows/hk01-gap-recovery-schedule.yml
      - worker/scripts/hk01-gap-recovery.mjs
      - worker/test/hk01-gap-recovery.test.mjs
      - worker/scripts/hk01-gap-day.mjs
  schedule:
    - cron: '37 0,6,12,18 * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: metro-news-archive-backfill
  cancel-in-progress: false

jobs:
  validate:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Check durable progression and verification
        run: |
          node --check worker/scripts/hk01-gap-recovery.mjs
          node --check worker/scripts/hk01-gap-day.mjs
          node --test worker/test/hk01-gap-recovery.test.mjs worker/test/hk01-gap-day.test.mjs

  recover:
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: production
    env:
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
      GAP_WRITE_CONFIRM: ALLOW_ARCHIVE_03_WRITE
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Install pinned Wrangler
        working-directory: worker
        run: npm install --ignore-scripts --no-audit --no-fund
      - name: Resume earliest incomplete UTC day and verify before advancing
        shell: bash
        run: |
          set -euo pipefail
          node worker/scripts/hk01-gap-recovery.mjs
