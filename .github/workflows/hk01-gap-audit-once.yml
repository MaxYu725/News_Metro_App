name: One-time HK01 sample coverage audit (read-only)

on:
  pull_request:
    branches: [main]
    paths:
      - .github/workflows/hk01-gap-audit-once.yml
  push:
    branches: [main]
    paths:
      - .github/workflows/hk01-gap-audit-once.yml

permissions:
  contents: read

concurrency:
  group: metro-news-archive-backfill
  cancel-in-progress: false

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: production
    env:
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Install pinned Wrangler
        working-directory: worker
        run: npm install --ignore-scripts --no-audit --no-fund
      - name: Audit representative days across Aug-Nov 2026
        if: github.event_name == 'push'
        run: |
          set -euo pipefail
          for day in 2026-08-20 2026-09-01 2026-09-15 2026-10-01 2026-10-15 2026-11-01; do
            echo "=== Auditing $day ==="
            node worker/scripts/hk01-gap-day.mjs --date="$day" --mode=dry-run --limit=100
          done
