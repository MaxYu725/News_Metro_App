name: One-time HK01 historical gap repair (controlled)

on:
  pull_request:
    branches: [main]
    paths:
      - .github/workflows/hk01-gap-audit-once.yml
  push:
    branches: [main]
    paths:
      - .github/workflows/hk01-gap-audit-once.yml

permissions:
  contents: read

concurrency:
  group: metro-news-archive-backfill
  cancel-in-progress: false

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: production
    env:
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
      GAP_WRITE_CONFIRM: ALLOW_ARCHIVE_03_WRITE
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Install pinned Wrangler
        working-directory: worker
        run: npm install --ignore-scripts --no-audit --no-fund
      - name: Restore remaining HK01 articles from 2026-10-01
        if: github.event_name == 'push'
        run: node worker/scripts/hk01-gap-day.mjs --date=2026-10-01 --mode=run --limit=500
