name: One-time HK01 priority-day gap repair

on:
  pull_request:
    branches: [main]
    paths:
      - .github/workflows/hk01-gap-audit-once.yml
  push:
    branches: [main]
    paths:
      - .github/workflows/hk01-gap-audit-once.yml

permissions:
  contents: read

concurrency:
  group: metro-news-archive-backfill
  cancel-in-progress: false

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: production
    env:
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
      GAP_WRITE_CONFIRM: ALLOW_ARCHIVE_03_WRITE
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Install pinned Wrangler
        working-directory: worker
        run: npm install --ignore-scripts --no-audit --no-fund
      - name: Restore two verified recent missing HK01 days
        if: github.event_name == 'push'
        run: |
          set -euo pipefail
          for day in 2026-11-01 2026-10-15; do
            echo "=== Restoring $day ==="
            node worker/scripts/hk01-gap-day.mjs --date="$day" --mode=run --limit=500
          done
