name: CF-W4 normalize Worker formatting

on:
  push:
    branches:
      - agent/cf-w4-production-cleanup
    paths:
      - .github/workflows/cf-w4-updater-3.yml

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout CF-W4 branch
        uses: actions/checkout@v4
        with:
          ref: agent/cf-w4-production-cleanup

      - name: Normalize touched Worker blocks
        shell: python
        run: |
          from pathlib import Path

          path = Path('worker/src/index.js')
          text = path.read_text(encoding='utf-8')
          replacements = {
              """export default {
            async scheduled(event, env, ctx) {
            ctx.waitUntil(syncAllCategoriesAndCleanup(env));
          },

          async fetch(request, env, ctx) {""": """export default {
            async scheduled(event, env, ctx) {
              ctx.waitUntil(syncAllCategoriesAndCleanup(env));
            },

            async fetch(request, env, ctx) {""",
              """              await syncCategoryToDB(category, env);
                        if (forceSync) await cleanUpOldArticles(env);""": """              await syncCategoryToDB(category, env);
              if (forceSync) await cleanUpOldArticles(env);""",
          }
          for old, new in replacements.items():
              if old not in text:
                  raise SystemExit('expected formatting target not found')
              text = text.replace(old, new, 1)
          path.write_text(text, encoding='utf-8')

      - name: Commit formatting normalization
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add worker/src/index.js
          git commit -m "style: normalize CF-W4 Worker blocks"
          git push origin HEAD:agent/cf-w4-production-cleanup
