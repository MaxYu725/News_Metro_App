name: NS2C3 Bastille seek updater

on:
  push:
    branches:
      - feature/ns2c3-bastille-depth
    paths:
      - .github/workflows/ns2c3-bastille-seek-updater.yml

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/ns2c3-bastille-depth

      - name: Patch seek algorithm
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          source_path = Path('worker/src/archive-backfill.js')
          source = source_path.read_text('utf-8')
          constant_anchor = "export const ARCHIVE_SHARD_POST_WRITE_MAX_BYTES = 325_000_000;\n"
          if "BASTILLE_SEEK_MAX_PAGE" not in source:
              if constant_anchor not in source:
                  raise SystemExit('archive constant anchor missing')
              source = source.replace(
                  constant_anchor,
                  constant_anchor + "export const BASTILLE_SEEK_MAX_PAGE = 4096;\n",
                  1,
              )

          helper_anchor = "export function sqlLiteral(value) {\n"
          helper = r'''function bastillePageCrossesFloor(articles, floor) {
            return (articles || []).some(article => {
              const pubDate = String(article?.pubDate || '');
              return pubDate && pubDate < floor;
            });
          }

          export async function seekBastillePageBeforeFloor(
            floor,
            fetchPage = fetchBastilleHistoricalPage,
          ) {
            if (!floor) return { page: 1, probes: 0 };

            let probes = 0;
            const cache = new Map();
            const load = async page => {
              if (cache.has(page)) return cache.get(page);
              const result = await fetchPage(page);
              probes += 1;
              cache.set(page, result);
              return result;
            };

            let low = 0;
            let high = 1;
            while (high <= BASTILLE_SEEK_MAX_PAGE) {
              const result = await load(high);
              if (bastillePageCrossesFloor(result?.articles, floor)) break;
              if (!Array.isArray(result?.articles) || result.articles.length === 0) {
                throw new Error('Bastille history ended before archive floor');
              }
              low = high;
              high *= 2;
            }

            if (high > BASTILLE_SEEK_MAX_PAGE) {
              throw new Error(`Bastille archive floor exceeds seek limit ${BASTILLE_SEEK_MAX_PAGE}`);
            }

            let found = high;
            let left = low + 1;
            let right = high;
            while (left <= right) {
              const mid = Math.floor((left + right) / 2);
              const result = await load(mid);
              const articles = Array.isArray(result?.articles) ? result.articles : [];
              if (articles.length === 0 || bastillePageCrossesFloor(articles, floor)) {
                found = mid;
                right = mid - 1;
              } else {
                left = mid + 1;
              }
            }

            return { page: found, probes };
          }

          '''
          if "export async function seekBastillePageBeforeFloor" not in source:
              if helper_anchor not in source:
                  raise SystemExit('archive helper anchor missing')
              source = source.replace(helper_anchor, helper + helper_anchor, 1)
          source_path.write_text(source, 'utf-8')

          script_path = Path('worker/scripts/archive-backfill.mjs')
          script = script_path.read_text('utf-8')
          old_import = "  fetchHk01HistoricalPage,\n  sqlLiteral,\n"
          new_import = "  fetchHk01HistoricalPage,\n  seekBastillePageBeforeFloor,\n  sqlLiteral,\n"
          if "seekBastillePageBeforeFloor," not in script:
              if old_import not in script:
                  raise SystemExit('generator import anchor missing')
              script = script.replace(old_import, new_import, 1)

          if "const seek = await seekBastillePageBeforeFloor(floor);" not in script:
              function_start = script.find("async function collectBastille(")
              if function_start < 0:
                  raise SystemExit('collectBastille marker missing')
              pages_marker = "  let pages = 0;\n"
              pages_pos = script.find(pages_marker, function_start)
              while_pos = script.find("  while (selected.length - startCount < target", pages_pos)
              if pages_pos < 0 or while_pos < 0:
                  raise SystemExit('collectBastille pages/while markers missing')
              insert_pos = pages_pos + len(pages_marker)
              seek_block = """

              if (!row && floor) {
                const seek = await seekBastillePageBeforeFloor(floor);
                state.cursor = String(seek.page);
                state.pagesFetched += seek.probes;
                pages += seek.probes;
              }
              """
              script = script[:insert_pos] + seek_block + script[insert_pos:]
          script_path.write_text(script, 'utf-8')

          validator_path = Path('.github/scripts/validate-worker-baseline.py')
          validator = validator_path.read_text('utf-8')
          old_signal = '                "ARCHIVE_SHARD_POST_WRITE_MAX_BYTES = 325_000_000",\n'
          if "BASTILLE_SEEK_MAX_PAGE = 4096" not in validator:
              if old_signal not in validator:
                  raise SystemExit('validator constant anchor missing')
              validator = validator.replace(
                  old_signal,
                  old_signal + '                "BASTILLE_SEEK_MAX_PAGE = 4096",\n',
                  1,
              )

          old_helper_signal = '                "backfillMarkCompletedSql",\n'
          if '"seekBastillePageBeforeFloor"' not in validator:
              if old_helper_signal not in validator:
                  raise SystemExit('validator helper anchor missing')
              validator = validator.replace(
                  old_helper_signal,
                  old_helper_signal + '                "seekBastillePageBeforeFloor",\n',
                  1,
              )

          old_generator_signal = '                "args[\'batch-id\']",\n'
          if '"seekBastillePageBeforeFloor(floor)"' not in validator:
              if old_generator_signal not in validator:
                  raise SystemExit('validator generator anchor missing')
              validator = validator.replace(
                  old_generator_signal,
                  old_generator_signal + '                "seekBastillePageBeforeFloor(floor)",\n',
                  1,
              )
          validator_path.write_text(validator, 'utf-8')
          PY

          node --check worker/src/archive-backfill.js
          node --check worker/scripts/archive-backfill.mjs
          python3 .github/scripts/validate-worker-baseline.py
          cd worker
          npm install --ignore-scripts --no-audit --no-fund
          npm test

      - name: Commit seek patch
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add worker/src/archive-backfill.js worker/scripts/archive-backfill.mjs .github/scripts/validate-worker-baseline.py
          git commit -m 'NS2C3R1: seek Bastille history by date'
          git push origin HEAD:feature/ns2c3-bastille-depth
