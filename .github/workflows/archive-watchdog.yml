name: Archive backfill watchdog

on:
  schedule:
    - cron: '43 1 * * *'
  workflow_dispatch:

concurrency:
  group: metro-news-archive-watchdog
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  health:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: production
    env:
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
    steps:
      - uses: actions/checkout@v4

      - name: Validate Cloudflare credentials
        shell: bash
        run: |
          set -euo pipefail
          test -n "${CLOUDFLARE_ACCOUNT_ID:-}" || { echo '::error::CF_ACCOUNT_ID is missing'; exit 1; }
          test -n "${CLOUDFLARE_API_TOKEN:-}" || { echo '::error::CF_API_TOKEN is missing'; exit 1; }

      - name: Install pinned Wrangler
        working-directory: worker
        run: npm install --ignore-scripts --no-audit --no-fund

      - name: Audit archive heartbeat
        shell: bash
        run: |
          set -euo pipefail
          cd worker
          npx wrangler d1 execute ARCHIVE_01 --remote --json --command "
            SELECT
              (SELECT COUNT(*) FROM articles) AS total_rows,
              (SELECT COUNT(*) FROM articles WHERE source='香港01') AS hk01_rows,
              (SELECT MIN(pubDate) FROM articles WHERE source='香港01') AS hk01_oldest,
              (SELECT cursor FROM archive_backfill_state WHERE source_key='hk01:search') AS cursor,
              (SELECT exhausted FROM archive_backfill_state WHERE source_key='hk01:search') AS exhausted,
              (SELECT MAX(completed_at) FROM archive_backfill_runs WHERE source='hk01' AND status='completed') AS latest_completed_at,
              (SELECT requested_rows FROM archive_backfill_runs WHERE source='hk01' AND status='completed' ORDER BY completed_at DESC LIMIT 1) AS latest_requested,
              (SELECT generated_rows FROM archive_backfill_runs WHERE source='hk01' AND status='completed' ORDER BY completed_at DESC LIMIT 1) AS latest_generated,
              (SELECT COUNT(*) FROM archive_backfill_runs WHERE status IN ('planned','written') AND created_at < datetime('now','-2 hours')) AS stale_open_batches
          " > /tmp/archive-watchdog.json

          node <<'NODE'
          const fs = require('fs');
          const payload = JSON.parse(fs.readFileSync('/tmp/archive-watchdog.json', 'utf8'));
          const first = Array.isArray(payload) ? payload[0] : payload?.result?.[0];
          const row = first?.results?.[0] || first?.result?.results?.[0] || {};
          const size = Number(first?.meta?.size_after || first?.result?.meta?.size_after || 0);
          const latest = row.latest_completed_at ? Date.parse(`${row.latest_completed_at}Z`.replace('ZZ', 'Z')) : NaN;
          const ageHours = Number.isFinite(latest) ? (Date.now() - latest) / 3_600_000 : Infinity;
          const exhausted = Number(row.exhausted || 0) === 1;
          const stale = Number(row.stale_open_batches || 0);
          const requested = Number(row.latest_requested || 0);
          const generated = Number(row.latest_generated || 0);
          const capacityHalted = size >= 300_000_000;

          const summary = [
            '## Archive watchdog',
            `- total rows: ${Number(row.total_rows || 0)}`,
            `- HK01 rows: ${Number(row.hk01_rows || 0)}`,
            `- HK01 oldest: ${row.hk01_oldest || 'unknown'}`,
            `- latest completed: ${row.latest_completed_at || 'unknown'}`,
            `- hours since completed: ${Number.isFinite(ageHours) ? ageHours.toFixed(1) : 'unknown'}`,
            `- latest batch: ${generated}/${requested}`,
            `- stale open batches: ${stale}`,
            `- archive size: ${size} bytes`,
            `- capacity halted: ${capacityHalted}`,
            `- exhausted: ${exhausted}`,
          ];
          fs.appendFileSync(process.env.GITHUB_STEP_SUMMARY, `${summary.join('\n')}\n`);

          if (stale > 0) throw new Error(`archive has ${stale} stale planned/written batch(es)`);
          if (requested > 0 && generated !== requested) throw new Error(`latest completed batch mismatch: ${generated}/${requested}`);
          if (!capacityHalted && !exhausted && ageHours > 9) {
            throw new Error(`HK01 background backfill heartbeat stale: ${ageHours.toFixed(1)} hours`);
          }
          if (capacityHalted) console.log('Archive capacity guard reached; background pause is expected.');
          else if (exhausted) console.log('HK01 archive source is exhausted; background pause is expected.');
          else console.log('Archive watchdog: healthy');
          NODE
