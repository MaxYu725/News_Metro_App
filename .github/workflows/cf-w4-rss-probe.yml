name: CF-W4 D1 collision probe

on:
  push:
    branches:
      - agent/cf-w4r2-upstream-diagnosis
    paths:
      - .github/workflows/cf-w4-rss-probe.yml

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Compare live image feed links with public production D1 search
        shell: node {0}
        run: |
          const RSS_BASE = 'https://rsshub.rssforever.com';
          const WORKER = 'https://news-proxy.maxyu0725us.workers.dev';
          const paths = ['/hk01/channel/259', '/hk01/channel/256'];

          function parseItems(xml) {
            const rows = [];
            for (const match of xml.matchAll(/<item>([\s\S]*?)<\/item>/g)) {
              const content = match[1];
              const title = (content.match(/<title><!\[CDATA\[([\s\S]*?)\]\]><\/title>/) || content.match(/<title>([\s\S]*?)<\/title>/))?.[1]?.trim() || '';
              const link = content.match(/<link>([\s\S]*?)<\/link>/)?.[1]?.trim() || '';
              const pubDate = content.match(/<pubDate>([\s\S]*?)<\/pubDate>/)?.[1]?.trim() || '';
              if (title && link) rows.push({ title, link, pubDate });
            }
            return rows;
          }

          function searchTerm(title) {
            return title
              .replace(/[【】「」『』（）()｜|·．。！？：:、,.]/g, ' ')
              .replace(/\s+/g, ' ')
              .trim()
              .slice(0, 36);
          }

          const feedItems = [];
          for (const path of paths) {
            const response = await fetch(RSS_BASE + path, { signal: AbortSignal.timeout(15000) });
            const xml = await response.text();
            for (const item of parseItems(xml)) feedItems.push({ path, ...item });
          }

          async function check(item) {
            const q = searchTerm(item.title);
            const url = `${WORKER}/api/search?q=${encodeURIComponent(q)}&page=0`;
            try {
              const response = await fetch(url, { signal: AbortSignal.timeout(12000) });
              const payload = await response.json();
              const exact = (payload.data || []).find(row => row.link === item.link || row.id === item.link);
              return {
                ...item,
                q,
                http: response.status,
                exact: exact ? { category: exact.category, pubDate: exact.pubDate, title: exact.title } : null,
                resultCount: Array.isArray(payload.data) ? payload.data.length : -1,
              };
            } catch (error) {
              return { ...item, q, http: 'ERR', exact: null, resultCount: -1, error: String(error) };
            }
          }

          const results = [];
          for (let i = 0; i < feedItems.length; i += 8) {
            results.push(...await Promise.all(feedItems.slice(i, i + 8).map(check)));
          }

          const counts = new Map();
          let exactFound = 0;
          for (const result of results) {
            if (result.exact) {
              exactFound += 1;
              counts.set(result.exact.category, (counts.get(result.exact.category) || 0) + 1);
            }
            console.log(JSON.stringify({
              feed: result.path,
              title: result.title.slice(0, 80),
              link: result.link,
              feedPubDate: result.pubDate,
              searchHttp: result.http,
              exactCategory: result.exact?.category || null,
              dbPubDate: result.exact?.pubDate || null,
              searchResultCount: result.resultCount,
            }));
          }

          console.log(`\nfeedItems=${feedItems.length} exactLinksAlreadyInD1=${exactFound}`);
          console.log(`existingCategories=${JSON.stringify(Object.fromEntries([...counts.entries()].sort()))}`);
