name: CF-W4 production sync race probe

on:
  push:
    branches:
      - agent/cf-w4r2-upstream-diagnosis
    paths:
      - .github/workflows/cf-w4-rss-probe.yml

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - name: Observe video row count around one controlled production sync
        shell: node {0}
        run: |
          const WORKER = 'https://news-proxy.maxyu0725us.workers.dev';
          const APP_ORIGIN = 'https://maxyu725.github.io';

          async function videoCount(label) {
            const response = await fetch(`${WORKER}/api/news/video?page=0`, {
              headers: { Origin: APP_ORIGIN },
              signal: AbortSignal.timeout(15000),
            });
            const payload = await response.json();
            const count = Array.isArray(payload.data) ? payload.data.length : -1;
            const dates = (payload.data || []).slice(0, 3).map(row => row.pubDate);
            console.log(`${label}: http=${response.status} pageCount=${count} hasMore=${payload.hasMore} sampleDates=${JSON.stringify(dates)}`);
            return count;
          }

          await videoCount('before-sync');

          const started = Date.now();
          const syncResponse = await fetch(`${WORKER}/api/news/latest?page=0&sync=1`, {
            headers: { Origin: APP_ORIGIN },
            signal: AbortSignal.timeout(90000),
          });
          const syncPayload = await syncResponse.json();
          console.log(`sync: http=${syncResponse.status} success=${syncPayload.success} elapsedMs=${Date.now() - started}`);

          await videoCount('after-sync-0s');
          for (const seconds of [2, 5, 10, 20]) {
            await new Promise(resolve => setTimeout(resolve, seconds * 1000));
            await videoCount(`after-additional-${seconds}s`);
          }
