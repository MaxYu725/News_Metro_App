name: CF-W4R2 normalize final patch

on:
  push:
    branches:
      - agent/cf-w4r2-upstream-diagnosis
    paths:
      - .github/workflows/cf-w4-rss-probe.yml

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout diagnosis branch
        uses: actions/checkout@v4
        with:
          ref: agent/cf-w4r2-upstream-diagnosis

      - name: Normalize touched blocks
        shell: python
        run: |
          from pathlib import Path

          source_path = Path('worker/src/index.js')
          source = source_path.read_text(encoding='utf-8')
          old = """  video: [259, 256].map(channelId => ({
          name: '香港01',
          urls: [`https://rsshub.rssforever.com/hk01/channel/${channelId}`],
          timeoutMs: 20000,
          })),"""
          new = """  video: [259, 256].map(channelId => ({
            name: '香港01',
            urls: [`https://rsshub.rssforever.com/hk01/channel/${channelId}`],
            timeoutMs: 20000,
          })),"""
          if old not in source:
              # The YAML shell can normalize indentation; use a narrow line-based repair.
              lines = source.splitlines()
              inside = False
              for i, line in enumerate(lines):
                  if line.strip() == 'video: [259, 256].map(channelId => ({':
                      inside = True
                      continue
                  if inside and line.strip() == '})),':
                      lines[i] = '  })),'.replace('  ', '  ', 1)
                      inside = False
                      continue
                  if inside:
                      stripped = line.strip()
                      if stripped.startswith("name:") or stripped.startswith('urls:') or stripped.startswith('timeoutMs:'):
                          lines[i] = '    ' + stripped
              source = '\n'.join(lines) + ('\n' if source.endswith('\n') else '')
          else:
              source = source.replace(old, new, 1)
          source_path.write_text(source, encoding='utf-8')

          validator_path = Path('.github/scripts/validate-worker-baseline.py')
          validator = validator_path.read_text(encoding='utf-8')
          validator = validator.replace(
              "        fail('image archive timeout policy is missing')\n    retention_sql =",
              "        fail('image archive timeout policy is missing')\n\n    retention_sql =",
              1,
          )
          validator_path.write_text(validator, encoding='utf-8')

      - name: Validate and commit formatting
        shell: bash
        run: |
          set -euo pipefail
          node --check worker/src/index.js
          python3 .github/scripts/validate-worker-baseline.py
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add worker/src/index.js .github/scripts/validate-worker-baseline.py
          if git diff --cached --quiet; then
            echo 'No formatting changes required.'
            exit 0
          fi
          git commit -m "style: normalize CF-W4R2 source mapping"
          git push origin HEAD:agent/cf-w4r2-upstream-diagnosis
