name: CF-W4 RSS parser probe

on:
  push:
    branches:
      - agent/cf-w4r2-upstream-diagnosis
    paths:
      - .github/workflows/cf-w4-rss-probe.yml

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Reproduce Worker RSS parser on live HK01 image feeds
        shell: node {0}
        run: |
          function decodeHTMLEntities(text) {
            if (!text) return '';
            return text
              .replace(/&lt;/g, '<')
              .replace(/&gt;/g, '>')
              .replace(/&amp;/g, '&')
              .replace(/&quot;/g, '"')
              .replace(/&#39;/g, "'")
              .replace(/&apos;/g, "'")
              .replace(/&nbsp;/g, ' ');
          }

          function parseRSS(xmlString, sourceName, categoryName) {
            const items = [];
            const itemRegex = /<item>([\s\S]*?)<\/item>/g;
            let match;
            while ((match = itemRegex.exec(xmlString)) !== null) {
              const itemContent = match[1];
              const titleMatch = itemContent.match(/<title><!\[CDATA\[([\s\S]*?)\]\]><\/title>/) || itemContent.match(/<title>([\s\S]*?)<\/title>/);
              const title = titleMatch ? titleMatch[1].trim() : '';
              const linkMatch = itemContent.match(/<link>([\s\S]*?)<\/link>/);
              const link = linkMatch ? linkMatch[1].trim() : '';
              const pubDateMatch = itemContent.match(/<pubDate>([\s\S]*?)<\/pubDate>/);
              const pubDate = pubDateMatch ? pubDateMatch[1].trim() : '';
              const descMatch = itemContent.match(/<content:encoded><!\[CDATA\[([\s\S]*?)\]\]><\/content:encoded>/i) || itemContent.match(/<content:encoded>([\s\S]*?)<\/content:encoded>/i) || itemContent.match(/<description><!\[CDATA\[([\s\S]*?)\]\]><\/description>/i) || itemContent.match(/<description>([\s\S]*?)<\/description>/i);
              const rawDescription = descMatch ? descMatch[1].trim() : '';
              const decodedContent = decodeHTMLEntities(rawDescription);
              if (title && link) {
                items.push({ title, link, pubDate, descriptionLength: decodedContent.length, category: categoryName, source: sourceName });
              }
            }
            return items;
          }

          function compact(value, limit = 180) {
            return String(value || '').replace(/\s+/g, ' ').trim().slice(0, limit);
          }

          const base = 'https://rsshub.rssforever.com';
          const paths = ['/hk01/channel/259', '/hk01/channel/256', '/hk01/zone/1'];

          for (const path of paths) {
            const response = await fetch(base + path, {
              headers: { 'User-Agent': 'Mozilla/5.0 MetroNews-CF-W4-Parser-Probe/1.0' },
              signal: AbortSignal.timeout(15000),
            });
            const xml = await response.text();
            const rawItems = [...xml.matchAll(/<item>([\s\S]*?)<\/item>/g)];
            const parsed = parseRSS(xml, '香港01', path.includes('/channel/') ? 'video' : 'local');

            console.log(`\n=== ${path} ===`);
            console.log(`http=${response.status} bytes=${xml.length} rawItems=${rawItems.length} workerParsed=${parsed.length}`);
            console.log('first parsed items:');
            for (const item of parsed.slice(0, 3)) {
              console.log(JSON.stringify({
                title: compact(item.title),
                link: compact(item.link),
                pubDate: compact(item.pubDate),
                descriptionLength: item.descriptionLength,
              }));
            }

            if (rawItems.length > 0) {
              const first = rawItems[0][1];
              const tagSummary = [...first.matchAll(/<([A-Za-z0-9:_-]+)(?:\s|>)/g)].map(m => m[1]).slice(0, 20);
              console.log(`first raw item tags=${JSON.stringify(tagSummary)}`);
              console.log(`first raw item has exact <link>=${/<link>([\s\S]*?)<\/link>/.test(first)}`);
              console.log(`first raw item snippet=${compact(first, 500)}`);
            }
          }
