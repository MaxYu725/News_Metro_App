name: CF-W4 D1 link inventory probe

on:
  push:
    branches:
      - agent/cf-w4r2-upstream-diagnosis
    paths:
      - .github/workflows/cf-w4-rss-probe.yml

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Compare image feed links with paginated public production inventory
        shell: node {0}
        run: |
          const RSS_BASE = 'https://rsshub.rssforever.com';
          const WORKER = 'https://news-proxy.maxyu0725us.workers.dev';
          const paths = ['/hk01/channel/259', '/hk01/channel/256'];

          function parseItems(xml) {
            const rows = [];
            for (const match of xml.matchAll(/<item>([\s\S]*?)<\/item>/g)) {
              const content = match[1];
              const title = (content.match(/<title><!\[CDATA\[([\s\S]*?)\]\]><\/title>/) || content.match(/<title>([\s\S]*?)<\/title>/))?.[1]?.trim() || '';
              const link = content.match(/<link>([\s\S]*?)<\/link>/)?.[1]?.trim() || '';
              const pubDate = content.match(/<pubDate>([\s\S]*?)<\/pubDate>/)?.[1]?.trim() || '';
              if (title && link) rows.push({ title, link, pubDate });
            }
            return rows;
          }

          const feedItems = [];
          for (const path of paths) {
            const response = await fetch(RSS_BASE + path, { signal: AbortSignal.timeout(15000) });
            const xml = await response.text();
            for (const item of parseItems(xml)) feedItems.push({ path, ...item });
          }

          const dbRows = [];
          let page = 0;
          while (page <= 500) {
            const batchPages = Array.from({ length: 6 }, (_, index) => page + index);
            const payloads = await Promise.all(batchPages.map(async currentPage => {
              const response = await fetch(`${WORKER}/api/news/latest?page=${currentPage}`, { signal: AbortSignal.timeout(12000) });
              if (!response.ok) throw new Error(`latest page ${currentPage} returned ${response.status}`);
              return { currentPage, payload: await response.json() };
            }));

            let done = false;
            for (const { currentPage, payload } of payloads.sort((a, b) => a.currentPage - b.currentPage)) {
              if (!payload.success || !Array.isArray(payload.data)) throw new Error(`invalid latest payload at page ${currentPage}`);
              dbRows.push(...payload.data);
              if (payload.data.length < 20 || payload.hasMore === false) {
                done = true;
                break;
              }
            }
            if (done) break;
            page += 6;
          }

          const byLink = new Map(dbRows.map(row => [row.link || row.id, row]));
          const categoryCounts = {};
          for (const row of dbRows) categoryCounts[row.category] = (categoryCounts[row.category] || 0) + 1;

          let found = 0;
          const foundCategories = {};
          for (const item of feedItems) {
            const row = byLink.get(item.link);
            if (row) {
              found += 1;
              foundCategories[row.category] = (foundCategories[row.category] || 0) + 1;
            }
            console.log(JSON.stringify({
              feed: item.path,
              title: item.title.slice(0, 90),
              link: item.link,
              feedPubDate: item.pubDate,
              inProductionD1: Boolean(row),
              dbCategory: row?.category || null,
              dbPubDate: row?.pubDate || null,
            }));
          }

          console.log(`\nproductionRowsRead=${dbRows.length}`);
          console.log(`productionCategoryCounts=${JSON.stringify(categoryCounts)}`);
          console.log(`feedItems=${feedItems.length} exactFeedLinksInProductionD1=${found}`);
          console.log(`collisionCategories=${JSON.stringify(foundCategories)}`);
