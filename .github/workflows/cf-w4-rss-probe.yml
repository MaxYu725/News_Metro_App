name: CF-W4R2 apply image upstream fix

on:
  push:
    branches:
      - agent/cf-w4r2-upstream-diagnosis
    paths:
      - .github/workflows/cf-w4-rss-probe.yml

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout diagnosis branch
        uses: actions/checkout@v4
        with:
          ref: agent/cf-w4r2-upstream-diagnosis

      - name: Apply confirmed image feed policy
        shell: python
        run: |
          from pathlib import Path
          import re

          source_path = Path('worker/src/index.js')
          source = source_path.read_text(encoding='utf-8')

          if 'sourceConfig.timeoutMs || 8000' not in source:
              source, count = re.subn(
                  r'setTimeout\(\(\) => controller\.abort\(\),\s*8000\)',
                  'setTimeout(() => controller.abort(), sourceConfig.timeoutMs || 8000)',
                  source,
                  count=1,
              )
              if count != 1:
                  raise SystemExit('fetch timeout marker missing')

          video_pattern = r"  video:\s*\[259,\s*256,\s*260,\s*348\]\.map\(channelId => \(\{[\s\S]*?\n  \}\)\),"
          video_replacement = """  video: [259, 256].map(channelId => ({
            name: '香港01',
            urls: [`https://rsshub.rssforever.com/hk01/channel/${channelId}`],
            timeoutMs: 20000,
          })),"""
          source, count = re.subn(video_pattern, video_replacement, source, count=1)
          if count != 1:
              raise SystemExit('old image channel mapping missing')

          source = source.replace(
              "console.warn('rss-source-empty', { category: categoryName, source: sourceConfig.name });",
              "console.warn('rss-source-empty', { category: categoryName, source: sourceConfig.name, timeoutMs: sourceConfig.timeoutMs || 8000, urlCount: sourceConfig.urls.length });",
              1,
          )

          source = re.sub(
              r"export default \{\s*async scheduled\(event, env, ctx\) \{\s*ctx\.waitUntil\(syncAllCategoriesAndCleanup\(env\)\);\s*\},\s*async fetch\(request, env, ctx\) \{",
              """export default {
            async scheduled(event, env, ctx) {
              ctx.waitUntil(syncAllCategoriesAndCleanup(env));
            },

            async fetch(request, env, ctx) {""",
              source,
              count=1,
          )
          source = re.sub(
              r"(await syncCategoryToDB\(category, env\);)\s*if \(forceSync\) await cleanUpOldArticles\(env\);",
              r"\1\n              if (forceSync) await cleanUpOldArticles(env);",
              source,
              count=1,
          )
          source_path.write_text(source, encoding='utf-8')

          validator_path = Path('.github/scripts/validate-worker-baseline.py')
          validator = validator_path.read_text(encoding='utf-8')
          start = validator.find('    # CF-W2: keep the image category')
          end = validator.find('\n    retention_sql =', start)
          if start < 0 or end < 0:
              raise SystemExit('image validator block missing')
          block = '''    # CF-W4R2: image archive uses only the two live, verified RSSHub channels.
          if '/hk01/zone/13' in source:
              fail('stale HK01 image aggregate feed must not be reintroduced')
          if '[259, 256]' not in source or '/hk01/channel/${channelId}' not in source:
              fail('verified HK01 image channel mapping is missing')
          if '[259, 256, 260, 348]' in source or 'channel/260' in source or 'channel/348' in source:
              fail('dead HK01 image channels must not be reintroduced')
          if 'https://rsshub.rssforever.com/hk01/channel/${channelId}' not in source:
              fail('image archive must use the verified rssforever endpoint')
          if 'timeoutMs: 20000' not in source or 'sourceConfig.timeoutMs || 8000' not in source:
              fail('image archive timeout policy is missing')
          '''
          # YAML removes the common indentation from the embedded script; restore Python block indentation explicitly.
          block = '\n'.join(('    ' + line.lstrip()) if i == 0 else ('    ' + line.lstrip() if line.strip().startswith(('if ', "fail(")) else line) for i, line in enumerate(block.splitlines()))
          # Build the validator block directly to avoid indentation ambiguity.
          block = (
              "    # CF-W4R2: image archive uses only the two live, verified RSSHub channels.\n"
              "    if '/hk01/zone/13' in source:\n"
              "        fail('stale HK01 image aggregate feed must not be reintroduced')\n"
              "    if '[259, 256]' not in source or '/hk01/channel/${channelId}' not in source:\n"
              "        fail('verified HK01 image channel mapping is missing')\n"
              "    if '[259, 256, 260, 348]' in source or 'channel/260' in source or 'channel/348' in source:\n"
              "        fail('dead HK01 image channels must not be reintroduced')\n"
              "    if 'https://rsshub.rssforever.com/hk01/channel/${channelId}' not in source:\n"
              "        fail('image archive must use the verified rssforever endpoint')\n"
              "    if 'timeoutMs: 20000' not in source or 'sourceConfig.timeoutMs || 8000' not in source:\n"
              "        fail('image archive timeout policy is missing')\n"
          )
          validator = validator[:start] + block.rstrip() + validator[end:]
          validator_path.write_text(validator, encoding='utf-8')

          Path('.deploy/worker-production.txt').write_text(
              'CF-W4R2 production retry: verified HK01 image channels 259/256 via rssforever with archive-specific 20s timeout.\n',
              encoding='utf-8',
          )

      - name: Validate generated patch
        shell: bash
        run: |
          set -euo pipefail
          node --check worker/src/index.js
          python3 .github/scripts/validate-worker-baseline.py

      - name: Commit confirmed fix
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add worker/src/index.js .github/scripts/validate-worker-baseline.py .deploy/worker-production.txt
          git commit -m "CF-W4R2: stabilize HK01 image archive fetch"
          git push origin HEAD:agent/cf-w4r2-upstream-diagnosis
