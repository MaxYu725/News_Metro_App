name: HK01 cursor depth probe

on:
  push:
    branches:
      - diagnostic/ns2c3r2-hk01-cursor-depth
    paths:
      - .github/workflows/hk01-cursor-depth-probe.yml

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: production
    env:
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - name: Install pinned Wrangler
        working-directory: worker
        run: npm install --ignore-scripts --no-audit --no-fund
      - name: Read archive HK01 state and floors
        shell: bash
        run: |
          set -euo pipefail
          cd worker
          npx wrangler d1 execute ARCHIVE_01 --remote --json --command "SELECT source_key,cursor,pages_fetched,rows_inserted,last_pubDate,exhausted FROM archive_backfill_state WHERE source_key LIKE 'hk01:%' ORDER BY source_key" > /tmp/state.json
          npx wrangler d1 execute ARCHIVE_01 --remote --json --command "SELECT category,COUNT(*) AS n,MIN(pubDate) AS floor,MAX(pubDate) AS newest FROM articles WHERE source='香港01' GROUP BY category ORDER BY category" > /tmp/floors.json
          node <<'NODE'
          const fs=require('fs');
          const rows=p=>{const f=Array.isArray(p)?p[0]:p?.result?.[0];return f?.results||f?.result?.results||[]};
          const s=rows(JSON.parse(fs.readFileSync('/tmp/state.json','utf8')));
          const f=rows(JSON.parse(fs.readFileSync('/tmp/floors.json','utf8')));
          console.log('STATE '+JSON.stringify(s));
          console.log('FLOORS '+JSON.stringify(f));
          fs.writeFileSync('/tmp/state-rows.json',JSON.stringify(s));
          fs.writeFileSync('/tmp/floor-rows.json',JSON.stringify(f));
          NODE
      - name: Probe current and next HK01 pages
        shell: bash
        run: |
          set -euo pipefail
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          import {HK01_HISTORICAL_ZONES,fetchHk01HistoricalPage} from './worker/src/archive-backfill.js';
          const states=JSON.parse(fs.readFileSync('/tmp/state-rows.json','utf8'));
          const floors=JSON.parse(fs.readFileSync('/tmp/floor-rows.json','utf8'));
          const sm=new Map(states.map(x=>[x.source_key,x]));
          const fm=new Map(floors.map(x=>[x.category,x]));
          for(const zone of HK01_HISTORICAL_ZONES){
            const key=`hk01:zone:${zone.zoneId}`;
            const st=sm.get(key)||{};
            const floor=String(fm.get(zone.category)?.floor||'');
            let cursor=String(st.cursor||'');
            console.log(`ZONE ${zone.zoneId}/${zone.category} state cursor=${cursor||'<empty>'} last=${st.last_pubDate||''} exhausted=${st.exhausted||0} rows=${st.rows_inserted||0} pages=${st.pages_fetched||0} floor=${floor}`);
            for(let i=1;i<=2;i++){
              const page=await fetchHk01HistoricalPage(zone,cursor);
              const dates=page.articles.map(x=>x.pubDate).filter(Boolean).sort();
              const older=page.articles.filter(x=>floor && x.pubDate<floor).length;
              console.log(`  PAGE${i} cursor=${cursor||'<empty>'} articles=${page.articles.length} olderThanFloor=${older} min=${dates[0]||''} max=${dates.at(-1)||''} next=${page.nextCursor||'<none>'}`);
              if(!page.nextCursor||page.nextCursor===cursor) break;
              cursor=page.nextCursor;
              await new Promise(r=>setTimeout(r,120));
            }
          }
          NODE
      - run: echo 'HK01 cursor depth read-only probe PASS'
