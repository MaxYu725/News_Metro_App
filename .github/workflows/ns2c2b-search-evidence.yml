name: NS2C2B search evidence

on:
  push:
    branches:
      - probe/ns2c2b-search-evidence
    paths:
      - .github/workflows/ns2c2b-search-evidence.yml

permissions:
  contents: read

jobs:
  evidence:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    environment: production
    env:
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
      LIVE_DB: metro_news_db
      ARCHIVE_DB: metro_news_archive_01
      PROBE_NAME: metro-news-ns2c2-search-probe
      PROBE_URL: https://metro-news-ns2c2-search-probe.maxyu0725us.workers.dev
    steps:
      - uses: actions/checkout@v4

      - name: Install pinned Wrangler
        working-directory: worker
        run: npm install --ignore-scripts --no-audit --no-fund

      - name: Verify archive FTS with known terms
        id: terms
        working-directory: worker
        shell: bash
        run: |
          set -euo pipefail
          npx wrangler d1 execute "$ARCHIVE_DB" --remote --json --command "SELECT title,source,pubDate FROM articles WHERE source='香港01' ORDER BY pubDate DESC LIMIT 1" > /tmp/hk01-title.json
          npx wrangler d1 execute "$ARCHIVE_DB" --remote --json --command "SELECT title,source,pubDate FROM articles WHERE source='巴士的報' ORDER BY pubDate DESC LIMIT 1" > /tmp/bastille-title.json
          node <<'NODE'
          const fs=require('fs');
          const getRow=p=>{const d=JSON.parse(fs.readFileSync(p,'utf8'));return (Array.isArray(d)?d[0]:d).results?.[0]||{}};
          const getTerm=(title,n=5)=>{
            const chars=Array.from(String(title||''));
            for(let i=0;i<=chars.length-n;i++){
              const s=chars.slice(i,i+n).join('');
              if(/^\p{Script=Han}+$/u.test(s)) return s;
            }
            throw new Error(`No ${n}-Han term in title: ${title}`);
          };
          const hk=getRow('/tmp/hk01-title.json');
          const ba=getRow('/tmp/bastille-title.json');
          const hkTerm=getTerm(hk.title,5), baTerm=getTerm(ba.title,5);
          fs.appendFileSync(process.env.GITHUB_OUTPUT,`hk_term=${hkTerm}\nba_term=${baTerm}\n`);
          console.log(JSON.stringify({hk01:{title:hk.title,term:hkTerm,pubDate:hk.pubDate},bastille:{title:ba.title,term:baTerm,pubDate:ba.pubDate}},null,2));
          NODE
          hk_term='${{ steps.terms.outputs.hk_term }}'
          true

      - name: Run direct archive FTS hit checks
        working-directory: worker
        env:
          HK_TERM: ${{ steps.terms.outputs.hk_term }}
          BA_TERM: ${{ steps.terms.outputs.ba_term }}
        shell: bash
        run: |
          set -euo pipefail
          for term in "$HK_TERM" "$BA_TERM"; do
            test -n "$term"
            npx wrangler d1 execute "$ARCHIVE_DB" --remote --json --command "SELECT a.title,a.pubDate,a.source FROM articles_fts JOIN articles a ON a.rowid=articles_fts.rowid WHERE articles_fts MATCH '\"${term}\"' ORDER BY a.pubDate DESC LIMIT 10" > "/tmp/fts-${term}.json"
            cat "/tmp/fts-${term}.json"
            jq -e '.[0].success == true and (.[0].results | length) > 0' "/tmp/fts-${term}.json" >/dev/null
            jq '.[0] | {hits:(.results|length), meta:{duration:.meta.duration,rows_read:.meta.rows_read,size_after:.meta.size_after}, first:.results[0]}' "/tmp/fts-${term}.json"
          done

      - name: Inspect HK01 zone API pagination contract
        shell: bash
        run: |
          set -euo pipefail
          node <<'NODE'
          const url='https://web-data.api.hk01.com/v2/feed/zone/1';
          const r=await fetch(url,{headers:{'User-Agent':'Mozilla/5.0','Accept':'application/json'}});
          if(!r.ok) throw new Error(`HK01 zone API HTTP ${r.status}`);
          const j=await r.json();
          const data=j?.data ?? j;
          const items=Array.isArray(data?.items)?data.items:[];
          const compact={};
          for(const [k,v] of Object.entries(data||{})){
            if(k==='items') continue;
            if(v===null || ['string','number','boolean'].includes(typeof v)) compact[k]=v;
            else if(Array.isArray(v)) compact[k]={type:'array',length:v.length};
            else if(typeof v==='object'){
              const o={};
              for(const [kk,vv] of Object.entries(v)) if(vv===null || ['string','number','boolean'].includes(typeof vv)) o[kk]=vv;
              compact[k]=o;
            }
          }
          const summarize=x=>({
            type:x?.type,
            id:x?.data?.articleId ?? x?.articleId ?? x?.id,
            publishTime:x?.data?.publishTime ?? x?.publishTime,
            title:x?.data?.title ?? x?.title,
            keys:Object.keys(x||{}),
            dataKeys:Object.keys(x?.data||{}),
          });
          const paginationSignals=[];
          const walk=(obj,path='',depth=0)=>{
            if(depth>4 || !obj || typeof obj!=='object') return;
            for(const [k,v] of Object.entries(obj)){
              if(k==='items') continue;
              const p=path?`${path}.${k}`:k;
              if(/page|cursor|next|offset|limit|more|before|after|timestamp|last|start|end/i.test(k)){
                paginationSignals.push({path:p,value:(v && typeof v==='object')?'[object]':v});
              }
              walk(v,p,depth+1);
            }
          };
          walk(data);
          console.log('=== HK01 ZONE API STRUCTURE ===');
          console.log(JSON.stringify({httpStatus:r.status,topKeys:Object.keys(j||{}),dataKeys:Object.keys(data||{}),itemCount:items.length,nonItemFields:compact,paginationSignals,first:items.length?summarize(items[0]):null,last:items.length?summarize(items.at(-1)):null},null,2));
          NODE

      - name: Deploy isolated dual-D1 search Worker
        shell: bash
        run: |
          set -euo pipefail
          cat > /tmp/ns2c2-search-worker.js <<'JS'
          function phrase(q){return `"${q.replaceAll('"','""')}"`;}
          async function run(db,q){
            const t=Date.now();
            const result=await db.prepare(`SELECT a.id,a.title,a.link,a.pubDate,a.description,a.category,a.source,a.imageUrl FROM articles_fts JOIN articles a ON a.rowid=articles_fts.rowid WHERE articles_fts MATCH ? ORDER BY a.pubDate DESC LIMIT 21`).bind(phrase(q)).all();
            return {rows:result.results||[],ms:Date.now()-t,meta:{duration:result.meta?.duration,rows_read:result.meta?.rows_read,size_after:result.meta?.size_after}};
          }
          export default {async fetch(request,env){
            const u=new URL(request.url); const q=(u.searchParams.get('q')||'').trim();
            if(Array.from(q).length<3) return Response.json({error:'q too short'},{status:400});
            const started=Date.now();
            const [live,archive]=await Promise.all([run(env.DB,q),run(env.ARCHIVE_01,q)]);
            const map=new Map();
            for(const row of [...live.rows,...archive.rows]) if(!map.has(row.id)) map.set(row.id,row);
            const merged=[...map.values()].sort((a,b)=>String(b.pubDate).localeCompare(String(a.pubDate))).slice(0,20);
            return Response.json({q,totalMs:Date.now()-started,live:{hits:live.rows.length,ms:live.ms,meta:live.meta},archive:{hits:archive.rows.length,ms:archive.ms,meta:archive.meta},mergedHits:merged.length,results:merged.map(({description,...r})=>r)});
          }};
          JS
          cat > /tmp/ns2c2-wrangler.jsonc <<'JSON'
          {
            "name":"metro-news-ns2c2-search-probe",
            "main":"ns2c2-search-worker.js",
            "compatibility_date":"2026-08-17",
            "preview_urls":false,
            "d1_databases":[
              {"binding":"DB","database_name":"metro_news_db","database_id":"f8b597e9-8976-4f56-806e-51c9faa68a68"},
              {"binding":"ARCHIVE_01","database_name":"metro_news_archive_01","database_id":"a3db6dc1-599c-4ace-b12c-142e56c3734a"}
            ]
          }
          JSON
          cd /tmp
          npm exec --yes wrangler@4.118.0 -- deploy --config /tmp/ns2c2-wrangler.jsonc

      - name: Benchmark live plus archive search
        env:
          HK_TERM: ${{ steps.terms.outputs.hk_term }}
          BA_TERM: ${{ steps.terms.outputs.ba_term }}
        shell: bash
        run: |
          set -euo pipefail
          sleep 2
          for label in hk-overlap bastille-archive; do
            if [ "$label" = hk-overlap ]; then term="$HK_TERM"; else term="$BA_TERM"; fi
            echo "=== $label / $term ==="
            for i in 1 2 3; do
              curl -sS --retry 2 --retry-delay 1 --get --data-urlencode "q=$term" "$PROBE_URL" > "/tmp/${label}-${i}.json"
              jq '{q,totalMs,live,archive,mergedHits,first:(.results[0]//null)}' "/tmp/${label}-${i}.json"
              jq -e '.live.meta.rows_read != null and .archive.meta.rows_read != null' "/tmp/${label}-${i}.json" >/dev/null
            done
          done

      - name: Remove isolated search Worker
        if: always()
        shell: bash
        run: npm exec --yes wrangler@4.118.0 -- delete "$PROBE_NAME" --force || true
