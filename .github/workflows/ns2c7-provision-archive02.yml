name: NS2C7 provision archive 02

on:
  push:
    branches:
      - feature/ns2c7-archive02-rollover
    paths:
      - .github/workflows/ns2c7-provision-archive02.yml
  pull_request:
    branches:
      - main
    paths:
      - .github/workflows/ns2c7-provision-archive02.yml

permissions:
  contents: write

jobs:
  provision:
    if: github.event_name == 'push' || github.event.pull_request.head.ref == 'feature/ns2c7-archive02-rollover'
    runs-on: ubuntu-latest
    timeout-minutes: 12
    environment: production
    env:
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/ns2c7-archive02-rollover
          fetch-depth: 0

      - name: Validate Cloudflare credentials
        shell: bash
        run: |
          set -euo pipefail
          test -n "${CLOUDFLARE_ACCOUNT_ID:-}" || { echo '::error::CF_ACCOUNT_ID is missing'; exit 1; }
          test -n "${CLOUDFLARE_API_TOKEN:-}" || { echo '::error::CF_API_TOKEN is missing'; exit 1; }

      - name: Install pinned Wrangler
        working-directory: worker
        run: npm install --ignore-scripts --no-audit --no-fund

      - name: Create or reuse archive shard 02
        shell: bash
        run: |
          set -euo pipefail
          cd worker
          npx wrangler d1 list --json > /tmp/d1-list-before.json
          archive_id=$(node -e "const p=require('/tmp/d1-list-before.json');const r=(Array.isArray(p)?p:p?.result||[]).find(x=>x?.name==='metro_news_archive_02');process.stdout.write(r?.uuid||r?.id||'')")
          if [[ -z "$archive_id" ]]; then
            echo 'Creating metro_news_archive_02 in APAC...'
            npx wrangler d1 create metro_news_archive_02 --location=apac
            npx wrangler d1 list --json > /tmp/d1-list-after.json
            archive_id=$(node -e "const p=require('/tmp/d1-list-after.json');const r=(Array.isArray(p)?p:p?.result||[]).find(x=>x?.name==='metro_news_archive_02');process.stdout.write(r?.uuid||r?.id||'')")
          else
            echo "Reusing existing metro_news_archive_02: ${archive_id}"
          fi
          [[ "$archive_id" =~ ^[0-9a-fA-F-]{36}$ ]] || { echo '::error::Unable to resolve ARCHIVE_02 UUID'; exit 1; }
          echo "$archive_id" > /tmp/archive02-id.txt

      - name: Enable read replication
        shell: bash
        run: |
          set -euo pipefail
          archive_id=$(cat /tmp/archive02-id.txt)
          api="https://api.cloudflare.com/client/v4/accounts/${CLOUDFLARE_ACCOUNT_ID}/d1/database/${archive_id}"
          curl -sS --retry 2 --retry-delay 1 -X PUT \
            -H "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" \
            -H 'Content-Type: application/json' \
            -d '{"read_replication":{"mode":"auto"}}' \
            "$api" > /tmp/archive02-replication.json
          jq -e '.success == true' /tmp/archive02-replication.json >/dev/null

      - name: Bind shard and ensure archive schema
        shell: bash
        run: |
          set -euo pipefail
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const path = 'worker/wrangler.jsonc';
          const config = JSON.parse(fs.readFileSync(path, 'utf8'));
          const id = fs.readFileSync('/tmp/archive02-id.txt', 'utf8').trim();
          config.d1_databases = (config.d1_databases || []).filter(item => item.binding !== 'ARCHIVE_02');
          const index = config.d1_databases.findIndex(item => item.binding === 'ARCHIVE_01');
          const shard = { binding: 'ARCHIVE_02', database_name: 'metro_news_archive_02', database_id: id, migrations_dir: 'archive-migrations' };
          config.d1_databases.splice(index >= 0 ? index + 1 : config.d1_databases.length, 0, shard);
          fs.writeFileSync(path, `${JSON.stringify(config, null, 2)}\n`);
          NODE
          cd worker
          npx wrangler d1 migrations apply metro_news_archive_02 --remote
          # Idempotent repair path: a prior interrupted bootstrap may have recorded migration history
          # before the schema audit completed. Reapply the CREATE IF NOT EXISTS baselines directly.
          npx wrangler d1 execute ARCHIVE_02 --remote --file archive-migrations/0000_archive_baseline.sql
          npx wrangler d1 execute ARCHIVE_02 --remote --file archive-migrations/0001_backfill_state.sql
          npx wrangler d1 execute ARCHIVE_02 --remote --json --command "SELECT COUNT(*) AS total_rows,(SELECT COUNT(*) FROM sqlite_master WHERE type='table' AND name='articles_fts') AS fts_table_count,(SELECT COUNT(*) FROM sqlite_master WHERE type='table' AND name='archive_backfill_state') AS state_table_count" > /tmp/archive02-schema.json
          cat /tmp/archive02-schema.json
          node -e "const p=require('/tmp/archive02-schema.json');const f=Array.isArray(p)?p[0]:p?.result?.[0];const r=f?.results?.[0]||f?.result?.results?.[0];if(Number(r?.total_rows||0)!==0||Number(r?.fts_table_count||0)!==1||Number(r?.state_table_count||0)!==1)throw new Error('ARCHIVE_02 schema audit failed')"

      - name: Commit provisioned binding
        shell: bash
        run: |
          set -euo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git rm .github/workflows/ns2c7-provision-archive02.yml
          git add worker/wrangler.jsonc
          git commit -m 'NS2C7: provision archive shard 02'
          git push origin HEAD:feature/ns2c7-archive02-rollover
