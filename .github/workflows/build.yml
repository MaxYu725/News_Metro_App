name: Build Metro News Android App

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Check out repository
        uses: actions/checkout@v4

      - name: ⚙️ Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: ☕ Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '21'

      - name: 📁 Prepare Web Directory
        run: |
          mkdir www
          cp index.html style.css app.js www/

      - name: 📦 Install Capacitor & Initialize
        run: |
          npm init -y
          npm install @capacitor/core @capacitor/cli @capacitor/android
          
          cat <<EOF > capacitor.config.json
          {
            "appId": "hk.metronews.app",
            "appName": "Metro News",
            "webDir": "www",
            "server": {
              "url": "https://github.com/MaxYu725/News_Metro_App/index.html",
              "cleartext": true
            }
          }
          EOF
          
          npx cap add android

      - name: 🔐 Configure Immersive Fullscreen Manifest & Permissions
        run: |
          MANIFEST="android/app/src/main/AndroidManifest.xml"
          sed -i '/<application/i \    <uses-permission android:name="android.permission.INTERNET" />\n    <uses-permission android:name="android.permission.ACCESS_NETWORK_STATE" />' $MANIFEST

      - name: 🔧 Fix Kotlin Duplicate Classes
        run: |
          cat <<EOF >> android/build.gradle
          
          subprojects {
              configurations.all {
                  resolutionStrategy {
                      force 'org.jetbrains.kotlin:kotlin-stdlib:1.8.22'
                      force 'org.jetbrains.kotlin:kotlin-stdlib-jdk7:1.8.22'
                      force 'org.jetbrains.kotlin:kotlin-stdlib-jdk8:1.8.22'
                  }
              }
          }
          EOF

      - name: 🛠️ Build Release APK with Keystore Signing
        working-directory: ./android
        env:
          RELEASE_KEYSTORE_BASE64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
          RELEASE_KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
          RELEASE_KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
          RELEASE_STORE_PASSWORD: ${{ secrets.RELEASE_STORE_PASSWORD }}
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: 📤 Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: MetroNews-Android-App
          path: android/app/build/outputs/apk/debug/app-debug.apk
