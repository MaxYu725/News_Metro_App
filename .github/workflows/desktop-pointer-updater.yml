name: Desktop pointer updater

on:
  push:
    branches:
      - agent/desktop-pointer-gestures
    paths:
      - .github/workflows/desktop-pointer-updater.yml

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout feature branch
        uses: actions/checkout@v4
        with:
          ref: agent/desktop-pointer-gestures

      - name: Apply pointer patch
        run: python3 .github/scripts/apply-desktop-pointer.py

      - name: Validate JavaScript syntax
        run: |
          set -euo pipefail
          node --check gestures.js
          node --check reader-ui.js
          node --check sw.js

      - name: Commit generated app changes
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add reader-ui.js sw.js
          git commit -m "MUI-P1: add mouse drag support to reader media"
          git push origin HEAD:agent/desktop-pointer-gestures
