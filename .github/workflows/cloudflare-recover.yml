name: Recover production Worker baseline

on:
  push:
    branches:
      - agent/cloudflare-readonly-audit
    paths:
      - .github/workflows/cloudflare-recover.yml
      - .github/scripts/recover-cloudflare-worker.py

permissions:
  contents: write

jobs:
  recover:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      CF_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
      CF_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
      WORKER_NAME: news-proxy
      RECOVERY_REVISION: "3"
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: agent/cloudflare-readonly-audit

      - name: Validate credentials
        shell: bash
        run: |
          set -euo pipefail
          test -n "${CF_ACCOUNT_ID:-}" || { echo "::error::CF_ACCOUNT_ID is missing"; exit 1; }
          test -n "${CF_API_TOKEN:-}" || { echo "::error::CF_API_TOKEN is missing"; exit 1; }

      - name: Download current production Worker bundle
        shell: bash
        run: |
          set -euo pipefail
          api="https://api.cloudflare.com/client/v4/accounts/${CF_ACCOUNT_ID}/workers/scripts/${WORKER_NAME}"
          code=$(curl -sS --retry 2 --retry-delay 1 \
            -D /tmp/worker.headers \
            -o /tmp/worker.multipart \
            -w '%{http_code}' \
            -H "Authorization: Bearer ${CF_API_TOKEN}" \
            "$api")
          if [[ "$code" -lt 200 || "$code" -ge 300 ]]; then
            echo "::error::Unable to download production Worker (HTTP ${code})"
            exit 1
          fi

      - name: Extract source and sanitized manifest
        shell: bash
        run: |
          set -euo pipefail
          rm -rf worker
          python3 .github/scripts/recover-cloudflare-worker.py \
            /tmp/worker.headers \
            /tmp/worker.multipart \
            worker

      - name: Validate recovered source
        shell: bash
        run: |
          set -euo pipefail
          test -s worker/src/index.js
          python3 .github/scripts/cloudflare-source-audit.py worker/src/index.js | tee /tmp/source-audit.txt
          grep -q '^env_refs=AI,API_KEY,DB$' /tmp/source-audit.txt
          grep -q '^hardcoded_secret_heuristic=none$' /tmp/source-audit.txt
          grep -q '^handlers=.*fetch:True.*scheduled:True.*export_default:True' /tmp/source-audit.txt

      - name: Record sanitized production settings and deployment provenance
        shell: bash
        run: |
          set -euo pipefail
          base="https://api.cloudflare.com/client/v4/accounts/${CF_ACCOUNT_ID}/workers/scripts/${WORKER_NAME}"
          auth=( -H "Authorization: Bearer ${CF_API_TOKEN}" )

          curl -sS --retry 2 --retry-delay 1 "${auth[@]}" "${base}/settings" > /tmp/settings.json
          curl -sS --retry 2 --retry-delay 1 "${auth[@]}" "${base}/deployments" > /tmp/deployments.json
          jq -e '.success == true' /tmp/settings.json >/dev/null
          jq -e '.success == true' /tmp/deployments.json >/dev/null

          settings=$(jq -c '.result | {
            compatibility_date,
            compatibility_flags,
            usage_model,
            observability,
            bindings: [(.bindings // [])[] | {
              name,
              type,
              id,
              namespace_id,
              bucket_name,
              class_name
            } | with_entries(select(.value != null))]
          }' /tmp/settings.json)
          deployment=$(jq -c '.result.deployments[0] // .result[0] // {} | {id,created_on,source,versions}' /tmp/deployments.json)

          jq --argjson settings "$settings" --argjson deployment "$deployment" \
            '. + {settings:$settings,deployment:$deployment}' \
            worker/recovery-manifest.json > /tmp/recovery-manifest.json
          mv /tmp/recovery-manifest.json worker/recovery-manifest.json

      - name: Commit recovered baseline
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add worker/src/index.js worker/recovery-manifest.json
          if git diff --cached --quiet; then
            echo "Recovered source already matches repository baseline."
            exit 0
          fi
          git commit -m "chore: recover production Worker baseline"
          git push origin HEAD:agent/cloudflare-readonly-audit
