name: NS2C2A archive D1 prototype

on:
  push:
    branches:
      - probe/ns2c2a-archive-prototype
    paths:
      - .github/workflows/ns2c2a-archive-prototype.yml

permissions:
  contents: read

jobs:
  prototype:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: production
    env:
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
      ARCHIVE_DB: metro_news_archive_01
    steps:
      - uses: actions/checkout@v4

      - name: Install pinned Wrangler
        working-directory: worker
        run: npm install --ignore-scripts --no-audit --no-fund

      - name: Create or locate isolated archive database
        working-directory: worker
        shell: bash
        run: |
          set -euo pipefail
          npx wrangler d1 list --json > /tmp/d1-list.json
          db_id=$(jq -r --arg name "$ARCHIVE_DB" '.[] | select(.name == $name) | .uuid // .id // empty' /tmp/d1-list.json | head -n1)
          if [ -z "$db_id" ]; then
            npx wrangler d1 create "$ARCHIVE_DB" >/tmp/d1-create.txt
            cat /tmp/d1-create.txt
            npx wrangler d1 list --json > /tmp/d1-list.json
            db_id=$(jq -r --arg name "$ARCHIVE_DB" '.[] | select(.name == $name) | .uuid // .id // empty' /tmp/d1-list.json | head -n1)
          fi
          test -n "$db_id"
          echo "Archive database id: $db_id"

      - name: Create lean searchable archive schema
        working-directory: worker
        shell: bash
        run: |
          set -euo pipefail
          cat > /tmp/archive-schema.sql <<'SQL'
          CREATE TABLE IF NOT EXISTS articles (id TEXT PRIMARY KEY,title TEXT NOT NULL,link TEXT NOT NULL,pubDate TEXT NOT NULL,description TEXT,category TEXT NOT NULL,source TEXT NOT NULL,imageUrl TEXT);
          CREATE INDEX IF NOT EXISTS idx_archive_pubDate ON articles(pubDate DESC);
          CREATE INDEX IF NOT EXISTS idx_archive_source_pubDate ON articles(source, pubDate DESC);
          CREATE VIRTUAL TABLE IF NOT EXISTS articles_fts USING fts5(title,description,content='articles',content_rowid='rowid',tokenize='trigram');
          CREATE TRIGGER IF NOT EXISTS articles_fts_ai AFTER INSERT ON articles BEGIN INSERT INTO articles_fts(rowid,title,description) VALUES (new.rowid,new.title,COALESCE(new.description,'')); END;
          CREATE TRIGGER IF NOT EXISTS articles_fts_ad AFTER DELETE ON articles BEGIN INSERT INTO articles_fts(articles_fts,rowid,title,description) VALUES ('delete',old.rowid,old.title,COALESCE(old.description,'')); END;
          CREATE TRIGGER IF NOT EXISTS articles_fts_au AFTER UPDATE ON articles BEGIN INSERT INTO articles_fts(articles_fts,rowid,title,description) VALUES ('delete',old.rowid,old.title,COALESCE(old.description,'')); INSERT INTO articles_fts(rowid,title,description) VALUES (new.rowid,new.title,COALESCE(new.description,'')); END;
          SQL
          npx wrangler d1 execute "$ARCHIVE_DB" --remote --file /tmp/archive-schema.sql

      - name: Copy 500 HK01 rows from live as storage sample
        working-directory: worker
        shell: bash
        run: |
          set -euo pipefail
          npx wrangler d1 execute metro_news_db --remote --json --command "SELECT id,title,link,pubDate,description,category,source,imageUrl FROM articles WHERE source='香港01' AND category <> 'video' ORDER BY pubDate DESC LIMIT 500" > /tmp/hk01.json
          node <<'NODE'
          const fs=require('fs'); const doc=JSON.parse(fs.readFileSync('/tmp/hk01.json','utf8')); const rows=(Array.isArray(doc)?doc[0]:doc).results||[]; const q=v=>v==null?'NULL':`'${String(v).replace(/'/g,"''")}'`;
          for(let b=0;b<Math.ceil(rows.length/100);b++){const s=rows.slice(b*100,(b+1)*100);fs.writeFileSync(`/tmp/hk01-${b}.sql`,s.map(r=>`INSERT OR IGNORE INTO articles (id,title,link,pubDate,description,category,source,imageUrl) VALUES (${q(r.id)},${q(r.title)},${q(r.link)},${q(r.pubDate)},${q(r.description)},${q(r.category)},${q(r.source)},${q(r.imageUrl)});`).join('\n'));} console.log(`HK01 sample rows=${rows.length}`);
          NODE
          for f in /tmp/hk01-*.sql; do npx wrangler d1 execute "$ARCHIVE_DB" --remote --file "$f"; done

      - name: Fetch and insert 500 historical Bastille rows
        shell: bash
        run: |
          set -euo pipefail
          cat > ./ns2c2a-bastille-history.mjs <<'NODE'
          import fs from 'node:fs'; import { parseBastilleRss } from './worker/src/sources/bastille.js'; const rows=[]; const seen=new Set();
          for(let page=891;page<=950&&rows.length<500;page++){const r=await fetch(`https://www.bastillepost.com/hongkong/feed?paged=${page}`,{headers:{'User-Agent':'MetroNews-NS2C2A/1.0','Accept':'application/rss+xml, application/xml, text/xml;q=0.9, */*;q=0.5'}}); if(!r.ok) throw new Error(`page ${page} HTTP ${r.status}`); for(const item of parseBastilleRss(await r.text())){if(seen.has(item.id))continue;seen.add(item.id);rows.push(item);if(rows.length>=500)break;} await new Promise(x=>setTimeout(x,100));}
          if(rows.length<450)throw new Error(`Only ${rows.length} rows`); const q=v=>v==null?'NULL':`'${String(v).replace(/'/g,"''")}'`; for(let b=0;b<Math.ceil(rows.length/100);b++){const s=rows.slice(b*100,(b+1)*100);fs.writeFileSync(`/tmp/bastille-${b}.sql`,s.map(r=>`INSERT OR IGNORE INTO articles (id,title,link,pubDate,description,category,source,imageUrl) VALUES (${q(r.id)},${q(r.title)},${q(r.link)},${q(r.pubDate)},${q(r.description)},${q(r.category)},${q(r.source)},${q(r.imageUrl)});`).join('\n'));} console.log(JSON.stringify({rows:rows.length,newest:rows[0]?.pubDate,oldest:rows.at(-1)?.pubDate}));
          NODE
          node ./ns2c2a-bastille-history.mjs
          cd worker
          for f in /tmp/bastille-*.sql; do npx wrangler d1 execute "$ARCHIVE_DB" --remote --file "$f"; done

      - name: Measure archive storage and FTS behavior
        working-directory: worker
        shell: bash
        run: |
          set -euo pipefail
          npx wrangler d1 execute "$ARCHIVE_DB" --remote --json --command "SELECT COUNT(*) AS total,SUM(CASE WHEN source='香港01' THEN 1 ELSE 0 END) AS hk01,SUM(CASE WHEN source='巴士的報' THEN 1 ELSE 0 END) AS bastille,MIN(pubDate) AS oldest,MAX(pubDate) AS newest,SUM(LENGTH(CAST(COALESCE(id,'') AS BLOB))+LENGTH(CAST(COALESCE(title,'') AS BLOB))+LENGTH(CAST(COALESCE(link,'') AS BLOB))+LENGTH(CAST(COALESCE(pubDate,'') AS BLOB))+LENGTH(CAST(COALESCE(description,'') AS BLOB))+LENGTH(CAST(COALESCE(category,'') AS BLOB))+LENGTH(CAST(COALESCE(source,'') AS BLOB))+LENGTH(CAST(COALESCE(imageUrl,'') AS BLOB))) AS logical_bytes FROM articles" > /tmp/archive-metrics.json
          cat /tmp/archive-metrics.json
          npx wrangler d1 execute "$ARCHIVE_DB" --remote --json --command "SELECT a.id,a.title,a.pubDate,a.source FROM articles_fts f JOIN articles a ON a.rowid=f.rowid WHERE articles_fts MATCH '香港' ORDER BY a.pubDate DESC LIMIT 10" > /tmp/archive-search.json
          cat /tmp/archive-search.json
          node <<'NODE'
          const fs=require('fs');const doc=JSON.parse(fs.readFileSync('/tmp/archive-metrics.json','utf8'));const first=Array.isArray(doc)?doc[0]:doc;const row=first.results?.[0]||{};const size=Number(first.meta?.size_after||0),logical=Number(row.logical_bytes||0),total=Number(row.total||0);if(total<950)throw new Error(`Only ${total} rows`);console.log('=== NS2C2A ARCHIVE RESULT ===');console.log(JSON.stringify({total,hk01:Number(row.hk01||0),bastille:Number(row.bastille||0),oldest:row.oldest,newest:row.newest,sizeBytes:size,sizeMiB:+(size/1048576).toFixed(2),logicalBytes:logical,logicalMiB:+(logical/1048576).toFixed(2),grossAmplification:logical?+(size/logical).toFixed(3):null,grossBytesPerArticle:total?Math.round(size/total):null},null,2));
          NODE
