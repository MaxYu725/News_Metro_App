name: Exact article image diagnosis

on:
  push:
    branches:
      - agent/image-fidelity-diagnosis
    paths:
      - .github/workflows/exact-article-image-diagnosis.yml

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Inspect rendered official page image variants
        env:
          ARTICLE_URL: 'https://www.hk01.com/article/60380674'
          TARGET_HASH: 'wu3KNfgiQF79tDWsMvK0NKr_WPw-uGYXO12X6ztdl-s'
        run: |
          set -euo pipefail
          google-chrome --version || true
          google-chrome --headless=new --disable-gpu --no-sandbox --hide-scrollbars \
            --window-size=1600,10000 --virtual-time-budget=12000 --dump-dom \
            "$ARTICLE_URL" > /tmp/rendered.html 2>/tmp/chrome.err || true
          echo "rendered_bytes=$(wc -c < /tmp/rendered.html)"
          python3 - <<'PY'
          import html, os, re, urllib.request, hashlib
          from pathlib import Path

          target=os.environ['TARGET_HASH']
          text=Path('/tmp/rendered.html').read_text('utf-8','ignore')
          text=html.unescape(text).replace('\\u0026','&').replace('\\/','/')
          print('target_occurrences=', text.count(target))
          for m in re.finditer(re.escape(target), text):
              a=max(0,m.start()-1000); b=min(len(text),m.end()+1000)
              print('\n=== RENDERED MATCH ===\n',text[a:b])

          urls=[]
          # Extract every quoted HTTP URL containing the target hash, preserving query params.
          for m in re.finditer(r'https://cdn\.hk01\.com/[^"\'<>\s,]+', text):
              u=m.group(0).rstrip(')]};')
              if target in u and u not in urls: urls.append(u)
          print('\n=== RENDERED TARGET URLS ===')
          for i,u in enumerate(urls): print(i,u)

          ua='Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 Chrome/151 Safari/537.36'
          def get(url):
              req=urllib.request.Request(url, headers={'User-Agent':ua,'Accept':'image/avif,image/webp,image/apng,image/svg+xml,image/*,*/*;q=0.8'})
              with urllib.request.urlopen(req, timeout=30) as r:
                  return dict(r.headers.items()),r.read(),r.geturl()

          for i,u in enumerate(urls):
              try:
                  h,b,final=get(u)
                  Path(f'/tmp/rendered-{i}.bin').write_bytes(b)
                  print('DOWNLOAD',i,'bytes=',len(b),'type=',h.get('Content-Type'),'sha=',hashlib.sha256(b).hexdigest(),'final=',final)
              except Exception as e:
                  print('DOWNLOAD_ERROR',i,repr(e))
          PY

      - name: Inspect rendered target dimensions
        if: always()
        run: |
          set +e
          echo '--- chrome stderr tail ---'
          tail -30 /tmp/chrome.err 2>/dev/null || true
          for f in /tmp/rendered-*.bin; do
            [ -e "$f" ] || continue
            echo "--- $f"
            ls -l "$f"
            file "$f"
          done
