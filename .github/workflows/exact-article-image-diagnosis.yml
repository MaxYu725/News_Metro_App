name: Exact article image diagnosis

on:
  push:
    branches:
      - agent/image-fidelity-diagnosis
    paths:
      - .github/workflows/exact-article-image-diagnosis.yml

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Probe target image CDN variants
        env:
          BASE_URL: 'https://cdn.hk01.com/di/media/images/dw/20260817/1165998298943721472421937.png/wu3KNfgiQF79tDWsMvK0NKr_WPw-uGYXO12X6ztdl-s'
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import hashlib, os, urllib.request
          from pathlib import Path

          base=os.environ['BASE_URL']
          variants=[
              ('plain', base),
              ('w720', base+'?v=w720'),
              ('w1080', base+'?v=w1080'),
              ('w1280', base+'?v=w1280'),
              ('w1440', base+'?v=w1440'),
              ('w1600', base+'?v=w1600'),
              ('w1920', base+'?v=w1920'),
              ('w2160', base+'?v=w2160'),
              ('w2560', base+'?v=w2560'),
              ('w1080r', base+'?v=w1080r1080_1527'),
              ('w1440r', base+'?v=w1440r1080_1527'),
              ('w1920r', base+'?v=w1920r1080_1527'),
          ]
          ua='Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 Chrome/151 Safari/537.36'
          for i,(label,url) in enumerate(variants):
              try:
                  req=urllib.request.Request(url, headers={'User-Agent':ua,'Accept':'image/avif,image/webp,image/*,*/*;q=0.8'})
                  with urllib.request.urlopen(req, timeout=30) as r:
                      body=r.read(); headers=dict(r.headers.items()); final=r.geturl()
                  Path(f'/tmp/{i:02d}-{label}.bin').write_bytes(body)
                  print(label,'bytes=',len(body),'type=',headers.get('Content-Type'),'sha=',hashlib.sha256(body).hexdigest(),'url=',url,'final=',final)
              except Exception as e:
                  print(label,'ERROR',repr(e),'url=',url)
          PY

      - name: Inspect dimensions
        if: always()
        run: |
          set +e
          for f in /tmp/*.bin; do
            [ -e "$f" ] || continue
            echo "--- $f"
            ls -l "$f"
            file "$f"
          done
