name: Exact article image diagnosis

on:
  push:
    branches:
      - agent/image-fidelity-diagnosis
    paths:
      - .github/workflows/exact-article-image-diagnosis.yml

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Inspect official page variants for target image
        env:
          ARTICLE_ID: '60380674'
          TARGET_HASH: 'wu3KNfgiQF79tDWsMvK0NKr_WPw-uGYXO12X6ztdl-s'
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import hashlib, html, os, re, urllib.request
          from pathlib import Path

          aid=os.environ['ARTICLE_ID']
          target=os.environ['TARGET_HASH']
          ua='Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 Chrome/151 Safari/537.36'
          def get(url):
              req=urllib.request.Request(url, headers={'User-Agent':ua,'Accept':'text/html,application/xhtml+xml,application/json,image/avif,image/webp,image/*,*/*;q=0.8'})
              with urllib.request.urlopen(req, timeout=30) as r:
                  return r.status, dict(r.headers.items()), r.read(), r.geturl()

          sources=[]
          for label,url in [
              ('api', f'https://web-data.api.hk01.com/v2/page/article/{aid}'),
              ('page', f'https://www.hk01.com/article/{aid}')
          ]:
              status,headers,body,final=get(url)
              text=body.decode('utf-8','ignore')
              print('SOURCE',label,'status=',status,'final=',final,'bytes=',len(body))
              normalized=html.unescape(text).replace('\\u0026','&').replace('\\/','/')
              for m in re.finditer(re.escape(target), normalized):
                  a=max(0,m.start()-450); b=min(len(normalized),m.end()+450)
                  print('\nMATCH',label,normalized[a:b])
              sources.append((label,normalized))

          urls=[]
          for label,text in sources:
              pat=re.compile(r'https://cdn\.hk01\.com/[^"\'<>\\s]*'+re.escape(target)+r'[^"\'<>\\s]*')
              for u in pat.findall(text):
                  u=u.rstrip('),]}')
                  if u not in [x[1] for x in urls]: urls.append((label,u))

          print('\n=== UNIQUE TARGET URLS ===')
          for i,(label,u) in enumerate(urls):
              print(i,label,u)
              try:
                  _,h,b,final=get(u)
                  path=Path(f'/tmp/target-{i}.bin'); path.write_bytes(b)
                  print(' bytes=',len(b),'type=',h.get('Content-Type'),'sha=',hashlib.sha256(b).hexdigest(),'final=',final)
              except Exception as e:
                  print(' ERROR',repr(e))
          PY

      - name: Inspect target image dimensions
        if: always()
        run: |
          set +e
          for f in /tmp/target-*.bin; do
            [ -e "$f" ] || continue
            echo "--- $f"
            ls -l "$f"
            file "$f"
          done
