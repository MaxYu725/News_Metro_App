name: CF-W5 search patch updater

on:
  push:
    branches:
      - agent/cf-w5-search-fts
    paths:
      - .github/workflows/cf-w5-updater.yml

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout CF-W5 branch
        uses: actions/checkout@v4
        with:
          ref: agent/cf-w5-search-fts

      - name: Apply CF-W5 patch
        run: python3 .github/scripts/apply-cf-w5.py

      - name: Validate generated non-workflow patch
        run: |
          set -euo pipefail
          node --check worker/src/index.js
          node --check worker/src/search.js
          node --check worker/test/search.test.mjs
          bash -n .github/scripts/validate-search-fts.sh
          bash -n .github/scripts/worker-production-smoke.sh
          bash -n .github/scripts/worker-production-d1-audit.sh
          python3 .github/scripts/validate-worker-baseline.py

      - name: Commit generated patch
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add worker/src/index.js worker/src/search.js worker/migrations/0001_search_fts.sql worker/test/search.test.mjs \
            .github/scripts/validate-worker-baseline.py .github/scripts/validate-search-fts.sh \
            .github/scripts/worker-production-smoke.sh .github/scripts/worker-production-d1-audit.sh \
            .deploy/worker-production.txt
          git commit -m "CF-W5: add indexed FTS5 search core"
          git push origin HEAD:agent/cf-w5-search-fts
