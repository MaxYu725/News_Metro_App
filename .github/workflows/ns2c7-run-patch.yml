name: NS2C7 apply Worker patch

on:
  push:
    branches:
      - feature/ns2c7-archive02-rollover
    paths:
      - .github/workflows/ns2c7-run-patch.yml
  pull_request:
    branches:
      - main
    paths:
      - .github/workflows/ns2c7-run-patch.yml

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/ns2c7-archive02-rollover
          fetch-depth: 0
      - name: Apply patch and validate
        run: |
          python3 .github/scripts/ns2c7-apply.py
          node --check worker/src/index.js
          node --check worker/src/archive-shards.js
          python3 .github/scripts/validate-worker-baseline.py
          cd worker
          npm install --ignore-scripts --no-audit --no-fund
          npm test
      - name: Commit result
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git rm .github/workflows/ns2c7-code-patch.yml .github/workflows/ns2c7-run-patch.yml .github/scripts/ns2c7-apply.py
          git add worker/src/index.js .github/scripts/validate-worker-baseline.py .deploy/worker-production.txt
          git commit -m 'NS2C7: wire archive shard 02 into Worker'
          git push origin HEAD:feature/ns2c7-archive02-rollover
