name: NS2C5 source-aware sync guard bootstrap

on:
  push:
    branches:
      - feature/ns2c5-source-controls

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/ns2c5-source-controls
          fetch-depth: 0
      - name: Patch source-aware sync guards
        shell: bash
        run: |
          python <<'PY'
          from pathlib import Path
          p = Path('worker/src/index.js')
          text = p.read_text()
          changes = [
            (
              "const { results: checkDB } = await env.DB.prepare(`SELECT count(*) as count FROM articles`).all();",
              "const { results: checkDB } = await env.DB.prepare(`SELECT count(*) as count FROM articles WHERE 1 = 1${sourceFilter.sql}`).bind(...sourceFilter.params).all();",
            ),
            (
              "const { results: checkDB } = await env.DB.prepare(`SELECT count(*) as count FROM articles WHERE category = ?`).bind(category).all();",
              "const { results: checkDB } = await env.DB.prepare(`SELECT count(*) as count FROM articles WHERE category = ?${sourceFilter.sql}`).bind(category, ...sourceFilter.params).all();",
            ),
          ]
          for old, new in changes:
              if old not in text:
                  raise SystemExit(f'needle missing: {old}')
              text = text.replace(old, new, 1)
          p.write_text(text)
          PY
          node --check worker/src/index.js
      - name: Commit guard fix
        shell: bash
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git rm .github/workflows/ns2c5-source-sync-guard-bootstrap.yml
          git add worker/src/index.js
          git commit -m 'NS2C5: make feed sync checks source-aware'
          git push origin HEAD:feature/ns2c5-source-controls
