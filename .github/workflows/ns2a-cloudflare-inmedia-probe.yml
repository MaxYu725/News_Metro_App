name: NS2A Cloudflare InMedia probe

on:
  push:
    branches:
      - feature/ns2a-inmedia-upstream-probe
    paths:
      - .github/workflows/ns2a-cloudflare-inmedia-probe.yml

permissions:
  contents: read

jobs:
  cloudflare-probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: production
    env:
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
      PROBE_NAME: metro-news-ns2a-probe
      PROBE_URL: https://metro-news-ns2a-probe.maxyu0725us.workers.dev
    steps:
      - name: Validate credentials
        run: |
          set -euo pipefail
          test -n "${CLOUDFLARE_ACCOUNT_ID:-}"
          test -n "${CLOUDFLARE_API_TOKEN:-}"

      - name: Write isolated probe Worker
        run: |
          cat > /tmp/ns2a-probe.js <<'EOF'
          const FEED = 'https://www.inmediahk.net/frontpage/js/rss.xml';
          const allowedHosts = new Set(['www.inmediahk.net', 'inmediahk.net']);

          async function upstreamFetch(target) {
            const url = new URL(target);
            if (url.protocol !== 'https:' || !allowedHosts.has(url.hostname)) {
              return new Response(JSON.stringify({ error: 'blocked target' }), {
                status: 400,
                headers: { 'content-type': 'application/json' },
              });
            }
            const response = await fetch(url.toString(), {
              headers: {
                'user-agent': 'MetroNews-NS2A-Probe/1.0',
                'accept': 'application/rss+xml, application/xml, text/xml, text/html;q=0.9, */*;q=0.5',
                'accept-language': 'zh-HK,zh-TW;q=0.9,en;q=0.6',
              },
              redirect: 'follow',
            });
            const body = await response.arrayBuffer();
            return new Response(body, {
              status: response.status,
              headers: {
                'content-type': response.headers.get('content-type') || 'application/octet-stream',
                'x-upstream-status': String(response.status),
                'x-upstream-final-url': response.url,
              },
            });
          }

          export default {
            async fetch(request) {
              const requestUrl = new URL(request.url);
              if (requestUrl.pathname === '/feed') return upstreamFetch(FEED);
              if (requestUrl.pathname === '/fetch') {
                const target = requestUrl.searchParams.get('url') || '';
                try { return await upstreamFetch(target); }
                catch (error) {
                  return new Response(JSON.stringify({ error: String(error) }), {
                    status: 502,
                    headers: { 'content-type': 'application/json' },
                  });
                }
              }
              return new Response('NS2A probe', { status: 200 });
            }
          };
          EOF

      - name: Deploy isolated probe Worker
        run: |
          set -euo pipefail
          npm exec --yes wrangler@4.118.0 -- deploy /tmp/ns2a-probe.js \
            --name "$PROBE_NAME" \
            --compatibility-date 2026-08-17

      - name: Probe InMedia through Cloudflare egress
        run: |
          set -euo pipefail
          sleep 2
          curl -sS --retry 2 --retry-delay 1 -D /tmp/headers.txt "$PROBE_URL/feed" -o /tmp/feed.xml || true
          echo '=== response headers ==='
          cat /tmp/headers.txt
          status=$(awk 'toupper($1) ~ /^HTTP\// { code=$2 } END { print code }' /tmp/headers.txt)
          bytes=$(wc -c < /tmp/feed.xml | tr -d ' ')
          items=$(grep -o '<item[ >]' /tmp/feed.xml | wc -l | tr -d ' ' || true)
          echo "cloudflare_http_status=$status"
          echo "feed_bytes=$bytes"
          echo "feed_items=$items"
          test "$status" = '200'
          test "$items" -ge 5

      - name: Remove isolated probe Worker
        if: always()
        run: |
          npm exec --yes wrangler@4.118.0 -- delete "$PROBE_NAME" --force || true
