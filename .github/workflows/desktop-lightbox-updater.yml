name: Desktop lightbox updater

on:
  push:
    branches:
      - agent/desktop-lightbox-navigation
    paths:
      - .github/workflows/desktop-lightbox-updater.yml

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout feature branch
        uses: actions/checkout@v4
        with:
          ref: agent/desktop-lightbox-navigation

      - name: Apply MUI-P2 patch
        run: python3 .github/scripts/apply-desktop-lightbox.py

      - name: Validate JavaScript syntax
        run: |
          set -euo pipefail
          node --check gestures.js
          node --check lightbox.js
          node --check sw.js

      - name: Commit generated app changes
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add gestures.js lightbox.js sw.js
          git commit -m "MUI-P2: add desktop lightbox and category navigation"
          git push origin HEAD:agent/desktop-lightbox-navigation
