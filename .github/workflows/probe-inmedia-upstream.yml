name: Probe InMedia upstream

on:
  workflow_dispatch:
  push:
    branches:
      - feature/ns2a-inmedia-upstream-probe
    paths:
      - .github/scripts/probe-inmedia-upstream.py
      - .github/workflows/probe-inmedia-upstream.yml

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Run read-only InMedia probe
        run: python3 .github/scripts/probe-inmedia-upstream.py

      - name: Upload probe report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: inmedia-upstream-probe
          path: inmedia-probe-report.json
          if-no-files-found: warn
          retention-days: 7
