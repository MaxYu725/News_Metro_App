<!DOCTYPE html>
<html lang="zh-HK">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <meta name="theme-color" content="#0a0d1a">
    <link rel="manifest" href="./manifest.json">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <title>Metro News</title>
    <link rel="icon" href="./ic_launcher.png" type="image/png">
    <link rel="apple-touch-icon" href="./ic_launcher.png">
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="./style.css">
</head>
<body class="h-screen w-screen flex flex-col pt-4 relative bg-[#0a0d1a] text-white select-none overflow-hidden">

    <!-- 🚀 全新動態幾何背景容器 (每次重新啟動隨機生成) -->
    <div id="app-bg-container" class="fixed inset-0 z-0 pointer-events-none overflow-hidden bg-[#0a0d1a]"></div>

    <!-- 圖片全螢幕燈箱 (Lightbox) -->
    <div id="lightbox-overlay" class="fixed inset-0 bg-black/95 z-[100] hidden flex flex-col justify-center items-center opacity-0 transition-opacity duration-200">
        <button id="lightbox-close" class="absolute top-6 right-6 text-white text-4xl font-light hover:text-gray-400 z-10 px-4 py-2">&times;</button>
        <div class="relative w-full h-full flex justify-center items-center overflow-hidden">
            <img id="lightbox-img" src="" class="max-w-full max-h-full object-contain transition-transform duration-100 ease-out origin-center" alt="全螢幕圖片">
        </div>
        <p class="absolute bottom-6 text-gray-400 text-xs tracking-widest uppercase">雙指縮放 · 雙擊還原</p>
    </div>

    <!-- 頂部導覽列 (Header Pivot) -->
    <header class="flex-shrink-0 px-5 relative z-10">
        <nav class="flex space-x-6 text-2xl mb-4 text-gray-400 overflow-x-auto hide-scrollbar justify-start" id="nav-menu"></nav>
    </header>

    <!-- 主內容滾動區域 -->
    <main class="flex-grow overflow-y-auto overflow-x-hidden hide-scrollbar pb-12 relative z-10 scroll-smooth" id="main-container">
        <div id="ptr-indicator" class="w-full flex items-center justify-center overflow-hidden transition-all duration-150" style="height: 0px;"></div>
        
        <div id="gallery-search-container" class="hidden px-5 mb-4 relative z-20">
            <input type="text" id="gallery-search-input" placeholder="搜尋靈感 (例: 健身, 楓葉)..." class="w-full bg-[#13182a]/70 backdrop-blur-md border border-white/20 px-4 py-3 text-white focus:outline-none focus:border-cyan-400 text-lg rounded-none shadow-lg">
        </div>

        <div id="loading-indicator" class="absolute inset-0 flex items-center justify-center hidden z-50">
            <div class="loader"></div>
        </div>
        
        <div id="news-grid" class="grid grid-cols-1 auto-rows-auto"></div>

        <div id="scroll-loading" class="w-full h-16 flex items-center justify-center hidden">
            <div class="loader-small"></div>
        </div>

        <button id="back-to-top" class="hidden-fab fixed bottom-8 right-6 w-14 h-14 bg-[#13182a]/80 backdrop-blur-md border border-white/30 text-white rounded-full flex justify-center items-center text-2xl z-40 hover:bg-white/20 active:scale-95 shadow-2xl">
            ↑
        </button>

        <!-- 設定視圖 (Settings View) -->
        <div id="settings-view" class="hidden flex-col space-y-8 pb-10 px-5 mt-4">
            <h2 class="text-3xl font-light mb-2 text-white">settings</h2>
            
            <div>
                <p class="text-xs text-gray-400 uppercase tracking-widest mb-3">導覽列板塊顯示設定</p>
                <div id="category-visibility-list" class="grid grid-cols-2 gap-2"></div>
            </div>

            <div class="flex flex-col space-y-3">
                <p class="text-xs text-gray-400 uppercase tracking-widest">自訂追蹤關鍵字</p>
                <div class="flex flex-col space-y-2" id="category-manager-list"></div>
                <div class="flex space-x-2 mt-2">
                    <input type="text" id="new-cat-input" placeholder="輸入追蹤關鍵字 (如: iPhone)..." class="bg-[#13182a]/80 border border-white/20 px-4 py-2 text-white focus:outline-none focus:border-cyan-400 flex-grow">
                    <button id="btn-add-cat" class="metro-btn">新增</button>
                </div>
            </div>

            <div>
                <p class="text-xs text-gray-400 uppercase tracking-widest mb-3">accent color</p>
                <div class="flex space-x-3">
                    <button class="color-btn w-10 h-10 bg-cyan-500 border-2 border-white" data-color="bg-cyan-500" data-border="border-l-cyan-400" data-text="text-cyan-400"></button>
                    <button class="color-btn w-10 h-10 bg-blue-600 border-2 border-transparent" data-color="bg-blue-600" data-border="border-l-blue-500" data-text="text-blue-400"></button>
                    <button class="color-btn w-10 h-10 bg-purple-600 border-2 border-transparent" data-color="bg-purple-600" data-border="border-l-purple-400" data-text="text-purple-400"></button>
                    <button class="color-btn w-10 h-10 bg-emerald-500 border-2 border-transparent" data-color="bg-emerald-500" data-border="border-l-emerald-400" data-text="text-emerald-400"></button>
                    <button class="color-btn w-10 h-10 bg-orange-500 border-2 border-transparent" data-color="bg-orange-500" data-border="border-l-orange-400" data-text="text-orange-400"></button>
                </div>
            </div>

            <div>
                <p class="text-xs text-gray-400 uppercase tracking-widest mb-3">typography size</p>
                <div class="flex space-x-2">
                    <button class="metro-btn" id="btn-font-minus">a -</button>
                    <div class="flex items-center justify-center px-4 bg-white/10 text-white font-bold tracking-wider" id="font-size-display">110%</div>
                    <button class="metro-btn" id="btn-font-plus">a +</button>
                    <button class="metro-btn" id="btn-font-reset">reset</button>
                </div>
            </div>
        </div>
    </main>

    <script type="module" src="./app.js"></script>
    <script>if ('serviceWorker' in navigator) { window.addEventListener('load', () => { navigator.serviceWorker.register('./sw.js').catch(()=>{}); }); }</script>
</body>
</html>
