<!DOCTYPE html>
<html lang="zh-HK">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <meta name="theme-color" content="#000000">
    <link rel="manifest" href="./manifest.json">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <title>Metro News</title>
    <link rel="icon" href="./ic_launcher.png" type="image/png">
    <link rel="apple-touch-icon" href="./ic_launcher.png">
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="./style.css">
    <script>
        window.addEventListener('error', function(e) {
            if(document.body) document.body.innerHTML = '<div style="color:#ff6b6b; padding:30px; font-size:16px; font-family:sans-serif; text-align:center; margin-top:20vh;"><h2>⚠️ 模組載入失敗</h2><p>這通常是因為瀏覽器快取了舊版檔案所導致。</p><p style="margin-top:20px;"><button onclick="window.location.reload(true)" style="background:#4CAF50; color:white; border:none; padding:10px 20px; border-radius:5px; font-size:16px;">點此強制重新整理</button></p></div>';
        });
        window.addEventListener('unhandledrejection', function(e) {
            if(document.body && e.reason && e.reason.message && e.reason.message.includes('export')) {
                 document.body.innerHTML = '<div style="color:#ff6b6b; padding:30px; font-size:16px; font-family:sans-serif; text-align:center; margin-top:20vh;"><h2>⚠️ 快取版本衝突</h2><p>系統偵測到新舊檔案不匹配。</p><p style="margin-top:20px;"><button onclick="window.location.reload(true)" style="background:#4CAF50; color:white; border:none; padding:10px 20px; border-radius:5px; font-size:16px;">點此強制重新整理</button></p></div>';
            }
        });
    </script>
</head>
<body class="h-screen w-screen flex flex-col pt-4 relative bg-black">

    <div id="lightbox-overlay" class="fixed inset-0 bg-black/95 z-[100] hidden flex flex-col justify-center items-center opacity-0 transition-opacity duration-300">
        <button id="lightbox-close" class="absolute top-6 right-6 text-white text-4xl font-light hover:text-gray-400 z-10 px-4 py-2 drop-shadow-lg">&times;</button>
        <div class="relative w-full h-full flex justify-center items-center overflow-hidden">
            <img id="lightbox-img" src="" class="max-w-full max-h-full object-contain transition-transform duration-100 ease-out origin-center" alt="全螢幕圖片">
        </div>
        <p class="absolute bottom-6 text-gray-400 text-xs tracking-widest uppercase">雙指縮放 · 雙擊還原</p>
    </div>

    <header class="flex-shrink-0 px-5">
        <nav class="flex space-x-6 text-2xl mb-4 text-gray-500 overflow-x-auto hide-scrollbar justify-start" id="nav-menu"></nav>
    </header>

    <main class="flex-grow overflow-y-auto overflow-x-hidden hide-scrollbar pb-12 relative scroll-smooth" id="main-container">
        <div id="ptr-indicator" class="w-full flex items-center justify-center overflow-hidden transition-all duration-200" style="height: 0px;"></div>
        
        <div id="gallery-search-container" class="hidden px-5 mb-4 relative z-20 transition-all duration-300">
            <input type="text" id="gallery-search-input" placeholder="搜尋靈感 (例: 健身, 楓葉)..." class="w-full bg-white/10 border border-white/30 px-4 py-3 text-white focus:outline-none focus:border-white shadow-lg text-lg rounded-none">
        </div>

        <div id="loading-indicator" class="absolute inset-0 flex items-center justify-center hidden z-50">
            <div class="loader"></div>
        </div>
        
        <div id="news-grid" class="grid grid-cols-1 gap-[2px] auto-rows-auto"></div>

        <div id="scroll-loading" class="w-full h-16 flex items-center justify-center hidden">
            <div class="loader-small"></div>
        </div>

        <button id="back-to-top" class="hidden-fab fixed bottom-8 right-6 w-14 h-14 bg-white/10 backdrop-blur-md border border-white/30 text-white rounded-full flex justify-center items-center text-2xl z-40 shadow-[0_0_15px_rgba(255,255,255,0.1)] hover:bg-white/30 active:scale-95 transition-all">
            ↑
        </button>

        <div id="settings-view" class="hidden flex-col space-y-10 pb-10 px-5 mt-4">
            <!-- 新增：自選新聞來源開關 -->
            <div>
                <p class="text-sm text-gray-500 uppercase tracking-widest mb-3">news sources (新聞來源)</p>
                <div class="flex flex-wrap gap-4 bg-white/5 p-4 rounded-none border border-white/10" id="source-selector-container">
                    <label class="flex items-center space-x-2 cursor-pointer">
                        <input type="checkbox" value="明報" class="source-checkbox w-5 h-5 accent-blue-600" checked>
                        <span class="text-lg font-light">明報</span>
                    </label>
                    <label class="flex items-center space-x-2 cursor-pointer">
                        <input type="checkbox" value="香港01" class="source-checkbox w-5 h-5 accent-blue-600" checked>
                        <span class="text-lg font-light">香港01</span>
                    </label>
                    <label class="flex items-center space-x-2 cursor-pointer">
                        <input type="checkbox" value="東網" class="source-checkbox w-5 h-5 accent-blue-600" checked>
                        <span class="text-lg font-light">東網</span>
                    </label>
                </div>
            </div>

            <div class="flex flex-col space-y-4">
                <h2 class="text-3xl font-light mb-2">settings</h2>
                <div class="flex flex-col space-y-3" id="category-manager-list"></div>
                <div class="flex space-x-2 mt-4">
                    <input type="text" id="new-cat-input" placeholder="輸入追蹤關鍵字 (如: iPhone)..." class="bg-black border border-white/30 px-4 py-2 text-white focus:outline-none focus:border-white flex-grow">
                    <button id="btn-add-cat" class="metro-btn">新增</button>
                </div>
            </div>

            <div>
                <p class="text-sm text-gray-500 uppercase tracking-widest mb-3">accent color</p>
                <div class="flex space-x-3">
                    <button class="color-btn w-10 h-10 bg-blue-600 border-2 border-white transition-all" data-color="bg-blue-600"></button>
                    <button class="color-btn w-10 h-10 bg-green-600 border-2 border-transparent transition-all" data-color="bg-green-600"></button>
                    <button class="color-btn w-10 h-10 bg-purple-700 border-2 border-transparent transition-all" data-color="bg-purple-700"></button>
                    <button class="color-btn w-10 h-10 bg-red-600 border-2 border-transparent transition-all" data-color="bg-red-600"></button>
                    <button class="color-btn w-10 h-10 bg-orange-600 border-2 border-transparent transition-all" data-color="bg-orange-600"></button>
                </div>
            </div>

            <div>
                <p class="text-sm text-gray-500 uppercase tracking-widest mb-3">typography size</p>
                <div class="flex space-x-2">
                    <button class="metro-btn" id="btn-font-minus">a -</button>
                    <div class="flex items-center justify-center px-4 bg-white/10 text-white font-bold tracking-wider" id="font-size-display">110%</div>
                    <button class="metro-btn" id="btn-font-plus">a +</button>
                    <button class="metro-btn" id="btn-font-reset">reset</button>
                </div>
            </div>
        </div>
    </main>

    <script type="module" src="./app.js"></script>
    <script>if ('serviceWorker' in navigator) { window.addEventListener('load', () => { navigator.serviceWorker.register('./sw.js').catch(()=>{}); }); }</script>
</body>
</html>
