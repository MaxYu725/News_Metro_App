<!DOCTYPE html>
<html lang="zh-HK">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <meta name="theme-color" content="#000000">
    
    <!-- PWA 全螢幕、桌面釘選與 Manifest 設置 (修復為相對路徑) -->
    <link rel="manifest" href="./manifest.json">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <title>Metro News</title>
    
    <!-- App Logo 設置 (修復為相對路徑) -->
    <link rel="icon" href="./ic_launcher.png" type="image/png">
    <link rel="apple-touch-icon" href="./ic_launcher.png">
    
    <!-- 引入 Tailwind CSS 與自訂樣式表 (修復為相對路徑) -->
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="./style.css">
</head>
<body class="h-screen w-screen flex flex-col pt-6 px-6 relative">

    <!-- 頂部 Pivot 導覽列 -->
    <header class="flex-shrink-0">
        <nav class="flex space-x-6 text-2xl mb-6 text-gray-500" id="nav-menu">
            <a data-category="local" class="nav-link active">本地</a>
            <a data-category="finance" class="nav-link">財經</a>
            <a data-category="global" class="nav-link">國際</a>
        </nav>
    </header>

    <!-- 主體內容容器 -->
    <main class="flex-grow overflow-y-auto overflow-x-hidden hide-scrollbar pb-12 relative" id="main-container">
        <!-- 載入中畫面 -->
        <div id="loading-indicator" class="absolute inset-0 flex items-center justify-center hidden z-50">
            <div class="loader"></div>
        </div>
        
        <!-- 新聞網格容器 (一排一個磚) -->
        <div id="news-grid" class="grid grid-cols-1 gap-3 auto-rows-auto mb-10">
            <!-- 內容將由 JavaScript 動態插入 -->
        </div>

        <!-- 底部設定與更多選項 (Metro 幾何風格) -->
        <section class="border-t border-white/20 pt-8 pb-10" id="settings-panel">
            
            <!-- 更多分類選單 -->
            <div class="mb-10 flex flex-col space-y-4">
                <button class="text-left text-xl font-light text-gray-300 hover:text-white hover:translate-x-1 transition-all">hong kong local news</button>
                <button class="text-left text-xl font-light text-gray-300 hover:text-white hover:translate-x-1 transition-all">entertainment & culture</button>
                <button class="text-left text-xl font-light text-gray-300 hover:text-white hover:translate-x-1 transition-all">technology & digital trends</button>
                <button class="text-left text-xl font-light text-gray-300 hover:text-white hover:translate-x-1 transition-all">your saved articles</button>
            </div>

            <!-- 主題色設定 (Accent Color) -->
            <div class="mb-8">
                <p class="text-sm text-gray-500 uppercase tracking-widest mb-3">accent color</p>
                <div class="flex space-x-3">
                    <button class="w-10 h-10 bg-blue-600 border-2 border-white focus:border-white transition-all"></button>
                    <button class="w-10 h-10 bg-green-600 border-2 border-transparent focus:border-white transition-all"></button>
                    <button class="w-10 h-10 bg-red-600 border-2 border-transparent focus:border-white transition-all"></button>
                </div>
            </div>

            <!-- 字體大小設定 (Typography Size) -->
            <div class="mb-8">
                <p class="text-sm text-gray-500 uppercase tracking-widest mb-3">typography size</p>
                <div class="flex space-x-2">
                    <button class="metro-btn" id="btn-font-minus">a -</button>
                    <div class="flex items-center justify-center px-4 bg-white/10 text-white font-bold tracking-wider" id="font-size-display">110%</div>
                    <button class="metro-btn" id="btn-font-plus">a +</button>
                    <button class="metro-btn" id="btn-font-reset">reset</button>
                </div>
            </div>

            <!-- 自動更新頻率 (Auto Update Frequency) -->
            <div class="mb-8">
                <p class="text-sm text-gray-500 uppercase tracking-widest mb-3">auto update frequency</p>
                <div class="flex space-x-2" id="update-freq-group">
                    <button class="metro-btn active">5 min</button>
                    <button class="metro-btn">15 min</button>
                    <button class="metro-btn">30 min</button>
                </div>
            </div>

        </section>
    </main>

    <!-- 引入主要邏輯腳本 (修復為相對路徑) -->
    <script src="./app.js"></script>
</body>
</html>
