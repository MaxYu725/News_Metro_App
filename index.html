<!DOCTYPE html>
<html lang="zh-HK">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <meta name="theme-color" content="#000000">
    <link rel="manifest" href="./manifest.json">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <title>Metro News</title>
    <link rel="icon" href="./ic_launcher.png" type="image/png">
    <link rel="apple-touch-icon" href="./ic_launcher.png">
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="./style.css">
</head>
<body class="h-screen w-screen flex flex-col pt-6 px-6 relative">

    <header class="flex-shrink-0">
        <nav class="flex space-x-6 text-2xl mb-6 text-gray-500 overflow-x-auto hide-scrollbar" id="nav-menu">
            <a data-category="local" class="nav-link active">本地</a>
            <a data-category="finance" class="nav-link">財經</a>
            <a data-category="global" class="nav-link">國際</a>
            <a data-category="settings" class="nav-link">設定</a>
        </nav>
    </header>

    <main class="flex-grow overflow-y-auto overflow-x-hidden hide-scrollbar pb-12 relative" id="main-container">
        <div id="loading-indicator" class="absolute inset-0 flex items-center justify-center hidden z-50">
            <div class="loader"></div>
        </div>
        
        <div id="news-grid" class="grid grid-cols-1 gap-3 auto-rows-auto"></div>

        <!-- Settings Page (獨立設定頁面) -->
        <div id="settings-view" class="hidden flex-col space-y-10 pb-10">
            <div class="flex flex-col space-y-4">
                <h2 class="text-3xl font-light mb-2">settings</h2>
                <button class="text-left text-xl font-light text-gray-300 hover:text-white transition-all">hong kong local news</button>
                <button class="text-left text-xl font-light text-gray-300 hover:text-white transition-all">entertainment & culture</button>
                <button class="text-left text-xl font-light text-gray-300 hover:text-white transition-all">technology & digital trends</button>
                <button class="text-left text-xl font-light text-gray-300 hover:text-white transition-all">your saved articles</button>
            </div>

            <div>
                <p class="text-sm text-gray-500 uppercase tracking-widest mb-3">accent color</p>
                <div class="flex space-x-3">
                    <button class="w-10 h-10 bg-blue-600 border-2 border-white transition-all"></button>
                    <button class="w-10 h-10 bg-green-600 border-2 border-transparent transition-all"></button>
                    <button class="w-10 h-10 bg-red-600 border-2 border-transparent transition-all"></button>
                </div>
            </div>

            <div>
                <p class="text-sm text-gray-500 uppercase tracking-widest mb-3">typography size</p>
                <div class="flex space-x-2">
                    <button class="metro-btn" id="btn-font-minus">a -</button>
                    <div class="flex items-center justify-center px-4 bg-white/10 text-white font-bold tracking-wider" id="font-size-display">110%</div>
                    <button class="metro-btn" id="btn-font-plus">a +</button>
                    <button class="metro-btn" id="btn-font-reset">reset</button>
                </div>
            </div>

            <div>
                <p class="text-sm text-gray-500 uppercase tracking-widest mb-3">auto update frequency</p>
                <div class="flex space-x-2" id="update-freq-group">
                    <button class="metro-btn active">5 min</button>
                    <button class="metro-btn">15 min</button>
                    <button class="metro-btn">30 min</button>
                </div>
            </div>
        </div>
    </main>

    <script src="./app.js"></script>
</body>
</html>
