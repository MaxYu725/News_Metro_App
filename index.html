<!DOCTYPE html>
<html lang="zh-HK">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <meta name="theme-color" content="#000000">
    <link rel="manifest" href="./manifest.json">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <title>Metro News</title>
    <link rel="icon" href="./ic_launcher.png" type="image/png">
    <link rel="apple-touch-icon" href="./ic_launcher.png">
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="./style.css">
</head>
<body class="h-screen w-screen flex flex-col pt-4 relative bg-black">

    <header class="flex-shrink-0 px-5">
        <nav class="flex space-x-6 text-2xl mb-4 text-gray-500 overflow-x-auto hide-scrollbar justify-start" id="nav-menu"></nav>
    </header>

    <main class="flex-grow overflow-y-auto overflow-x-hidden hide-scrollbar pb-12 relative scroll-smooth" id="main-container">
        <div id="ptr-indicator" class="w-full flex items-center justify-center overflow-hidden transition-all duration-200" style="height: 0px;"></div>
        
        <div id="loading-indicator" class="absolute inset-0 flex items-center justify-center hidden z-50">
            <div class="loader"></div>
        </div>
        
        <div id="news-grid" class="grid grid-cols-1 gap-[2px] auto-rows-auto"></div>

        <div id="scroll-loading" class="w-full h-16 flex items-center justify-center hidden">
            <div class="loader-small"></div>
        </div>

        <div id="settings-view" class="hidden flex-col space-y-10 pb-10 px-5 mt-4">
            <div class="flex flex-col space-y-4">
                <h2 class="text-3xl font-light mb-2">settings</h2>
                <div class="flex flex-col space-y-3" id="category-manager-list"></div>
                <div class="flex space-x-2 mt-4">
                    <input type="text" id="new-cat-input" placeholder="輸入新類別名稱..." class="bg-black border border-white/30 px-4 py-2 text-white focus:outline-none focus:border-white flex-grow">
                    <button id="btn-add-cat" class="metro-btn">新增</button>
                </div>
            </div>

            <div>
                <p class="text-sm text-gray-500 uppercase tracking-widest mb-3">accent color</p>
                <div class="flex space-x-3">
                    <button class="color-btn w-10 h-10 bg-blue-600 border-2 border-white transition-all" data-color="bg-blue-600"></button>
                    <button class="color-btn w-10 h-10 bg-green-600 border-2 border-transparent transition-all" data-color="bg-green-600"></button>
                    <button class="color-btn w-10 h-10 bg-purple-700 border-2 border-transparent transition-all" data-color="bg-purple-700"></button>
                    <button class="color-btn w-10 h-10 bg-red-600 border-2 border-transparent transition-all" data-color="bg-red-600"></button>
                    <button class="color-btn w-10 h-10 bg-orange-600 border-2 border-transparent transition-all" data-color="bg-orange-600"></button>
                </div>
            </div>

            <div>
                <p class="text-sm text-gray-500 uppercase tracking-widest mb-3">typography size</p>
                <div class="flex space-x-2">
                    <button class="metro-btn" id="btn-font-minus">a -</button>
                    <div class="flex items-center justify-center px-4 bg-white/10 text-white font-bold tracking-wider" id="font-size-display">110%</div>
                    <button class="metro-btn" id="btn-font-plus">a +</button>
                    <button class="metro-btn" id="btn-font-reset">reset</button>
                </div>
            </div>
        </div>
    </main>

    <script src="./app.js"></script>
</body>
</html>
